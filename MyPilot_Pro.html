+'<dt>Aujourd’hui</dt><dd>Votre journée : points de vigilance, planning, tâches en attente, journal, permanence et compteur.</dd>'
+'<dt>Prochain jour ouvré</dt><dd>Ce qui vous attend : activités prévues, dernière note de chaque dossier, tâches arrivant à échéance.</dd>'
+'<dt>Activités</dt><dd>L’ensemble de vos dossiers, avec recherche et filtres.</dd>'
+'<dt>Journal</dt><dd>Toutes vos notes et vos appels, du plus récent au plus ancien.</dd>'
+'<dt>Contacts</dt><dd>Les personnes et les organisations, leur historique et leurs liens.</dd>'
+'<dt>Options</dt><dd>Le fichier, les imports et exports, le rapport d’activité, les paramètres.</dd></dl>'
+'<h4>Le fichier de données</h4>'
+'<p>Tout vit dans un seul fichier, <code>mypilot-pro-data.json</code>, que vous choisissez au premier lancement. '
+'Tant qu’il n’est pas lié, seul l’onglet Options est accessible : c’est volontaire, pour ne pas saisir dans le vide. '
+'Une fois lié, chaque modification y est écrite toute seule, une seconde après la saisie.</p>'
+'<p class="pa-astuce">L’application ne fait aucun appel réseau. Rien ne sort de votre poste, et elle fonctionne '
+'sans connexion. C’est ce qui la rend utilisable sur un poste professionnel.</p>'
+'<h4>Pour bien démarrer</h4><ol>'
+'<li><b>Options</b> → « Ouvrir ou créer un fichier ». Choisissez son emplacement une fois pour toutes.</li>'
+'<li>Vérifiez vos <b>catégories d’activité</b> dans Options → Configurer les catégories.</li>'
+'<li>Créez une activité depuis <b>Aujourd’hui</b>, avec les boutons « + » sous le planning.</li>'
+'<li>Notez ce que vous faites au fil de la journée : une ligne suffit, le temps se cumule tout seul.</li></ol>' },

{ id:"aujourdhui", titre:"Aujourd’hui et Prochain jour", vues:["jour","suivant"], html:
 '<h4>Points de vigilance</h4>'
+'<p>Ce qui doit rester sous vos yeux sans relever d’un dossier : une consigne, un aléa, une alerte. '
+'Trois niveaux : <i>information</i>, <i>attention</i>, <i>critique</i>.</p>'
+'<p>La date que vous posez est une <b>échéance de validité</b>, pas une date d’apparition : le point reste '
+'affiché jusque-là. Une fois la date passée, il <b>ne disparaît pas</b> — il est signalé comme dépassé, et c’est '
+'vous qui décidez de le lever.</p>'
+'<h4>Planning du jour</h4>'
+'<p>Les activités datées d’aujourd’hui. Le bouton <b>Noter</b> ouvre un compte rendu déjà amorcé : '
+'le motif de l’activité ouvre le texte, le temps prévu est pré-rempli, et vous pouvez faire avancer le statut '
+'dans le même geste. Rien n’est enregistré si vous n’écrivez rien de plus que le motif.</p>'
+'<h4>Dossiers non pilotés</h4>'
+'<p>Un dossier est <b>piloté</b> s’il porte au moins une <b>tâche en attente</b>, ou une '
+'<b>date à venir</b> — aujourd’hui compris. Sinon rien ne le ramènera jamais sous vos yeux : '
+'il sort du radar sans que personne ne l’ait décidé. Le bloc liste les plus délaissés ; '
+'la liste déroulante <b>Non pilotés</b> de l’onglet Activités donne la totalité.</p>'
+'<p>Pour en sortir un, une seule chose suffit : une suite à donner, ou une date. Un dossier '
+'clos, annulé ou archivé n’est jamais compté. Les dossiers déjà réclamés par « Passées sans '
+'trace » ne sont pas répétés dans ce bloc — ils le sont dans le filtre et dans le rapport, '
+'où la définition est entière.</p>'
+'<h4>Passées sans trace</h4>'
+'<p>Ce bloc n’apparaît que s’il a quelque chose à dire. Il liste les activités dont la date est '
+'<b>passée</b> sans qu’aucune note ne leur soit rattachée — ni le jour dit, ni depuis. C’est le filet '
+'au retour d’une absence : un rendez-vous ou une date d’intervention qui tombe pendant un arrêt ne '
+'disparaît pas silencieusement.</p>'
+'<p>Une activité en sort de trois façons : une <b>note</b> lui est rattachée (bouton <b>Noter</b>), elle est '
+'<b>close ou annulée</b>, ou vous déclarez qu’il n’y avait <b>rien à noter</b>. Les activités écartées ne sont '
+'pas perdues : le bouton en bas du bloc les réaffiche et permet de les remettre dans la liste. '
+'Le jour même ne compte jamais — la journée n’est pas finie.</p>'
+'<h4>Une note ou une tâche saisie depuis une activité</h4>'
+'<p>Le bloc <b>+ Note</b> / <b>+ Tâche</b> d’une fiche a son propre bouton d’ajout : '
+'« Enregistrer » enregistre l’activité, pas ce bloc. Si vous quittez la fiche avec du texte '
+'encore dans le champ, l’application vous arrête — <b>Enregistrer</b> est bloqué, et Fermer, '
+'la croix ou Échap demandent confirmation. Ajoutez, ou videz le champ.</p>'
+'<h4>En attente</h4>'
+'<p>Les tâches ouvertes, filtrées par horizon. <b>Aujourd’hui</b> ne montre que les tâches <i>datées</i> échues '
+'ou en retard ; les autres horizons incluent aussi les tâches sans échéance, qui forment votre réserve. '
+'Le compteur du bouton « Aujourd’hui » reste visible depuis n’importe quel horizon.</p>'
+'<p><b>Reporter.</b> Chaque tâche porte un bouton <b>Reporter</b> qui déplie des raccourcis : '
+'1J, 2J, 5J, 1S, 2S, 1M, et <b>Autre…</b> pour choisir une date. Le report part '
+'<b>d’aujourd’hui</b> si la tâche est en retard, et <b>de son échéance</b> si elle est encore '
+'à venir — décaler d’un jour une tâche échue depuis une semaine en la laissant dans le passé '
+'n’avancerait à rien. Si la date tombe un jour non travaillé, elle glisse au jour ouvré suivant. '
+'Survolez un raccourci pour voir la date qu’il donnera.</p>'
+'<p><b>Appels et vérifications s’exportent séparément.</b> Les vérifications de permanence '
+'sont rangées avec les appels dans le fichier de données, mais ce ne sont pas des appels : '
+'elles n’ont ni interlocuteur, ni durée, ni objet. « Exporter les appels » ne contient donc '
+'que de vrais appels ; « Exporter les vérifications » donne les vérifications avec, pour '
+'chacune, l’<b>écart en minutes depuis la précédente du même intitulé ce jour-là</b>, la '
+'cadence attendue, et si elle a été tenue. C’est la cadence qui dit si la permanence a été '
+'réellement tenue, pas le nombre de lignes.</p>'
+'<h4>Où passe le temps</h4>'
+'<p>La répartition du temps imputé, sur la journée ou sur sept jours. Le temps vient des notes, '
+'du chronomètre du compteur et des appels de permanence.</p>'
+'<h4>Prochain jour ouvré</h4>'
+'<p>Calculé d’après vos jours travaillés, les jours fériés et vos absences déclarées — pas simplement « demain ».</p>' },

{ id:"idees", titre:"Idées", vues:["idees"], html:
 '<p class="pa-intro">L’onglet <b>Idées</b> est un carnet : vous y déposez ce qui vous traverse l’esprit '
+'sans l’organiser tout de suite. L’application rapproche d’elle-même les idées qui se ressemblent, '
+'et vous pouvez ensuite les faire mûrir, puis les transformer en activité du pilotage.</p>'
+'<h4>Déposer une idée</h4>'
+'<p>Un titre en une ligne suffit. La note en dessous est facultative : contexte, raison, détail. '
+'La catégorie est celle de l’activité que l’idée deviendrait si elle aboutit — elle n’engage à rien.</p>'
+'<h4>Le regroupement</h4>'
+'<p>Les idées qui partagent des mots se regroupent automatiquement : même teinte dans la vue '
+'<b>Bulles</b>, même groupe dans la vue <b>Tableau</b>. Le curseur <b>Regroupement</b> règle la '
+'sensibilité : vers la gauche les groupes sont larges et nombreux, vers la droite ils sont stricts et rares. '
+'Ce calcul se fait entièrement dans votre navigateur, sur vos mots, sans rien envoyer nulle part.</p>'
+'<h4>Cristalliser</h4>'
+'<p>Cristalliser, c’est demander à Claude de transformer une idée — ou un groupe d’idées proches — '
+'en quelque chose d’exploitable : un titre, une synthèse, des objectifs, des premières étapes, '
+'des points de vigilance.</p>'
+'<p><b>L’application ne contacte aucun service.</b> Elle prépare la demande, vous la copiez, vous la '
+'collez dans votre conversation Claude, et vous rapportez sa réponse dans le second champ. '
+'Rien ne sort de ce fichier sans que vous l’ayez fait sortir vous-même.</p>'
+'<dl>'
+'<dt>Sélectionner</dt><dd>Un clic sur une bulle, ou la case de la ligne dans le tableau. '
+'Le bouton sous un groupe sélectionne ou désélectionne tout le groupe d’un coup.</dd>'
+'<dt>Une seule idée</dt><dd>Ouvrez-la (double clic sur la bulle, clic sur la ligne) puis '
+'« Cristalliser seule ».</dd>'
+'<dt>La réponse</dt><dd>Collez le JSON tel quel. Si Claude l’a entouré de texte ou de balises, '
+'l’application retrouve l’objet toute seule. Chaque champ est relu et borné avant d’être enregistré.</dd>'
+'</dl>'
+'<h4>Devenir une activité</h4>'
+'<p>Une idée cristallisée se convertit en activité de la catégorie que vous choisissez. La synthèse, '
+'les objectifs et les points de vigilance deviennent son commentaire ; chaque première étape devient '
+'une tâche à échéance, qui apparaîtra dans « En attente » de l’onglet Aujourd’hui.</p>'
+'<p><b>Dissoudre</b> fait l’inverse : la synthèse est perdue, les idées d’origine redeviennent libres.</p>'
+'<h4>Ce qui est conservé</h4>'
+'<p>Les idées vivent dans votre fichier de données, comme le reste. Elles n’apparaissent pas dans le '
+'rapport d’activité : ce sont des intentions, pas des faits.</p>'
},

{ id:"calendrier", titre:"Calendrier", vues:["calendrier"], html:
 '<h4>Ce que la grille montre</h4>'
+'<p>Un mois entier, lundi en tête. Chaque jour porte <b>une pastille par rendez-vous</b>, '
+'à la couleur de sa catégorie — survolez-en une pour voir l’heure et le libellé. Au-delà '
+'de quatre, le reste est compté plutôt que dessiné : une case pleine de pastilles ne '
+'renseigne plus.</p>'
+'<p>L’étiquette <b>n éch.</b> compte les échéances de tâches tombant ce jour-là. Elle passe '
+'au rouge quand la date est dépassée. Les jours non travaillés sont grisés et portent leur '
+'motif ; aujourd’hui est cerclé de rouge.</p>'
+'<h4>Ouvrir une journée</h4>'
+'<p>Cliquez une case : la journée s’ouvre à côté, avec ses rendez-vous et ses échéances. '
+'Les boutons y sont ceux que vous connaissez — <b>Noter</b>, <b>Marquer fait</b>, '
+'<b>Ouvrir la note</b> — et vous pouvez créer une activité à cette date.</p>'
+'<p>Le calendrier ne contient aucune donnée propre : il lit les mêmes activités et les '
+'mêmes tâches que les autres onglets. Une activité archivée n’y figure pas, une tâche '
+'faite non plus.</p>' },

{ id:"projets", titre:"Projets, jalons et \u00e9ch\u00e9ance", vues:["projets"], html:
'<h4>Quand une activit\u00e9 devient un projet</h4>'
+'<p>Le suivi de projet est <b>d\u00e9sactiv\u00e9 par d\u00e9faut</b>. Ouvrez une activit\u00e9, section '
+'<b>Projet</b>, puis \u00ab Suivre comme un projet \u00bb. La plupart des activit\u00e9s n\u2019en sont pas : '
+'les suivre toutes ne piloterait rien.</p>'
+'<p>D\u00e9sactiver le suivi n\u2019efface rien. Si vous le rallumez, l\u2019\u00e9ch\u00e9ance et '
+'l\u2019historique des reports sont toujours l\u00e0.</p>'
+'<h4>Les jalons</h4>'
+'<p>Un jalon est un \u00e9v\u00e9nement ou une t\u00e2che de l\u2019activit\u00e9 que vous <b>cochez</b> '
+'comme \u00e9tape, avec le bouton \u2606 Jalon. Rien de nouveau \u00e0 saisir, et surtout : la barre '
+'d\u2019avancement ne bouge que sur ce qui compte. Si tout comptait, une visite de routine p\u00e8serait '
+'autant qu\u2019une \u00e9tape cl\u00e9, et trente micro-t\u00e2ches noieraient les cinq vraies.</p>'
+'<dl><dt>valid\u00e9</dt><dd>\u00e9v\u00e9nement pass\u00e9 en \u00ab R\u00e9alis\u00e9 \u00bb, '
+'ou t\u00e2che marqu\u00e9e faite.</dd>'
+'<dt>en retard</dt><dd>sa date est pass\u00e9e et il n\u2019est pas valid\u00e9.</dd>'
+'<dt>annul\u00e9</dt><dd>sort du compte, au num\u00e9rateur comme au d\u00e9nominateur : il a \u00e9t\u00e9 '
+'retir\u00e9 du projet, pas rat\u00e9.</dd></dl>'
+'<h4>L\u2019avancement</h4>'
+'<p>Il est <b>calcul\u00e9</b> : jalons valid\u00e9s sur jalons retenus. Il ne se saisit pas. Un '
+'pourcentage qu\u2019on tape \u00e0 la main est un chiffre qu\u2019on s\u2019arrange ; celui-l\u00e0 ne '
+'peut que refl\u00e9ter ce qui est r\u00e9ellement fait.</p>'
+'<h4>L\u2019\u00e9ch\u00e9ance ne flotte pas</h4>'
+'<p>La premi\u00e8re \u00e9ch\u00e9ance se pose librement. <b>Toute modification ensuite exige un '
+'motif</b>, et l\u2019application refuse d\u2019enregistrer sans : une justification facultative '
+'n\u2019est pas une justification.</p>'
+'<p>Une fois report\u00e9e, la ligne du projet affiche l\u2019\u00e9ch\u00e9ance d\u2019origine '
+'<b>barr\u00e9e</b>, la nouvelle, et le nombre de reports. Le motif de chacun reste consultable dans la '
+'fiche. C\u2019est l\u2019int\u00e9r\u00eat m\u00eame d\u2019en demander un : que le report co\u00fbte '
+'quelque chose.</p>'
+'<h4>O\u00f9 les voir</h4>'
+'<p>L\u2019onglet <b>Projets</b> les liste tous, une ligne chacun, les plus urgents devant : '
+'d\u00e9pass\u00e9s, puis par \u00e9ch\u00e9ance.</p>'
+'<p>Sur l\u2019\u00e9cran du jour, le bloc <b>Projets \u00e0 surveiller</b> ne montre que '
+'l\u2019\u00e9ch\u00e9ance d\u00e9pass\u00e9e, proche (huit jours), ou le jalon en retard. Un projet qui '
+'va bien ne vous encombre pas le matin.</p>'
},
{ id:"activites", titre:"Activités", vues:["chantiers"], html:
 '<h4>La liste</h4>'
+'<p>Recherche libre, puis quatre filtres : catégorie, statut, période, et <b>actives / archivées</b>. '
+'Par défaut vous ne voyez que les activités en cours.</p>'
+'<h4>La fiche</h4>'
+'<p>Un clic ouvre la fiche : champs de la catégorie, notes liées, ajout d’une note ou d’une tâche sans quitter la fenêtre. '
+'Les notes liées s’ouvrent d’un clic.</p>'
+'<h4>Les événements</h4>'
+'<p>Une activité n’a plus une date unique, mais <b>autant d’événements que nécessaire</b> : une visite, '
+'puis une réunion, puis l’intervention. Chacun porte sa date, son heure, sa durée, son type '
+'(rendez-vous, intervention, session, réunion…) et son <b>propre état</b> — prévu, réalisé, annulé, reporté.</p>'
+'<p>Les champs <b>Date</b>, <b>Heure</b> et <b>Durée</b> en haut de la fiche ne se saisissent plus : ils '
+'affichent le <b>prochain événement à venir</b>, ou le dernier passé s’il n’y en a plus. Ils sont grisés '
+'parce qu’il n’y a qu’une source de vérité, la liste d’événements. À la création d’une activité, en '
+'revanche, ils sont actifs : ils composent le premier événement.</p>'
+'<p>Un événement passé encore marqué « prévu » est signalé en rouge : c’est une date que vous n’avez pas soldée.</p>'
+'<p>Le planning du jour, le prochain jour ouvré et le calendrier listent désormais <b>chaque événement</b> : '
+'un dossier qui revient trois fois dans la journée y figure trois fois, parce que ce sont trois choses à faire. '
+'Les événements annulés n’apparaissent nulle part, mais restent dans la fiche — effacer une annulation efface l’histoire.</p>'
+'<p>L’import conserve son propre événement, et ne touche jamais ceux que vous avez posés à la main.</p>'
+'<h4>Ce qu’est un dossier non piloté</h4>'
+'<p>Un dossier est <b>non piloté</b> quand il n’a ni tâche en attente, ni événement à venir non annulé. '
+'Une réunion annulée ne pilote donc plus rien : le dossier revient dans la liste à traiter.</p>'
+'<h4>Archiver plutôt que supprimer</h4>'
+'<p>L’archivage sort un dossier des vues courantes <b>sans rien perdre</b> : notes, tâches, temps imputé et '
+'rattachements sont conservés, et le dossier reste consultable par le filtre « Archivés ».</p>'
+'<p>Au moment d’archiver, l’application demande <b>pourquoi</b> : « traité, mené à terme » ou « sorti de mon '
+'périmètre ». Ce choix compte : seuls les dossiers traités entrent dans les affaires menées à terme du rapport. '
+'Un dossier archivé sans réponse n’est compté nulle part, et un bouton « Qualifier les archives » le rappelle.</p>'
+'<p>La suppression définitive existe toujours, mais elle détache les notes et efface l’historique du rapport. '
+'Préférez l’archivage.</p>'
+'<h4>Statuts</h4>'
+'<p>Chaque catégorie a son propre cycle de vie. Le statut de clôture est réglé par catégorie dans les paramètres : '
+'c’est lui qui décide de ce qui compte comme mené à terme.</p>'
+'<h4>Transmettre un dossier</h4>'
+'<p>Le bouton <b>Compte rendu</b>, en bas de la fiche, en écrit le résumé en texte brut, prêt à coller '
+'dans un mail ou un message. Une case permet d’y joindre l’historique des notes et des tâches : '
+'avec elle, le destinataire a de quoi reprendre le dossier.</p>'
+'<p>Le texte reprend ce qui est à l’écran, y compris une saisie que vous n’avez pas encore '
+'enregistrée, et il est modifiable avant la copie. Les champs vides n’y figurent pas. '
+'La fiche reste ouverte derrière : fermer le compte rendu ne vous fait rien perdre.</p>' },

{ id:"dossiers", titre:"Dossiers et import Excel", vues:[], html:
 '<h4>L’import</h4>'
+'<p><b>Options</b> → « Importer des dossiers (Excel) ». Le fichier <code>.xlsm</code> est lu directement, '
+'sans logiciel tiers. Les lignes sont rapprochées par leur Référence technique : ce qui existe est mis à jour, le reste est ajouté.</p>'
+'<p>Un écran récapitule tout <b>avant</b> d’appliquer : lignes lues, nouvelles, modifiées, identiques, '
+'et le détail champ par champ des modifications proposées.</p>'
+'<h4>Le filtre gestionnaire</h4>'
+'<p>Seules les lignes à votre nom sont reprises. L’écran affiche explicitement si le filtre a été <b>appliqué</b> '
+'ou non : s’il ne l’a pas été, les boutons d’application disparaissent et un bouton « Réparer la configuration '
+'d’import » recâble les colonnes. Sans cela, l’import avalerait les dossiers de tous les gestionnaires.</p>'
+'<h4>Ce que l’import ne fait jamais</h4>'
+'<p>Une cellule vide ne vous efface rien : c’est une absence d’information, pas une demande d’effacement. '
+'Vos saisies manuelles sont protégées. Vos libellés personnalisés aussi : '
+'l’écran les liste et propose de les conserver.</p>'
+'<h4>Dates particulières</h4>'
+'<p>La colonne date d’intervention accepte autre chose qu’une date. Un <b>marqueur de réalisation</b> '
+'(FAIT, OK, Réalisé, Terminé…) retire la fiche du planning ; tout autre texte est conservé dans le champ sans toucher '
+'à la date. La liste des marqueurs est modifiable dans Options.</p>'
+'<h4>Dossiers absents du fichier</h4>'
+'<p>Un dossier que vous suivez mais qui ne figure plus dans le reportinge vous est proposé à l’archivage, '
+'case par case, rien n’étant coché par défaut. À l’inverse, un dossier archivé qui réapparaît vous est proposé '
+'à la réactivation.</p>' },

{ id:"rendezvous", titre:"Convocations et animations", vues:[], html:
 '<h4>Le cycle</h4>'
+'<p>Ces activités suivent un cycle de rendez-vous : À planifier, Planifié, À préparer, Prêt pour RDV, '
+'Préparation CR, Terminé, Reporté, Annulé. Le statut de clôture est <i>Terminé</i>.</p>'
+'<h4>Après le rendez-vous</h4>'
+'<p>Depuis le planning du jour, le bouton <b>Noter</b> ouvre le compte rendu avec le motif en amorce et le temps '
+'prévu pré-rempli. Le menu « Statut après cette note » vous laisse passer en <i>Préparation CR</i> sans sauter '
+'d’étape — c’est le geste normal après une convocation.</p>'
+'<h4>Personnes convoquées</h4>'
+'<p>Le champ dédié de la catégorie accueille les participants. Pour les animations, le nombre de participants '
+'attendus alimente l’indicateur « personnes sensibilisées » du rapport.</p>' },

{ id:"journal", titre:"Journal et notes", vues:["journal"], html:
 '<h4>Le journal</h4>'
+'<p>Toutes vos notes et vos appels, regroupés par jour. La recherche porte sur le texte.</p>'
+'<h4>Une note</h4>'
+'<p>Date, heure, type, durée, texte, et un <b>rattachement</b> : une activité ou une rubrique. '
+'Une note peut porter une <b>suite à donner</b> avec son échéance — c’est ce qui alimente « En attente ».</p>'
+'<p>Quand une note porte une tâche non soldée, le bouton <b>Traiter l’action</b> ouvre le compte rendu '
+'directement depuis la fiche, et vous y revenez une fois l’action soldée.</p>'
+'<h4>Le rattachement</h4>'
+'<p>Le sélecteur se filtre par recherche et par catégorie. Le choix en cours reste toujours présent dans la liste, '
+'même hors filtre ou au-delà du plafond d’affichage.</p>'
+'<p>Seul le choix explicite « aucun » rompt un lien : un champ non affiché ne détache jamais une note. '
+'Et chaque note garde en mémoire la référence du dossier : si un lien casse malgré tout, la note affiche en rouge '
+'<i>lien perdu</i> suivi du dossier d’origine, au lieu de vous laisser deviner.</p>'
+'<h4>Rubriques</h4>'
+'<p>Pour les notes qui ne relèvent d’aucun dossier daté. Leur ordre d’affichage se règle avec les flèches '
+'dans Options, et il est respecté partout.</p>'
+'<h4>Transmettre une note ou un appel</h4>'
+'<p>La fiche d’une note et celle d’un appel portent un bouton <b>Compte rendu</b> : il en écrit '
+'le résumé en texte brut — date, durée, dossier rattaché, contenu, suite à donner — à copier dans un mail. '
+'Votre nom et votre fonction, s’ils sont renseignés dans les paramètres, le signent.</p>' },

{ id:"contacts", titre:"Contacts et organisations", vues:["contacts"], html:
 '<h4>Détecter plutôt que saisir</h4>'
+'<p>Deux boutons parcourent vos activités et vos appels pour proposer les fiches manquantes : '
+'<b>Détecter des contacts</b> et <b>Détecter des organisations</b>. Rien n’est créé sans votre case cochée, '
+'et « Écarter » retire définitivement un nom des propositions.</p>'
+'<p>Le rapprochement se fait d’abord sur le numéro de téléphone, puis sur le nom : « Paul Exemple » et '
+'« EXEMPLE Paul » ne font qu’un. Pour les organisations, les formes juridiques sont ignorées : '
+'« SARL Exemple TP » et « EXEMPLE TP » comptent pour une seule entreprise.</p>'
+'<h4>Rattachement automatique</h4>'
+'<p>Une fois les organisations créées, chaque contact croisé sur les mêmes lignes reçoit la sienne. '
+'Si vous créez les organisations après les contacts, un clic sur le bouton rattache l’existant.</p>'
+'<h4>Historique</h4>'
+'<p>Dès qu’une fiche existe, son passé remonte seul : appels et activités où son nom ou son numéro apparaît. '
+'Vous pouvez ajouter des rencontres à la main.</p>'
+'<h4>Relations</h4>'
+'<p>Les liens sont <b>typés et réciproques</b> : « Responsable de » posé chez l’un devient « Rattaché à » chez '
+'l’autre. Une relation peut viser une personne ou une organisation.</p>'
+'<p>Le graphe de la fiche montre le contact au centre et ses relations autour, avec un second cercle optionnel. '
+'Le type de lien est écrit sur le trait et le sens porté par la flèche. Une organisation est un carré, '
+'une personne un rond.</p>'
+'<h4>Civilité</h4>'
+'<p>Elle a son champ. Tapée dans le prénom, elle est remontée toute seule ; un bouton « Extraire les civilités » '
+'traite l’existant d’un coup.</p>' },

{ id:"permanence", titre:"Assistance téléphonique", vues:[], html:
 '<h4>Prendre un appel</h4>'
+'<p>Téléphone, qui appelle, entreprise, commune, objet et motif, puis <b>Noter</b>. Entrée valide depuis '
+'n’importe lequel des champs. L’entreprise et la commune se complètent d’après vos organisations et '
+'les communes déjà rencontrées.</p>'
+'<p>Un numéro déjà vu reconnaît l’appelant et pré-remplit ce qu’il sait.</p>'
+'<h4>Durée</h4>'
+'<p>Les puces 2 / 5 / 10 / 20 minutes imputent le temps de traitement. Ce temps alimente « Où passe le temps » '
+'et la rubrique Permanence.</p>'
+'<h4>Rappels</h4>'
+'<p>Les rappels périodiques (Rappel 1, Rappel 2…) sont entièrement paramétrables : ajouter, renommer, supprimer, '
+'régler l’intervalle. Chaque vérification laisse une ligne dans la liste des appels, avec son badge, '
+'pour que la trace existe.</p>'
+'<h4>Rattacher un appel à une affaire</h4>'
+'<p>Le champ <b>Affaire / n° dossier</b> de la saisie accueille la référence sur laquelle '
+'porte l’appel, plutôt que de la noyer au début de l’objet. Il propose les références et '
+'les Référence technique déjà présents dans vos activités, mais n’oblige à rien : une affaire qui n’est pas '
+'dans le fichier s’écrit librement.</p>'
+'<p>Quand la référence correspond à l’une de vos activités, son libellé s’affiche sous '
+'l’appel, la fiche propose un lien pour ouvrir le dossier, et le compte rendu la reprend.</p>'
+'<h4>Clore la permanence</h4>'
+'<p>Le lien en bas du bloc arrête les rappels pour la journée. Le bloc indique alors ce que la '
+'permanence a été : la plage tenue, le temps cumulé, le nombre d’appels. Vous pouvez la reprendre '
+'dans la même journée : les plages s’additionnent et la coupure n’est pas comptée.</p>' },

{ id:"compteur", titre:"Compteur de traitement", vues:[], html:
 '<h4>À quoi il sert</h4>'
+'<p>Compter les dossiers traités en série et chronométrer les sessions. Le titre du bloc '
+'est modifiable dans les paramètres : le compteur ne suppose aucun usage particulier.</p>'
+'<h4>Sessions</h4>'
+'<p>Une session démarre et s’arrête à la main ; ses heures sont modifiables après coup. Une session oubliée '
+'un jour passé n’est jamais extrapolée : elle compte pour zéro, plutôt que de gonfler votre temps.</p>'
+'<h4>Ce qu’il produit</h4>'
+'<p>Jours de traitement, dossiers traités, temps chronométré, cadence moyenne et meilleure journée. '
+'Le temps rejoint automatiquement la rubrique correspondante dans « Où passe le temps ».</p>'
+'<p class="pa-astuce">Ce bloc et l’assistance téléphonique peuvent être désactivés dans les paramètres '
+'si votre poste ne les utilise pas.</p>' },

{ id:"rapport", titre:"Rapport d’activité", vues:["rapport"], html:
 '<h4>À quoi il sert</h4>'
+'<p>Produire, sur une période que vous choisissez, un document présentable en entretien. '
+'Il ne contient <b>aucune donnée nominative ni référence de dossier</b>.</p>'
+'<h4>Ce qui entre dans la période</h4>'
+'<p>Un dossier est rattaché à la période dès qu’il y porte une <b>trace d’activité</b> : date planifiée, '
+'archivage, dernière action, ou note datée. Beaucoup de dossiers n’ont pas de date de planification ; '
+'s’en tenir à elle effacerait l’essentiel de votre portefeuille.</p>'
+'<p>Le rapport écrit sa méthode et la ventilation exacte — combien par date, par archivage, par note. '
+'Si on vous demande d’où sort un chiffre, la réponse est dans le document.</p>'
+'<h4>Affaires menées à terme</h4>'
+'<p>Deux sources : le statut de clôture de la catégorie, et les dossiers <b>archivés comme traités</b>. '
+'Les sorties de périmètre sont comptées à part. Un avertissement rouge apparaît si une catégorie ne clôture jamais : '
+'c’est presque toujours un réglage à revoir, pas un reflet de votre travail.</p>'
+'<h4>Les trois pages</h4><dl>'
+'<dt>Synthèse</dt><dd>Indicateurs comparés à la période précédente, activité mois par mois, '
+'nature des affaires, état d’avancement. Un bloc séparé donne le compteur et la permanence, '
+'comptés en actes et non en dossiers.</dd>'
+'<dt>Charge et production</dt><dd>Répartition du temps tracé, détail du compteur et de l’assistance, '
+'motifs d’appel, types d’intervention, journal.</dd>'
+'<dt>Détail et prévention</dt><dd>Avancement par catégorie, points de vigilance, actions de suivi, '
+'et <b>prévention et réduction du risque</b> : interventions à enjeu sécurité, convocations tenues, '
+'animations, entreprises rencontrées, personnes sensibilisées.</dd></dl>'
+'<h4>Les deux sections à écrire</h4>'
+'<p><b>Faits marquants</b> et <b>Objectifs et besoins</b> se renseignent dans Options. Ce sont les seules '
+'sections rédigées, et ce sont elles qu’on lit en premier : les chiffres ne font que les étayer.</p>' },

{ id:"donnees", titre:"Options", vues:["donnees"], html:
 '<h4>Six sections, une tâche chacune</h4>'
+'<dl><dt>Fichier</dt><dd>Où vivent vos données, l’état du poste, et l’effacement complet.</dd>'
+'<dt>Import et export</dt><dd>Ce qui entre depuis Excel, ce qui sort en CSV ou en JSON.</dd>'
+'<dt>Organisation</dt><dd>Vos jours travaillés, vos absences, vos rubriques d’activité.</dd>'
+'<dt>Catégories</dt><dd>Les sortes d’activités : leurs champs, leurs statuts, leurs colonnes d’import.</dd>'
+'<dt>Listes</dt><dd>Les valeurs proposées dans les champs.</dd>'
+'<dt>Affichage</dt><dd>Nom de l’application, format des dates, blocs de l’écran du jour.</dd></dl>'
+'<p>Le rapport, le compte-rendu et l’identité qui les signe ne sont pas des réglages : ils ont leur propre onglet <b>Rapport</b>.</p>'
+'<h4>Le fichier</h4>'
+'<p>« Lier un fichier » ou « Ouvrir un fichier » : après ce clic unique, tout s’enregistre seul. '
+'L’état en haut à droite indique où en est l’enregistrement.</p>'
+'<p class="pa-astuce">Le tampon du navigateur n’est qu’un relais de session. Si votre poste le vide '
+'chaque jour, seul le fichier lié conserve vos données : liez-le dès l’ouverture.</p>'
+'<h4>Exports</h4>'
+'<p>JSON complet, et CSV par domaine : activités, notes, suivi du compteur, appels. '
+'Chaque export accepte une période ; vide, il prend tout l’historique.</p>'
+'<h4>Comptes rendus</h4>'
+'<p>Le compte rendu texte et le rapport PDF s’éditent sur n’importe quelle date ou période, '
+'pas seulement le jour même.</p>'
+'<h4>Contrôles de cohérence</h4>'
+'<p>Deux bandeaux peuvent apparaître. <b>Ambre</b> : des fiches portaient une catégorie inconnue au dernier '
+'chargement — une clé mal écrite dans le fichier. <b>Rouge</b> : des activités portent un statut étranger à leur '
+'catégorie, et une correction vous est proposée lot par lot, avec la destination pré-remplie quand elle est certaine.</p>'
+'<h4>Diagnostic du poste</h4>'
+'<p>Indique si l’écriture directe du fichier est disponible. Sur certains navigateurs elle est désactivée '
+'par défaut et l’application bascule en téléchargement.</p>' },

{ id:"parametres", titre:"Paramètres et catégories", vues:[], html:
 '<h4>Catégories d’activité</h4>'
+'<p>Entièrement configurables : libellé, pluriel, symbole, couleur, champs propres, jeu de statuts, '
+'statut de clôture. Une catégorie peut recevoir l’import Excel et déclarer ce que contient son champ '
+'interlocuteur — une personne, une organisation, ou les deux. Ce réglage alimente la détection d’organisations.</p>'
+'<p><b>L’ordre des champs propres</b> dans la fenêtre de la catégorie est celui de la fiche. Pour le changer, tirez une ligne par sa poignée ⠿, ou servez-vous des flèches ▲▼, qui fonctionnent aussi au clavier et gardent le focus sur le champ déplacé.</p>'
+'<p>Les catégories s’exportent et s’importent : c’est ce qui permet de reprendre la même configuration '
+'sur un autre poste.</p>'
+'<h4>Listes</h4>'
+'<p>Types d’intervention, motifs, états d’affaire, civilités, marqueurs de réalisation, '
+'actes de prévention… Chaque liste s’édite directement ; une valeur peut aussi s’ajouter depuis n’importe '
+'quel menu déroulant avec « ＋ Ajouter à la liste… ».</p>'
+'<h4>Rubriques</h4>'
+'<p>Elles rattachent les notes sans dossier. Les flèches fixent leur ordre, respecté partout où elles sont proposées.</p>'
+'<h4>Jours ouvrés et absences</h4>'
+'<p>Vos jours travaillés et vos absences déclarées : ils déterminent le prochain jour ouvré et le dénominateur '
+'du temps tracé dans le rapport.</p>'
+'<h4>Identité du rapport</h4>'
+'<p>Nom, fonction et entité figurant en tête du rapport, plus les deux sections rédigées.</p>'
+'<h4>Modules</h4>'
+'<p>L’assistance téléphonique et le compteur se désactivent si votre poste ne les utilise pas. '
+'Le titre du compteur et le nom de l’application sont libres.</p>' },

{ id:"pauses", titre:"Pauses", vues:[], html:
 '<h4>Le rappel</h4>'
+'<p>Un compte à rebours près du menu Pause indique le temps restant. À échéance, une proposition s’affiche ; '
+'« Plus tard » vous laisse choisir le report.</p>'
+'<h4>La carte</h4>'
+'<p>Vos propres idées de pause, rangées par durée : amuse-bouches, accompagnements, plats, spécialités, desserts. '
+'Les propositions varient et tiennent compte du temps dont vous disposez.</p>'
+'<p>La carte est enregistrée avec vos données mais n’apparaît dans aucun export d’activité ; '
+'un bouton permet de la sortir à part.</p>'
+'<h4>Quand chaque section est proposée</h4>'
+'<p>Chaque section porte son propre réglage, dans son en-tête : <b>pause courte</b>, '
+'<b>pause longue</b>, ou <b>jamais — sur demande</b>. Le temps qui vous sépare de votre '
+'prochaine activité choisit alors la section : au-delà du seuil réglable, les sections '
+'« longues » passent devant ; en dessous, seules les « courtes » sont tirées.</p>'
+'<p>Une section sur <b>jamais</b> n’est tirée dans aucun cas. Elle n’est pas inutile pour '
+'autant : elle se consulte depuis cette carte. C’est la place des choses qui demandent du '
+'temps et ne se décident pas entre deux dossiers.</p>'
+'<h4>Les accompagnements</h4>'
+'<p>Un accompagnement n’est pas une pause : c’est ce qu’on met en fond <i>pendant</i> une '
+'tâche fastidieuse. Il a donc son propre bouton dans le bandeau, entre <b>Aide</b> et '
+'<b>Pause</b> — vous le déclenchez quand vous le voulez, rien ne vous l’impose.</p>'
+'<p>Un élément peut porter un <b>lien</b> autant qu\'un module : playlist, podcast, page de '
+'révision. L’application n’appelle jamais rien d’elle-même — elle passe l’adresse au système, '
+'exactement comme si vous la tapiez. Elle reste donc sans réseau.</p>'
+'<h4>Les modules</h4>'
+'<p>Un élément de la carte peut porter un <b>fichier .html</b> rangé dans un dossier voisin de '
+'l’application. Révéler la pause propose alors de le <b>lancer</b>, dans une fenêtre du pilotage : '
+'mini-jeu, appli de révision, mise en situation — ce que vous y mettez.</p>'
+'<pre class="pa-arbre">MyPilot_Pro.html\n\u21b3 module/\n   \u21b3 jeu.html</pre>'
+'<p>La durée inscrite sur l’activité sert de minuteur : le bandeau de la fenêtre affiche le temps '
+'restant, puis, l’échéance passée, <b>le dépassement en négatif et en rouge</b>. Rien ne s’interrompt — '
+'vous voyez seulement ce que la pause a réellement coûté. Sans durée, c’est le temps écoulé qui s’affiche.</p>'
+'<p><b>Sortir d’un module.</b> Le bouton <b>Fermer</b> du bandeau rend toujours la main. '
+'La touche <b>Échap</b>, elle, ne fonctionne que si le focus est resté hors du module : dès que '
+'vous cliquez dans le jeu, c’est lui qui reçoit les touches. Un module peut rendre la main '
+'lui-même en envoyant <span class="mono">postMessage({mypilot:"fermer"})</span>.</p>'
+'<p>Le bouton <b>⚙</b> d’une ligne ouvre tout l’élément — <b>nom, durée, module, lien</b>. '
+'C’est là qu’on renomme : « Parcourir un dossier » baptise les modules d’après leurs fichiers, '
+'ce qui donne rarement le bon libellé. <b>▶</b> lance le module pour l’essayer, et '
+'<b>Parcourir un dossier…</b> liste les .html d’un dossier et les ajoute d’un coup. Le nom du '
+'dossier retenu est celui que vous désignez ; par défaut <span class="mono">module</span>.</p>'
+'<p><b>Deux points à connaître.</b> Un module s’exécute isolé : il ne peut ni lire ni modifier vos '
+'données, et l’application ne peut pas entrer dans le module — c’est le navigateur qui l’impose. '
+'En revanche l’application reste sans réseau, <b>le module fait ce que son auteur a écrit</b> : s’il '
+'appelle une bibliothèque en ligne, il ne fonctionnera pas sur un poste sans accès. Pour qu’un module '
+'marche partout, tout doit tenir dans son fichier ou dans son dossier.</p>' },

{ id:"raccourcis", titre:"Raccourcis et questions", vues:[], html:
 '<h4>Raccourcis</h4>'
+'<table class="pa-tab">'
+'<tr><td><kbd>F1</kbd></td><td>Ouvrir l’aide sur la rubrique de l’onglet affiché</td></tr>'
+'<tr><td><kbd>Échap</kbd></td><td>Fermer la fenêtre ouverte</td></tr>'
+'<tr><td><kbd>Entrée</kbd></td><td>Dans la saisie d’un appel : enregistrer l’appel</td></tr>'
+'</table>'
+'<h4>Version et licence</h4>'
+'<p>Le bouton <b>À propos</b>, à côté d’Aide, donne la version installée, l’auteur, '
+'la licence \u2014 <b>GNU GPL v3 ou ultérieure</b>, un logiciel libre \u2014 et le <b>journal des versions</b> : tout ce qui a changé, de la première version '
+'à celle-ci. Utile pour savoir si le fichier que vous avez sous la main est bien le dernier.</p>'
+'<h4>Questions fréquentes</h4><dl>'
+'<dt>Mes modifications sont-elles enregistrées ?</dt>'
+'<dd>L’état en haut à droite le dit. « Auto · enregistré hh:mm:ss » signifie que le fichier est à jour.</dd>'
+'<dt>Le rapport affiche 0 affaire menée à terme</dt>'
+'<dd>Soit le statut de clôture de la catégorie ne correspond à aucun statut réellement utilisé, soit vos dossiers '
+'soldés sont archivés sans être qualifiés. Le bouton « Qualifier les archives » dans Activités règle le second cas.</dd>'
+'<dt>Une catégorie manque dans le rapport</dt>'
+'<dd>Elle apparaît à zéro, en gris, avec le nombre d’activités qu’elle porte hors période. '
+'C’est presque toujours une question de bornes de dates.</dd>'
+'<dt>Une note a perdu son dossier</dt>'
+'<dd>Elle affiche en rouge le dossier d’origine. Rouvrez-la et choisissez-le de nouveau dans la liste.</dd>'
+'<dt>L’import Excel propose bien trop de dossiers</dt>'
+'<dd>Le filtre gestionnaire n’a pas été appliqué : l’écran le signale et propose de réparer la configuration. '
+'N’appliquez pas l’import avant.</dd>'
+'<dt>Où sont mes données ?</dt>'
+'<dd>Dans le fichier que vous avez lié, à l’emplacement que vous avez choisi. Le nom du fichier courant '
+'est affiché dans Options.</dd>'
+'</dl>' }
];

var boite = null, courante = A[0].id, avantFocus = null;
function ech(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function sansAcc(t){ return String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function texteDe(html){ var d = document.createElement("div"); d.innerHTML = html; return d.textContent || ""; }

function construire(){
  if (boite) return boite;
  var st = document.createElement("style"); st.textContent = css; document.head.appendChild(st);
  boite = document.createElement("dialog");   /* au premier plan, meme au-dessus d'une fenetre deja ouverte */
  boite.id = "ppAide"; boite.setAttribute("role", "dialog"); boite.setAttribute("aria-modal", "true"); boite.setAttribute("aria-label", "Aide");
  boite.innerHTML = '<div class="pa-boite"><div class="pa-tete"><h3>Aide</h3>'
    + '<input type="search" id="paCherche" placeholder="Rechercher dans l’aide…" aria-label="Rechercher dans l’aide">'
    + '<button id="paFermer" title="Fermer (Échap)" aria-label="Fermer">✕</button></div>'
    + '<div class="pa-nav" id="paNav" role="navigation" aria-label="Rubriques"></div><div class="pa-corps" id="paCorps" tabindex="-1"></div></div>';
  document.body.appendChild(boite);
  boite.addEventListener("click", function(e){
    if (e.target === boite || e.target.id === "paFermer" || e.target.closest("#paFermer")) return fermer();
    var b = e.target.closest("[data-pa]"); if (b) { afficher(b.dataset.pa); }
  });
  boite.querySelector("#paCherche").addEventListener("input", function(){
    menu(); var q = this.value.trim(); if (q) { var r = resultats(q)[0]; if (r) afficher(r.id, true); }
  });
  boite.addEventListener("cancel", function(e){ e.preventDefault(); fermer(); });
  boite.addEventListener("keydown", function(e){
    if (e.key !== "Escape") return;
    e.stopPropagation();
    if (e.target.id === "paCherche" && e.target.value) return;   /* Echap vide d'abord la recherche */
    e.preventDefault(); fermer();
  });
  return boite;
}
function resultats(q){
  var mots = sansAcc(q).split(/\s+/).filter(Boolean);
  return A.filter(function(r){
    var t = sansAcc(r.titre + " " + texteDe(r.html));
    return mots.every(function(m){ return t.indexOf(m) >= 0; });
  });
}
function menu(){
  var q = boite.querySelector("#paCherche").value.trim(), l = q ? resultats(q) : A;
  boite.querySelector("#paNav").innerHTML = l.length ? l.map(function(r){
    return '<button data-pa="' + r.id + '" aria-current="' + (r.id === courante) + '">' + ech(r.titre) + '</button>';
  }).join("") : '<div style="padding:10px 16px;font-size:13px;color:#5C625E">Aucun résultat</div>';
}
function surligner(html, q){
  var mots = sansAcc(q).split(/\s+/).filter(function(m){ return m.length > 2; });
  if (!mots.length) return html;
  var d = document.createElement("div"); d.innerHTML = html;
  var w = document.createTreeWalker(d, NodeFilter.SHOW_TEXT), n, aTraiter = [];
  while ((n = w.nextNode())) aTraiter.push(n);
  aTraiter.forEach(function(t){
    var s = t.nodeValue, ns = sansAcc(s), i, dernier = 0, pos = [];
    mots.forEach(function(m){ for (i = ns.indexOf(m); i >= 0; i = ns.indexOf(m, i + m.length)) pos.push([i, i + m.length]); });
    if (!pos.length) return;
    pos.sort(function(a, b){ return a[0] - b[0]; });
    var f = document.createDocumentFragment();
    pos.forEach(function(p){
      if (p[0] < dernier) return;
      f.appendChild(document.createTextNode(s.slice(dernier, p[0])));
      var mk = document.createElement("mark"); mk.textContent = s.slice(p[0], p[1]); f.appendChild(mk); dernier = p[1];
    });
    f.appendChild(document.createTextNode(s.slice(dernier))); t.parentNode.replaceChild(f, t);
  });
  return d.innerHTML;
}
function afficher(id, depuisRecherche){
  var r = A.filter(function(x){ return x.id === id; })[0] || A[0], i = A.indexOf(r);
  courante = r.id; menu();
  var q = boite.querySelector("#paCherche").value.trim();
  var c = boite.querySelector("#paCorps");
  c.innerHTML = '<h2>' + ech(r.titre) + '</h2>' + (q ? surligner(r.html, q) : r.html)
    + '<div class="pa-pied">' + (i > 0 ? '<button data-pa="' + A[i - 1].id + '">← ' + ech(A[i - 1].titre) + '</button>' : '<span></span>')
    + (i < A.length - 1 ? '<button data-pa="' + A[i + 1].id + '">' + ech(A[i + 1].titre) + ' →</button>' : '<span></span>') + '</div>';
  c.scrollTop = 0;
  if (!depuisRecherche) c.focus({ preventScroll: true });
}
function ouvrir(id){
  construire();
  if (!boite.open) { avantFocus = document.activeElement; boite.showModal(); }
  afficher(id || courante);
}
function fermer(){
  if (!boite) return;
  if (boite.open) boite.close();
  if (avantFocus && avantFocus.focus) try { avantFocus.focus(); } catch (e) {}
}
/** Ouvre l'aide ; sans argument, sur la rubrique de l'onglet affiche. */
window.ouvrirAide = function(id){
  ouvrir(id || VUE_RUBRIQUE[typeof vueActive !== "undefined" ? vueActive : ""] || courante);
};
window.fermerAide = fermer;

document.addEventListener("keydown", function(e){
  if (e.key === "F1") { e.preventDefault(); window.ouvrirAide(); }
});
document.addEventListener("click", function(e){
  var b = e.target.closest && e.target.closest("#btnAide,[data-aide]");
  if (!b) return;
  e.preventDefault();
  window.ouvrirAide(b.dataset.aide || undefined);
});
})();

</script>
