  ficheEnCours=id;
  ouvrirModale(catDe(c).lib+" — "+(c.reference||c.libelle)
      +(estArchive(c)?"  · archivé le "+libCourt(c.archive):""),formChantier(c)+fragProjet(c)+evts+histo,[
    (estArchive(c)
      ? {txt:"Désarchiver",classe:"creux",fn:function(){
          desarchiver(c); fermerModale(); modifie(); rendre(); toast("Dossier réactivé");
        }}
      : {txt:"Archiver",classe:"creux",fn:function(){ demanderIssue([c],"archivé à la main") }}),
    {txt:"Compte rendu",classe:"creux",fn:function(){
      ouvrirCR("Compte rendu — "+catDe(c).lib,crFichier("activite",c.date||auj()),
        function(avecNotes){ return crActivite(c,avecNotes!==false) },
        "Inclure l’historique des notes et des tâches");
    }},
    {txt:"Supprimer",classe:"creux",fn:function(){
      if(confirm("Supprimer définitivement cette activité ?\n\nSes notes seront conservées mais détachées, et son historique disparaîtra des rapports. Préférez l'archivage si vous voulez garder la trace.")){
        var ref=refDossier(chantierPar(id));
        D.chantiers=D.chantiers.filter(function(x){return x.id!==id});
        D.notes.forEach(function(n){ if(n.chantier_id===id){ n.chantier_ref=n.chantier_ref||ref; n.chantier_id="" } });
        fermerModale(); modifie(); rendre(); toast("Activité supprimée");
      }
    }},
    {txt:"Fermer",fn:function(){ if(quitterFicheAutorise()) fermerModale() },droite:true},
    {txt:"Enregistrer",classe:"",droite:true,fn:function(){
      if(bloqueSiSaisieFiche()) return;
      var avant=c.statut;

var filtreLienQ="", filtreLienCat="", nbLien=0;
function correspondLien(c,q){
  if(!q) return true;
  return [c.libelle,c.reference,c.ref_technique,c.gdo,c.commune,c.tiers,c.type,c.statut]
    .join(" ").toLowerCase().indexOf(q)!==-1;
}
function optionsLien(sel){
  var q=(filtreLienQ||"").toLowerCase(),cat=filtreLienCat||"";
  var o='<option value="0">— aucun —</option>';
  nbLien=0;
  var r=rubriques().filter(function(x){
    if(cat) return false;                       /* filtrer sur une categorie masque les rubriques */
    return !q || x.nom.toLowerCase().indexOf(q)!==-1 || sel==="r:"+x.id;
  });
  if(r.length){
    nbLien+=r.length;
    o+='<optgroup label="Rubriques">'+r.map(function(x){
      return '<option value="r:'+esc(x.id)+'"'+(sel==="r:"+x.id?" selected":"")+'>'+esc(x.nom)+'</option>';
    }).join("")+'</optgroup>';
  }
  var horsFiltre=null;
  var l=D.chantiers.filter(function(c){
    var ok=!estArchive(c) && (!cat || (c.categorie||"chantier")===cat) && correspondLien(c,q);
    if(!ok && sel==="c:"+c.id) horsFiltre=c;    /* choix courant, ou archive : mis a part */
    return ok;
  }).sort(function(a,b){return (b.date||"")===(a.date||"")?String(a.libelle||"").localeCompare(String(b.libelle||"")):(b.date||"").localeCompare(a.date||"")});
  var trop=l.length>150;
  if(trop){
    /* le troncage pouvait faire disparaitre l'option selectionnee : le navigateur
       retombait alors sur la premiere option et l'enregistrement suivant deplaçait
       ou effaçait le rattachement. Le choix courant est toujours conserve. */
    var garde=null;
    l.forEach(function(c){ if(sel==="c:"+c.id) garde=c });
    l=l.slice(0,150);
    if(garde){
      var dedans=false;
      l.forEach(function(c){ if(c.id===garde.id) dedans=true });
      if(!dedans) l.unshift(garde);
    }
  }
  if(l.length){
    nbLien+=l.length;
    o+='<optgroup label="Activités">'+l.map(function(c){
      var d=dateValide(c.date)?libCourt(c.date):"non datée";
      return '<option value="c:'+esc(c.id)+'"'+(sel==="c:"+c.id?" selected":"")+'>'
        +esc(d+" · "+catDe(c).sym+" "+(c.libelle||"")+(c.commune?" ("+c.commune+")":""))+'</option>';
    }).join("")+'</optgroup>';
  }
  if(trop) o+='<option value="0" disabled>… affinez la recherche pour voir la suite</option>';
  if(horsFiltre){
    o+='<optgroup label="Choix actuel (hors filtre)"><option value="c:'+esc(horsFiltre.id)+'" selected>'
      +esc((dateValide(horsFiltre.date)?libCourt(horsFiltre.date):"non datée")+" · "+catDe(horsFiltre).sym+" "
        +(horsFiltre.libelle||""))+'</option></optgroup>';
  }
  return o;
}
function majSelectLien(){
  var e=$("#noteLien");
  if(!e) return;
  var v=e.value;
  e.innerHTML=optionsLien(v);
  e.value=v;
  var c=$("#lienNb");
  if(c) c.textContent=nbLien+" résultat"+(nbLien>1?"s":"");
}
function lienDe(n){ return n.rubrique_id?("r:"+n.rubrique_id):(n.chantier_id?("c:"+n.chantier_id):"0") }
function poserLien(n,v){
  v=String(v||"");
  /* un champ absent ou vide ne vaut pas « detacher » : seul le choix explicite « aucun »
     (valeur 0) rompt le lien. Sans cette distinction, tout chemin de code qui lisait le
     formulaire sans que le champ soit rendu effaçait le rattachement en silence. */
  if(!v) return;
  if(v==="0"){ souvenirLien(n); n.rubrique_id=""; n.chantier_id=""; return }
  n.rubrique_id = v.indexOf("r:")===0 ? v.slice(2) : "";
  n.chantier_id = v.indexOf("c:")===0 ? v.slice(2) : "";
  if(n.chantier_id) n.chantier_ref=refDossier(chantierPar(n.chantier_id));
  else if(n.rubrique_id) n.chantier_ref="";
}
/* trace lisible du dossier, pour retrouver la piste meme si le lien casse */
function refDossier(c){
  if(!c) return "";
  return [c.reference||c.ref_technique||"",c.libelle||""].filter(Boolean).join(" \u00b7 ");
}
/* chantier_ref garde la trace de CE A QUOI la note etait rattachee — le champ porte un
   nom historique, il vaut aussi pour une rubrique. Sans cette trace, une note detachee
   ne dit plus d'ou elle vient, et il n'y a plus moyen de la remettre a sa place. */
function souvenirLien(n){
  if(!n || n.chantier_ref) return;
  if(n.chantier_id){ n.chantier_ref=refDossier(chantierPar(n.chantier_id)); return }
  if(n.rubrique_id){
    var r=rubriquePar(n.rubrique_id);
    if(r) n.chantier_ref="rubrique « "+r.nom+" »";
  }
}
function lienRompu(n){
  return !!(n && !n.chantier_id && !n.rubrique_id && n.chantier_ref);
}
function optionsChantier(sel){
  var l=D.chantiers.filter(function(c){ return !estArchive(c) || c.id===sel }).sort(function(a,b){return (b.date||"").localeCompare(a.date||"")});
  return '<option value="">— aucun —</option>'+l.map(function(c){
    return '<option value="'+esc(c.id)+'"'+(c.id===sel?" selected":"")+'>'
      +esc(libCourt(c.date)+" · "+catDe(c).sym+" "+(c.libelle||"")+(c.commune?" ("+c.commune+")":""))+'</option>';
  }).join("");
}

/* ================= rendu : fragments ================= */
function fragChantier(c,clorable){
  var K=catDe(c),cat=c.categorie||"chantier",e=[];
  if(categories()[0] && cat!==categories()[0].cle) e.push('<span class="etiq cat-'+esc(cat)+'">'+esc(K.lib)+'</span>');
  if(c.eprouvante) e.push('<span class="etiq" title="Activité éprouvante">⚑</span>');
  if(c.priorite==="haute") e.push('<span class="etiq rouge">Priorité</span>');
  if(c.type) e.push('<span class="etiq">'+esc(c.type)+'</span>');
  e.push('<span class="etiq '+classeStatut(c)+(cat==="chantier"?" brut":"")+'" title="'+esc(libStatut(c.statut))+'">'+esc(tronque(libStatut(c.statut),26))+'</span>');
  if(cat==="convocation" && c.presence && c.presence!=="attendu")
    e.push('<span class="etiq '+(c.presence==="absent"?"rouge":"gris")+'">'+esc(libPresence(c.presence))+'</span>');
  var meta=[];
  if(c.tiers) meta.push(esc(c.tiers));
  if(c.commune) meta.push(esc(c.commune));
  if(c.contact_tel) meta.push('<span class="mono">'+esc(c.contact_tel)+'</span>');
  if(cat==="chantier" && c.ouvrage && c.ouvrage!=="Non défini") meta.push(esc(c.ouvrage));
  if(cat==="animation" && c.participants) meta.push(esc(c.participants)+" participants");
  if(cat==="convocation" && c.convoques) meta.push(esc(c.convoques));
  /* clore d'un clic sautait au statut final, ce qui ne correspond a aucun cycle reel.
     On note ce qui s'est passe, et l'on fait avancer le statut dans la foulee. */
  var clore=(clorable && !estClos(c) && !estAnnule(c))
    ? '<button class="b mini creux" data-noter="'+esc(c.id)+'" style="margin-left:auto">Noter</button>' : "";
  return '<div class="chantier" data-chantier="'+esc(c.id)+'" data-cat="'+esc(cat)+'" data-statut="'+esc(c.statut||"planifie")+'" data-priorite="'+esc(c.priorite||"normale")+'">'
    +'<div class="t"><span class="lib">'+esc(c.libelle)+'</span>'+e.join(" ")+clore+'</div>'
    +(meta.length?'<div class="meta">'+meta.join(" · ")+'</div>':"")
    +(c.reference?'<div class="ref">'+esc(c.reference)+'</div>':"")
    +'</div>';
}
function libPresence(v){
  for(var i=0;i<PRESENCES.length;i++) if(PRESENCES[i][0]===v) return PRESENCES[i][1];
  return v||"";
}
function fragTrace(date){
  var l=chantiersDu(date);
  if(!l.length) return '<div class="vide"><b>Rien de positionné</b>Aucun rendez-vous ni suivi placé sur cette journée.</div>';
  var h=hNow(), estAuj=(date===auj()), place=false, out='<div class="trace">';
  l.forEach(function(c){
    if(estAuj && !place && (c.heure||"99:99")>h){
      out+='<div class="maintenant"><span>'+h+'</span></div>'; place=true;
    }
    out+='<div class="piquet" data-cat="'+esc(c.categorie||"chantier")+'" data-statut="'+esc(c.statut||"planifie")+'">'
      +'<div class="h">'+esc(c.heure||"--:--")+'</div><div class="croix">'+catDe(c).sym+'</div>'
      +fragChantier(c,estAuj)+'</div>';
  });
  if(estAuj && !place) out+='<div class="maintenant"><span>'+h+'</span></div>';
  return out+'</div>';
}
function fragSuite(n){
  var s=n.suite; if(!s||!s.texte) return "";
  var cl="suite";
  if(s.fait) cl+=" faite";
  else if(s.echeance && s.echeance<auj()) cl+=" retard";
  return '<div class="'+cl+'">→ '+esc(s.texte)
    +(s.echeance?' <span class="mono">('+libCourt(s.echeance)+')</span>':"")+'</div>';
}
function fragNote(n){
  var c=n.chantier_id?chantierPar(n.chantier_id):null;
  var r=n.rubrique_id?rubriquePar(n.rubrique_id):null;
  return '<div class="note" data-note="'+esc(n.id)+'" style="cursor:pointer">'
    +'<div class="h">'+esc(n.heure||"")+(n.type?' · '+esc(n.type):"")
      +(n.duree?' · '+esc(n.duree)+' min':"")+'</div>'
    +(n.contenu?'<div class="txt">'+esc(n.contenu)+'</div>':"")
    +(c?'<div class="lien">↳ '+esc(c.libelle)+(c.commune?" ("+esc(c.commune)+")":"")+'</div>':"")
    +(r?'<div class="lien fam-'+esc(r.famille)+'">▪ '+esc(r.nom)+'</div>':"")
    +(lienRompu(n)?'<div class="lien" style="color:var(--rouge)">\u21b3 lien perdu \u2014 '
        +esc(n.chantier_ref)+'</div>':"")
    +fragSuite(n)+'</div>';
}
var dureeSuite=0, suiteEnCours=null, retourNote=null;
var noteActEnCours=null, dureeNoteAct=0;
/* le motif ouvre la note : « Constat de mise en danger : … ». C'est ainsi que Stella
   redige, et cela evite de retaper l'intitule a chaque fois. */
function prefixeNote(c){
  var v=String(c.type||"").trim();
  if(!v) v=String(catDe(c).lib||"").trim();
  return v ? v+" : " : "";
}
function noterActivite(id){
  var c=chantierPar(id); if(!c) return;
  noteActEnCours=id;
  dureeNoteAct=+c.duree||0;
  var K=catDe(c), pre=prefixeNote(c);
  var jeu=jeuStatuts(K.statuts);
  var corps='<div class="vigi" data-niveau="info" style="margin-bottom:12px">'
      +'<div class="sig">'+esc(K.sym||"\u25aa")+'</div><div class="corps">'
      +'<div class="txt">'+esc(c.libelle||"")+'</div>'
      +'<div class="sous">'+esc([c.reference,c.tiers,c.commune].filter(Boolean).join(" \u00b7 "))
      +(c.heure?' \u00b7 '+esc(c.heure):"")+'</div></div></div>'
    +'<label class="champ">Compte rendu'
      +'<textarea id="naTxt" style="width:100%;min-height:120px;padding:8px;border:1px solid var(--trait);border-radius:2px">'
      +esc(pre)+'</textarea></label>'
    +'<div class="ligne" style="margin-top:8px">'
      +selGerable('id="naType"',"types_note",(D.parametres.types_note||[])[0])
      +'<span class="puce-lbl">Temps</span>'
      +[15,30,60,120].map(function(m){
          return '<button class="puce'+(dureeNoteAct===m?" on":"")+'" data-dna="'+m+'">'+m+'</button>';
        }).join("")
      +'<input type="number" id="naDuree" min="0" step="5" value="'+esc(dureeNoteAct||"")+'" '
      +'style="width:74px" title="Durée en minutes">'
      +'<span class="puce-lbl">min</span>'
    +'</div>'
    +'<label class="champ" style="margin-top:10px">Statut après cette note'
      +'<select id="naStatut">'+selOpts(jeu,c.statut||"")+'</select></label>';
  ouvrirModale("Noter \u2014 "+(K.lib||"activité"),corps,[
    {txt:"Annuler",fn:function(){ noteActEnCours=null; fermerModale() }},
    {txt:"Enregistrer",classe:"",droite:true,fn:validerNoteActivite}
  ]);
  var e=$("#naTxt");
  if(e){ e.focus(); e.setSelectionRange(e.value.length,e.value.length) }   /* curseur apres le motif */
}
function validerNoteActivite(){
  var c=chantierPar(noteActEnCours);
  if(!c){ fermerModale(); return }
  var e=$("#naTxt"), txt=e?e.value.trim():"";
  var pre=prefixeNote(c);
  if(!txt || txt===pre.trim()){ if(e) e.focus(); toast("Décrivez ce qui s'est passé",true); return }
  var dur=+($("#naDuree")?$("#naDuree").value:0)||dureeNoteAct||0;
  D.notes.push({id:uid(),date:auj(),heure:hNow(),
    type:$("#naType")?$("#naType").value:"",
    chantier_id:c.id,rubrique_id:"",chantier_ref:refDossier(c),
    contenu:txt,duree:dur,suite:null});
  var ns=$("#naStatut")?$("#naStatut").value:"";
  var avant=c.statut, change=false;
  if(ns && ns!==c.statut){
    c.statut=ns; change=true;
    var Km=catDe(c);
    if(Km && Km.miroir) c[Km.miroir]=ns;      /* le statut se reflete dans son champ dedie */
  }
  noteActEnCours=null; dureeNoteAct=0;
  fermerModale(); modifie();
  if(change && !CLOS[avant] && estClos(c)) suggererCloture(c);
  rendre();
  toast("Note ajoutée"+(dur?" \u00b7 "+dur+" min":"")+(change?" \u00b7 statut : "+libStatut(c.statut):""));
}
function cloreSuite(id,retour){
  var n=notePar(id);
  if(!n || !n.suite) return;
  suiteEnCours=id; dureeSuite=0; retourNote=retour?id:null;
  var c=n.chantier_id?chantierPar(n.chantier_id):null;
  var r=n.rubrique_id?rubriquePar(n.rubrique_id):null;
  var rattache = c ? (catDe(c).sym+" "+(c.libelle||"")+(c.commune?" ("+c.commune+")":""))
                   : (r ? "▪ "+r.nom : "aucun rattachement");
  var corps='<div class="vigi" data-niveau="info" style="margin-bottom:14px">'
      +'<div class="sig">▪</div><div class="corps">'
      +'<div class="txt">'+esc(n.suite.texte)+'</div>'
      +'<div class="sous">'+esc(rattache)+(n.suite.echeance?" · échéance "+esc(libCourt(n.suite.echeance)):"")+'</div>'
      +'</div></div>'
    +'<label class="champ">Ce que vous avez fait'
      +'<textarea id="suiteNote" style="width:100%;min-height:90px;padding:8px;border:1px solid var(--trait);border-radius:2px" '
      +'placeholder="Trace de l\'action : courrier envoyé, appel passé, dossier transmis…"></textarea></label>'
    +'<div class="ligne" style="margin-top:8px">'
      +selGerable('id="suiteType"',"types_note",(D.parametres.types_note||[])[0])
      +'<span class="puce-lbl">Temps passé</span>'
      +[5,15,30,60].map(function(m){ return '<button class="puce" data-dsu="'+m+'">'+m+'</button>' }).join("")
      +'<span class="puce-lbl">min</span>'
    +'</div>'
    /* enchainer sans repasser par la fiche : ce qui reste a faire se saisit ici meme */
    +'<hr class="sep">'
    +'<div class="grille">'
      +'<label class="champ">Et ensuite<input type="text" id="suiteSuivTxt" '
        +'placeholder="Ex : relancer si pas de retour"></label>'
      +'<label class="champ">Échéance'+inDate('id="suiteSuivEch"',"")+'</label>'
    +'</div>'
    +'<div class="note-aide" style="margin:2px 0 0">Laissez vide si l\u2019action est close.</div>';
  ouvrirModale("Action terminée",corps,[
    {txt:"Sans note",classe:"creux",fn:function(){ validerSuite(false) }},
    {txt:"Annuler",fn:function(){
      var rv=retourNote; suiteEnCours=null; retourNote=null; fermerModale();
      if(rv && notePar(rv)) editerNote(rv);
    }},
    {txt:"Enregistrer la note",classe:"",droite:true,fn:function(){ validerSuite(true) }}
  ]);
  var e=$("#suiteNote"); if(e) e.focus();
}
function validerSuite(avecNote){
  var n=notePar(suiteEnCours);
  if(!n){ fermerModale(); return }
  var txt=avecNote && $("#suiteNote") ? $("#suiteNote").value.trim() : "";
  if(avecNote && !txt){ $("#suiteNote").focus(); toast("Décrivez l'action, ou choisissez « Sans note »",true); return }
  /* la suite suivante se saisit dans la meme fenetre : elle vaut pour « Sans note » aussi */
  var sq=$("#suiteSuivTxt")?$("#suiteSuivTxt").value.trim():"";
  var se=$("#suiteSuivEch")?$("#suiteSuivEch").value:"";
  var suivante=sq?{texte:sq,echeance:se,fait:false}:null;
  if(n.suite) n.suite.fait=true;
  if(txt || suivante){
    D.notes.push({id:uid(),date:auj(),heure:hNow(),
      type:$("#suiteType")?$("#suiteType").value:"",
      chantier_id:n.chantier_id||"",rubrique_id:n.rubrique_id||"",
      chantier_ref:n.chantier_ref||"",
      contenu:txt,duree:txt?(dureeSuite||0):0,suite:suivante});
  }
  suiteEnCours=null; dureeSuite=0;
  var rev=retourNote; retourNote=null;
  fermerModale(); modifie(); rendre();
  toast("Action soldée"+(txt?" \u00b7 note ajoutée":"")+(suivante?" \u00b7 suite créée":""));
  if(rev && notePar(rev)) editerNote(rev);   /* on rouvre la note d'ou l'on vient */
}
var horizonAttente=7;                 /* une semaine au demarrage */
/* -1 = echeance a aujourd'hui ou deja depassee. Les horizons positifs, eux, embarquent
   aussi les taches sans echeance : c'est une reserve, pas une liste du jour. */
var HORIZONS=[[-1,"Aujourd\u2019hui"],[7,"1 sem."],[14,"2 sem."],[21,"3 sem."],[30,"1 mois"],[0,"Tout"]];
function suitesHorizon(){
  var l=suitesOuvertes();
  if(horizonAttente===-1){
    var h=auj();
    return l.filter(function(n){ return n.suite.echeance && n.suite.echeance<=h });
  }
  if(!horizonAttente) return l;
  var d=new Date(); d.setDate(d.getDate()+horizonAttente);
  var lim=iso(d);
  return l.filter(function(n){ return !n.suite.echeance || n.suite.echeance<=lim });
}
function suitesDuJour(){
  var h=auj();
  return suitesOuvertes().filter(function(n){ return n.suite.echeance && n.suite.echeance<=h });
}
/* ============ reporter une tache ============
   Le report part d'aujourd'hui pour une tache en retard, et de son echeance pour une
   tache encore a venir : decaler « d'un jour » une tache echue depuis une semaine en
   la laissant dans le passe n'avance a rien.
   Si la date calculee tombe un jour non travaille, elle glisse au prochain jour ouvre :
   une echeance posee un dimanche est en retard des le lundi matin. */
var reportOuvert=null;
var REPORTS=[["1J",1],["2J",2],["5J",5],["1S",7],["2S",14],["1M","mois"]];
function baseReport(s){
  var h=auj();
  return (s && s.echeance && s.echeance>h) ? s.echeance : h;
}
function dateReport(s,pas){
  var d=pIso(baseReport(s));
  if(pas==="mois") d.setMonth(d.getMonth()+1); else d.setDate(d.getDate()+(+pas||0));
  var brut=iso(d), motif=motifNonOuvre(brut);
  /* prochainOuvre part du lendemain : on l'amorce la veille pour qu'il puisse
     retomber sur la date brute si celle-ci est deja ouvree */
  return {date:motif?prochainOuvre(iso(new Date(d.getTime()-86400000))):brut,
          glisse:motif||""};
}
function reporterSuite(id,pas){
  var n=notePar(id);
  if(!n || !n.suite){ reportOuvert=null; rendre(); return }
  var avant=n.suite.echeance;
  var r=dateReport(n.suite,pas);
  n.suite.echeance=r.date; reportOuvert=null;
  modifie(); rendre();
  toast("Reporté au "+libCourt(r.date)
    +(avant?"":" \u00b7 échéance posée")
    +(r.glisse?" \u00b7 décalé : "+r.glisse:""));
}
function fragReport(id,s){
  return '<div class="ligne report" style="margin-top:6px">'
    +'<span class="puce-lbl">Reporter au</span>'
    +REPORTS.map(function(r){
        return '<button class="puce" data-rep="'+esc(id)+'" data-pas="'+r[1]+'" '
          +'title="'+esc(libCourt(dateReport(s,r[1]).date))+'">'+r[0]+'</button>';
      }).join("")
    +'<button class="b mini creux" data-rep="'+esc(id)+'" data-pas="autre">Autre…</button>'
    +'<button class="lien" data-repoff="1">Annuler</button>'
  +'</div>';
}
/* La meme ligne d'echeance etait dessinee a trois endroits — En attente, Prochain jour
   ouvre, Calendrier — avec a chaque fois un sous-ensemble different de boutons. Une
   seule fonction : ce qu'on peut faire d'une tache ne depend pas de l'ecran ou on la lit.
   « entete » laisse chaque vue dire ce qu'elle sait deja : inutile de repeter l'echeance
   dans une colonne du jour concerne. */
function fragEcheance(n,entete){
  var s=n.suite; if(!s) return "";
  var c=n.chantier_id?chantierPar(n.chantier_id):null;
  var retard=s.echeance && s.echeance<auj();
  var h=(entete!=null) ? entete
    : (s.echeance?(retard?'<span style="color:var(--rouge)">échéance '+libCourt(s.echeance)
          +' \u2014 en retard</span>':'échéance '+libCourt(s.echeance)):'sans échéance')
      +' \u00b7 noté le '+libCourt(n.date);
  return '<div class="note"><div class="h">'+h+'</div>'
    +'<div class="txt">'+esc(s.texte)+'</div>'
    +(c?'<div class="lien">\u21b3 '+esc(c.libelle)+'</div>':"")
    +'<div class="ligne">'
      +'<button class="b mini creux" data-fait="'+esc(n.id)+'">Marquer fait</button>'
      +(reportOuvert===n.id?"":'<button class="b mini creux" data-repon="'+esc(n.id)+'">Reporter</button>')
      +'<button class="lien" data-note="'+esc(n.id)+'">Ouvrir la note</button>'
    +'</div>'
    +(reportOuvert===n.id?fragReport(n.id,s):"")
  +'</div>';
}
function fragAttente(){
  var l=suitesHorizon(),tot=suitesOuvertes().length;
  var barre='<div class="ligne" style="margin:0 0 10px">'
    +HORIZONS.map(function(h){
        /* le compte du jour reste visible meme depuis un autre horizon */
        var n=(h[0]===-1)?suitesDuJour().length:0;
        return '<button class="b mini'+(horizonAttente===h[0]?"":" creux")+'" data-hor="'+h[0]+'">'
          +h[1]+(h[0]===-1&&n?' <b>'+n+'</b>':"")+'</button>';
      }).join("")
    +(tot>l.length?'<span class="note-aide" style="margin:0 0 0 auto">'
        +(horizonAttente===-1?(tot-l.length)+' au-del\u00e0':(tot-l.length)+' plus loin')+'</span>':"")
  +'</div>';
  if(!l.length) return barre+'<div class="vide"><b>'
    +(horizonAttente===-1?'Rien à échéance aujourd\u2019hui':'Rien dans cet horizon')+'</b>'
    +(tot?'Élargissez le filtre pour voir les '+tot+' tâche(s) en attente.':'Les tâches à faire apparaîtront ici.')+'</div>';
  return barre+l.map(function(n){ return fragEcheance(n,null) }).join("");
}
function fragVigilances(date){
  var l=vigilancesDu(date);
  var ajout='<div class="ligne" style="margin-top:'+(l.length?"12px":"0")+'">'
    +'<input type="text" id="vigiTxt" placeholder="Consigne, aléa, alerte du jour…" style="flex:1;min-width:200px">'
    +selOpts_niveau()
    +'<button class="b" data-act="vigi-add">Ajouter</button></div>';
  if(!l.length) return '<div class="vide" style="padding:10px 0 4px"><b>Aucun point de vigilance</b>'
    +'Ce qui doit rester sous les yeux, hors activité. La date indique jusqu\'à quand.</div>'+ajout;
  return l.map(function(v){
    var n=v.niveau||"info",rt=vigilanceEnRetard(v),j=rt?joursEcoules(v.date):0;
    return '<div class="vigi'+(rt?" retard":"")+'" data-niveau="'+esc(n)+'">'
      +'<div class="sig">'+(n==="info"?"▪":"▲")+'</div>'
      +'<div class="corps" data-vigi="'+esc(v.id)+'" style="cursor:pointer">'
        +'<div class="txt">'+esc(v.texte)+'</div>'
        +'<div class="sous">'+(v.permanent?"permanent":(v.date?"jusqu\'au "+esc(libCourt(v.date)):"sans échéance"))
          +(v.origine?" · "+esc(v.origine):"")
          +(rt?' <span class="depasse">échéance dépassée depuis '+j+" jour"+(j>1?"s":"")+'</span>':"")
          +'</div></div>'
      +'<div class="outils">'
        +(rt?'<button class="b mini creux" data-vigi-jour="'+esc(v.id)+'" title="Repousser l\'échéance d\'une semaine">Prolonger 7 j</button>':"")
        +'<button class="b mini creux" data-vigi-clos="'+esc(v.id)+'">Lever</button></div>'
      +'</div>';
  }).join("")+ajout;
}
function selOpts_niveau(v){
  return '<select id="vigiNiv">'+selOpts([["info","Information"],["attention","Attention"],["critique","Critique"]],v||"attention")+'</select>';
}
function editerVigilance(id){
  var v=null,l=D.vigilances||[];
  for(var i=0;i<l.length;i++) if(l[i].id===id) v=l[i];
  if(!v) return;
  var corps='<label class="champ">Point de vigilance<textarea name="texte" style="width:100%;min-height:90px;padding:8px;border:1px solid var(--trait);border-radius:2px">'+esc(v.texte)+'</textarea></label>'
   +'<div class="grille" style="margin-top:12px">'
   +'<label class="champ">Niveau<select name="niveau">'+selOpts([["info","Information"],["attention","Attention"],["critique","Critique"]],v.niveau)+'</select></label>'
   +'<label class="champ">Valable jusqu\'au'+inDate('name="date"',v.date)+'</label>'
   +'<label class="champ">Origine<input type="text" name="origine" value="'+esc(v.origine)+'" placeholder="Consigne agence, exploitation…"></label>'
   +'</div>'
   +'<div class="ligne"><label style="font-size:13.5px;display:flex;gap:6px;align-items:center">'
   +'<input type="checkbox" name="perm" '+(v.permanent?"checked":"")+'> Permanent (reste affiché tous les jours jusqu\'à sa levée)</label></div>';
  ouvrirModale("Point de vigilance",corps,[
    {txt:"Supprimer",classe:"creux",fn:function(){
      D.vigilances=D.vigilances.filter(function(x){return x.id!==id});
      fermerModale(); modifie(); rendre(); toast("Point de vigilance supprimé");
    }},
    {txt:"Prolonger d'une semaine",classe:"creux",fn:function(){
      var d=new Date(); d.setDate(d.getDate()+7); v.date=iso(d); v.permanent=false;
      fermerModale(); modifie(); rendre(); toast("Valable jusqu'au "+libCourt(v.date));
    }},
    {txt:"Fermer",fn:fermerModale,droite:true},
    {txt:"Enregistrer",classe:"",droite:true,fn:function(){
      v.texte=valChamp("texte"); v.niveau=valChamp("niveau");
      v.date=valChamp("date"); v.origine=valChamp("origine");
      v.permanent=$("#modCorps").querySelector('[name="perm"]').checked;
      fermerModale(); modifie(); rendre(); toast("Point de vigilance mis à jour");
    }}
  ]);
}
function fragCompteur(date){
  var c=compteurDu(date,false), p=D.parametres.compteur||{heures:3,cadence:15};
  var h=c?c.heures:(+p.heures||0), k=c?c.cadence:(+p.cadence||0), t=c?c.traites:0;
  var obj=Math.round(h*k), pct=obj>0?Math.min(100,Math.round(t/obj*100)):0;
  var reel=cadenceReelle(c), reste=Math.max(0,obj-t);
  var ms=minutesSession(c), ouv=sessionOuverte(c);
  var restant="—";
  if(reste===0 && obj>0) restant="objectif atteint";
  else if(reel && reel>0) restant=dureeLisible(reste/reel*60);
  var creneaux=(c&&c.sessions&&c.sessions.length)
    ? c.sessions.map(function(s){return s.debut+"–"+(s.fin||"en cours")}).join("  ·  ") : "";
  return '<div class="cpt-tete">'
    +'<div class="cpt-nb">'+t+'</div>'
    +'<div class="cpt-obj">/ '+obj+' dossiers</div>'
    +'<div class="cpt-etat">'+pct+' %'+(reel?'<br><span id="dtCad">'+fmtCad(reel)+'</span> /h réel':"")+'</div>'
  +'</div>'
  +'<div class="jauge'+(obj>0&&t>=obj?" atteint":"")+'"><i style="width:'+pct+'%"></i></div>'
  +'<div class="ligne" style="margin-top:10px">'
    +'<button class="b" data-dt="1">+ 1</button>'
    +'<button class="b creux" data-dt="5">+ 5</button>'
    +'<button class="b creux" data-dt="10">+ 10</button>'
    +'<button class="b creux mini" data-dt="-1">− 1</button>'
    +'<button class="lien" data-act="dt-set">Corriger le total</button>'
  +'</div>'
  +'<div class="sess'+(ouv?" active":"")+'">'
    +'<span class="voyant"></span>'
    +'<span class="chrono"><span id="dtTemps">'+dureeLisible(ms)+'</span> <b>/ '+(h||0)+' h prévues</b></span>'
    +'<span class="bt"><button class="b '+(ouv?"rouge":"creux")+'" data-act="'+(ouv?"sess-stop":"sess-start")+'">'
      +(ouv?"Arrêter la session":"Démarrer la session")+'</button></span>'
  +'</div>'
  +'<div class="creneaux">'+(creneaux?esc(creneaux)+' · ':"")
    +'<button class="lien" data-act="sess-edit">corriger les créneaux</button></div>'
  +'<div class="cpt-detail">'
    +'<div><span>Restant</span><b>'+reste+'</b></div>'
    +'<div><span>Cadence réelle</span><b>'+(reel?fmtCad(reel):"—")+'</b></div>'
    +'<div><span>Temps estimé</span><b id="dtReste">'+restant+'</b></div>'
    +'<div><span>Saisies</span><b>'+(c&&c.jalons?c.jalons.length:0)+'</b></div>'
  +'</div>'
  +'<hr class="sep" style="margin:14px 0 10px">'
  +'<div class="reglette">Objectif : <input type="number" id="dtH" min="0" step="0.5" value="'+h+'"> h'
    +' × <input type="number" id="dtK" min="0" step="1" value="'+k+'"> dossiers/h'
    +' = <b class="mono">'+obj+'</b></div>'
  +'<div class="note-aide">'
    +(ms>=5
      ? 'La cadence réelle est établie sur le temps de session chronométré, interruptions exclues.'
      : 'Démarrez la session quand vous attaquez vos dossiers, arrêtez-la dès que vous êtes interrompue. '
       +'Sans chronomètre, la cadence est estimée sur l\'écart entre vos saisies, interruptions comprises.')
  +'</div>';
}
function fmtCad(v){ return v.toFixed(1).replace(".",",") }
var prochainRappelJour=null;
function majCompteurPause(){
  var e=$("#cdPause"); if(!e) return;
  var m=+(M.reglages.rappel_jour||0);

/* ============ calendrier ============
   Une grille mensuelle qui montre ce qui est deja pose : les rendez-vous datés, et le
   nombre d'echeances par jour. Elle ne cree rien et ne deplace rien — on y lit, puis
   on ouvre la journee pour agir. Les donnees sont celles des autres vues, pas une copie. */
var moisCal="", jourCal="";
function moisCalCourant(){
  if(!moisCal) moisCal=auj().slice(0,7)+"-01";

}
function jourCalCourant(){

}

  "juillet","août","septembre","octobre","novembre","décembre"];
/* index par date, construit une fois : sans lui la grille rebalaie tout le portefeuille
   pour chacune de ses quarante-deux cases */
function indexCalendrier(){
  var rdv={}, ech={};
  (D.chantiers||[]).forEach(function(c){
    if(estArchive(c)) return;
    evenements(c).forEach(function(e){
      if(!e.date || !evtVivant(e)) return;
      (rdv[e.date]||(rdv[e.date]=[])).push(vueEvt(c,e));
    });
  });
  suitesOuvertes().forEach(function(n){
    if(!n.suite.echeance) return;
    (ech[n.suite.echeance]||(ech[n.suite.echeance]=[])).push(n);
  });
  Object.keys(rdv).forEach(function(k){

function caseCalendrier(s,ix,moisAff){
  var rd=(ix.rdv[s]||[]), ec=(ix.ech[s]||[]);
  var d=pIso(s), hors=(s.slice(0,7)!==moisAff), chome=motifNonOuvre(s);
  var cl="c"+(hors?" hors":"")+(chome?" chome":"")
    +(s===auj()?" auj":"")+(s===jourCalCourant()?" sel":"");
  /* une pastille par rendez-vous, a la couleur de sa categorie ; au-dela de quatre on
     compte, pour ne pas transformer la case en confetti */
  var MAX=4;
  var pts=rd.slice(0,MAX).map(function(c){
    var K=catDe(c);
    return '<span class="pt" style="background:'+esc(K.couleur||"#4A514C")+'" title="'
      +esc((c.heure?c.heure+" · ":"")+(c.libelle||""))+'"></span>';
  }).join("")+(rd.length>MAX?'<span class="pl">+'+(rd.length-MAX)+'</span>':"");
  var retard=(s<auj());
  return '<button class="'+cl+'" data-caljour="'+esc(s)+'" '
      +'aria-label="'+esc(libDate(s))+' — '+rd.length+' rendez-vous, '+ec.length+' échéance(s)'
      +'"><span class="n">'+d.getDate()+'</span>'
    +(rd.length?'<span class="pts">'+pts+'</span>':"")
    +(ec.length?'<span class="ech'+(retard?" retard":"")+'">'+ec.length+' éch.</span>':"")
    /* « samedi » ecrit dans dix cases par mois n'apprend rien : la trame grise le dit
       deja. On ne nomme que ce qui ne se devine pas — ferie, absence declaree. */
    +(chome&&!hors&&!/^(samedi|dimanche|jour non travaill)/.test(chome)
      ?'<span class="mot">'+esc(chome)+'</span>':"")
  +'</button>';
}
function fragGrilleCal(){
  var ix=indexCalendrier(), m=moisCalCourant(), moisAff=m.slice(0,7);
  var prem=pIso(m);
  /* la semaine commence lundi : getDay() rend 0 pour dimanche */
  var dec=(prem.getDay()+6)%7;
  var dep=pIso(m); dep.setDate(dep.getDate()-dec);
  var jn=["lun","mar","mer","jeu","ven","sam","dim"]
    .map(function(x){ return '<div class="jn">'+x+'</div>' }).join("");
  var cases="",i,cur=dep;
  for(i=0;i<42;i++){
    cases+=caseCalendrier(iso(cur),ix,moisAff);
    cur=new Date(cur.getTime()+86400000);
    if(i>=34 && iso(cur).slice(0,7)>moisAff && (i+1)%7===0) break;   /* 5 semaines suffisent souvent */
  }
  return '<div class="cal">'+jn+cases+'</div>';
}
function fragJourCal(){

          +'<div class="h">'+esc(c.heure||"--:--")+'</div><div class="croix">'+catDe(c).sym+'</div>'
          +fragChantier(c,s===auj())+'</div>';

    : '<div class="vide"><b>Aucun rendez-vous</b>Rien n\u2019est daté sur cette journée.</div>';
  corps+='<hr class="sep"><div class="pause-lbl" style="text-align:left;margin-bottom:6px">'
    +'Échéances du jour</div>';
  corps+= ec.length

/* ============ lecteur XLSX autonome : ZIP + XML, sans bibliotheque ============ */
function zipOuvrir(buf){
  var dv=new DataView(buf),u8=new Uint8Array(buf),eocd=-1,i;
  for(i=u8.length-22;i>=0 && i>u8.length-66000;i--){
    if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break }
  }
  if(eocd<0) throw new Error("Ce fichier n'est pas une archive Excel valide");
  var nb=dv.getUint16(eocd+10,true),off=dv.getUint32(eocd+16,true),p=off,ent=[],dec=new TextDecoder();
  for(var k=0;k<nb;k++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    var meth=dv.getUint16(p+10,true),tc=dv.getUint32(p+20,true);
    var ln=dv.getUint16(p+28,true),lx=dv.getUint16(p+30,true),lc=dv.getUint16(p+32,true);
    var lh=dv.getUint32(p+42,true);
    ent.push({nom:dec.decode(u8.subarray(p+46,p+46+ln)),meth:meth,tc:tc,lh:lh});
    p+=46+ln+lx+lc;
  }
  return {u8:u8,dv:dv,ent:ent};
}
function zipLire(z,nom){
  var e=null;
  z.ent.forEach(function(x){ if(x.nom===nom) e=x });
  if(!e) return Promise.resolve(null);
  var p=e.lh;
  if(z.dv.getUint32(p,true)!==0x04034b50) return Promise.reject(new Error("Entrée corrompue"));
  var ln=z.dv.getUint16(p+26,true),lx=z.dv.getUint16(p+28,true),deb=p+30+ln+lx;
  var brut=z.u8.subarray(deb,deb+e.tc);
  if(e.meth===0) return Promise.resolve(new TextDecoder().decode(brut));
  if(typeof DecompressionStream!=="function")
    return Promise.reject(new Error("Ce navigateur ne sait pas décompresser (Edge 103+ requis)"));
  var ds=new DecompressionStream("deflate-raw"),w=ds.writable.getWriter();
  w.write(brut); w.close();
  return new Response(ds.readable).text();
}
function colNum(ref){
  var m=/^([A-Z]+)/.exec(ref||"");
  if(!m) return 0;
  var n=0;
  for(var i=0;i<m[1].length;i++) n=n*26+(m[1].charCodeAt(i)-64);
  return n;
}
function xlChaines(xml){
  if(!xml) return [];
  var doc=new DOMParser().parseFromString(xml,"application/xml"),si=doc.getElementsByTagName("si"),l=[];
  for(var i=0;i<si.length;i++){
    var ts=si[i].getElementsByTagName("t"),s="";
    for(var j=0;j<ts.length;j++) s+=ts[j].textContent;
    l.push(s);
  }
  return l;
}
function xlLignes(xml,ch){
  var doc=new DOMParser().parseFromString(xml,"application/xml");
  var err=doc.getElementsByTagName("parsererror");
  if(err.length) throw new Error("Feuille illisible");
  var rows=doc.getElementsByTagName("row"),out=[];
  for(var i=0;i<rows.length;i++){
    var cs=rows[i].getElementsByTagName("c"),lg=[];
    for(var j=0;j<cs.length;j++){
      var c=cs[j],t=c.getAttribute("t"),idx=colNum(c.getAttribute("r"))||j+1,v="";
      if(t==="inlineStr"){ var is=c.getElementsByTagName("t"); v=is.length?is[0].textContent:"" }
      else{
        var vn=c.getElementsByTagName("v");
        if(vn.length){ v=vn[0].textContent; if(t==="s") v=ch[+v]||"" }
      }
      lg[idx-1]=v;
    }
    out.push(lg);
  }
  return out;
}
function xlLire(buf){
  var z;
  try{ z=zipOuvrir(buf) }catch(e){ return Promise.reject(e) }
  var feuille=null;
  z.ent.forEach(function(x){
    if(!feuille && /^xl\/worksheets\/sheet\d+\.xml$/.test(x.nom)) feuille=x.nom;
  });
  if(!feuille) return Promise.reject(new Error("Aucune feuille trouvée dans le classeur"));
  return zipLire(z,"xl/sharedStrings.xml").then(function(sx){

function serieDate(v){
  var n=+v;
  if(!n || n<20000 || n>80000) return "";
  var ms=Date.UTC(1899,11,30)+n*86400000,d=new Date(ms);
  return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");
}

/* ============ import des dossiers ============ */
function valeurCol(lg,def){
  var v=lg[def.c-1];
  v=(v==null?"":String(v)).trim();
  if(def.date && v && /^[0-9]+([.,][0-9]+)?$/.test(v)){
    var d=serieDate(v);
    if(d) return d;
  }
  return v;
}
function statutDepuisEtat(e){
  e=String(e||"");
  if(e.indexOf("λ")===0) return "realise";
  if(e.indexOf("α")===0) return "planifie";
  if(!e) return "planifie";
  return "en_cours";
}
function normRefTech(v){ return String(v||"").replace(/[^0-9]/g,"") }
function dossierParRef(ref_technique){
  var p=normRefTech(ref_technique),t=null;
  if(!p) return null;
  var kc=(catImport()||{cle:"chantier"}).cle;
  D.chantiers.forEach(function(c){
    if((c.categorie||"chantier")===kc && normRefTech(c.ref_technique)===p) t=c;
  });
  return t;
}
function catImport(){
  var l=categories(),i;
  for(i=0;i<l.length;i++) if(l[i]["import"]) return l[i];
  return l[0]||null;
}
function champsImport(){
  var K=catImport();
  return (K?K.champs:[]).filter(function(f){ return f.col>0 })
    .map(function(f){ return {c:f.col,k:f.cle,lib:f.lib,date:f.type==="date",liste:f.liste} });
}
function ligneVersDossier(lg){
  var o={};
  champsImport().forEach(function(def){ o[def.k]=valeurCol(lg,def) });
  return o;
}
var importEnCours=null;
function champFiltre(){
  var K=catImport();
  return (K && K.filtre) ? K.filtre : "";
}
function diagImport(){
  /* le filtre gestionnaire ne tient qu'a la configuration de la categorie : s'il manque,
     l'import avale toutes les lignes du fichier sans que rien ne le signale. */
  var K=catImport(),d={cat:K?(K.plur||K.lib):"(aucune)",cle:K?K.cle:"",cols:champsImport().length,
    marque:!!(K&&K["import"]),filtre:champFiltre(),
    attendu:!!(D.parametres.gestionnaire||"").trim(),applique:false,champConnu:false};
  if(d.filtre) champsImport().forEach(function(x){ if(x.k===d.filtre) d.champConnu=true });
  d.applique=!!(d.filtre && d.champConnu && d.attendu);
  d.souci = d.attendu && !d.applique;
  return d;
}
function memeGestionnaire(o){
  var cle=champFiltre();
  if(!cle) return true;                      /* aucun champ de filtre declare */
  var f=(D.parametres.gestionnaire||"").trim().toLowerCase();
  if(!f) return true;                        /* filtre vide : on prend tout */
  return String(o[cle]||"").trim().toLowerCase()===f;
}
function sansAccent(v){
  return String(v||"").normalize?String(v).normalize("NFD").replace(/[\u0300-\u036f]/g,""):String(v||"");
}
function estMarqueFait(v){
  var t=sansAccent(v).trim().toUpperCase().replace(/[.\s]+$/,"");
  if(!t) return false;
  var l=D.parametres.marqueurs_fait||MARQUEURS_FAIT,ok=false;
  l.forEach(function(m){ if(sansAccent(m).trim().toUpperCase()===t) ok=true });
  return ok;
}
function champsDate(){
  return champsImport().filter(function(x){ return x.date });

function datesIllisibles(o){
  /* une colonne date qui contient « FAIT », « OK », une remarque : on le signale sans bloquer */
  var l=[];
  champsDate().forEach(function(def){
    var v=String(o[def.k]||"").trim();
    if(v && !dateValide(v)) l.push({lib:def.lib,val:v,fait:estMarqueFait(v)});
  });
  return l;
}
function analyserImport(lignes){
  var nouv=[],maj=[],inchange=0,ignorees=0,autres=0,vus={},flous=[],revenus=[];
  for(var i=2;i<lignes.length;i++){          /* ligne 1 = titres de groupe, ligne 2 = en-tetes */
    var lg=lignes[i]||[],o=ligneVersDossier(lg);
    if(!memeGestionnaire(o)){ autres++; continue }
    if(!normRefTech(o.ref_technique)){ ignorees++; continue }
    vus[normRefTech(o.ref_technique)]=1;
    var di=datesIllisibles(o);
    if(di.length) flous.push({ref_technique:normRefTech(o.ref_technique),l:di});
    var ex=dossierParRef(o.ref_technique);
    if(!ex){ nouv.push(o); continue }
    if(estArchive(ex)) revenus.push(ex);      /* archive mais de retour dans mon perimetre */
    var diffs=[];
    champsImport().forEach(function(def){
      var av=(ex[def.k]==null?"":String(ex[def.k])),ap=o[def.k]||"";
      if(!ap) return;                 /* cellule vide : rien ne sera ecrase, rien a montrer */
      if(av!==ap) diffs.push({lib:def.lib,av:av,ap:ap});
    });
    var lib=libelleDossier(o);
    var perso=(libellePerso(ex) && lib!==ex.libelle) ? {actuel:ex.libelle,propose:lib} : null;
    if(diffs.length || perso) maj.push({cible:ex,val:o,diffs:diffs,perso:perso}); else inchange++;
  }
  /* dossiers presents chez moi mais plus dans le fichier filtre : changement de gestionnaire,
     cloture, sortie du perimetre. Jamais supprime d'office : propose au cas par cas.
     Les dossiers deja archives sont hors sujet : leur sortie du perimetre est actee, et les
     reproposer a chaque import faisait revenir indefiniment la meme liste. */
  var absents=[],dejaArch=0,dg=diagImport();
  if(dg.applique){
    var kc=(catImport()||{cle:"chantier"}).cle;
    D.chantiers.forEach(function(c){
      if((c.categorie||"chantier")!==kc) return;
      var pr=normRefTech(c.ref_technique); if(!pr) return;
      if(vus[pr]) return;
      if(estArchive(c)){ dejaArch++; return }
      absents.push(c);
    });
  }
  return {nouv:nouv,maj:maj,inchange:inchange,ignorees:ignorees,autres:autres,revenus:revenus,
          absents:absents,dejaArch:dejaArch,flous:flous,filtreOk:dg.applique,
          total:Math.max(0,lignes.length-2)};
}
function libellePerso(c){
  return c && c.libelle_auto!=null && c.libelle!==c.libelle_auto;
}
/* Le libelle d'une fiche importee : le premier champ texte renseigne de la categorie,
   dans l'ordre de la fiche, et a defaut sa reference technique. Une regle qui ne
   suppose aucun modele particulier — elle lit ce qui est configure, pas des champs
   qu'elle connaitrait d'avance. */
function libelleDossier(o){
  var K=catImport(), v="";
  (K?K.champs:[]).forEach(function(f){
    if(!v && o[f.cle] && f.type==="texte") v=String(o[f.cle]).trim();
  });
  if(v) return v;
  var r=normRefTech(o.ref_technique);
  return r ? ("Référence technique "+r) : "Sans libellé";
}
function appliquerImport(c,o,garderLib){
  if(c.date==null) c.date="";        /* jamais absente : une fiche sans date l'a vide */
  /* le reporting ne renseigne pas toujours toutes les colonnes : une cellule vide
     est une absence d'information, jamais une demande d'effacement. */
  champsImport().forEach(function(def){
    var v=o[def.k];
    if(v==null || String(v).trim()==="") return;
    c[def.k]=v;
  });
  c.reference=o.ref_technique;
  var lib=libelleDossier(o);
  if(!(garderLib && libellePerso(c))) c.libelle=lib;
  c.libelle_auto=lib;                    /* trace du libelle genere, pour detecter vos retouches */
  if(o.nom_client) c.tiers=o.nom_client;
  var Ki=catImport(),st=(Ki&&Ki.miroir?o[Ki.miroir]:"");
  if(st) c.statut=st;
  /* la colonne date sert aussi de marqueur. Une vraie date planifie ; « FAIT » et
     consorts retirent la fiche du planning ; tout autre texte laisse la date en place. */
  if(dateValide(o.date_interv)) evtImport(c,o.date_interv);
  else if(estMarqueFait(o.date_interv)) evtImport(c,"");
  return c;
}

function validerImport(ajouter,mettreAJour,supprimer){
  var r=importEnCours;
  if(!r) return;
  var a=0,m=0,sup=0,cibles={};
  if(supprimer){
    var bx=$("#modCorps").querySelectorAll("input.abs"),i;
    for(i=0;i<bx.length;i++) if(bx[i].checked) cibles[bx[i].getAttribute("data-id")]=1;
    var n=0; for(var k in cibles) if(cibles.hasOwnProperty(k)) n++;
    var qi=(supprimer==="traite")?"comme traités (comptés dans les affaires menées à terme)"
           :((supprimer==="sorti")?"comme sortis de votre périmètre (comptés à part)":"sans qualification");
    if(n && !confirm("Archiver "+n+" dossier(s) "+qi+" ?\n\nRien n'est supprimé : notes, tâches et rattachements sont conservés.")) return;
  }
  var e=$("#gardLib"),garder=e?e.checked:true;
  if(ajouter) r.nouv.forEach(function(o){
    D.chantiers.push(appliquerImport({id:uid(),categorie:(catImport()||{cle:"chantier"}).cle,heure:"",duree:0,priorite:"normale",
      commune:"",adresse:"",contact_nom:"",contact_tel:"",commentaire:"",type:"",cree_le:new Date().toISOString()},o));
    a++;
  });
  if(mettreAJour) r.maj.forEach(function(x){ appliquerImport(x.cible,x.val,garder); m++ });
  var re=$("#reactiv"),rea=0;
  if(mettreAJour && r.revenus && (!re || re.checked))
    r.revenus.forEach(function(c){ if(desarchiver(c)) rea++ });
  if(supprimer){
    var iss=(supprimer==="traite"||supprimer==="sorti")?supprimer:"";
    D.chantiers.forEach(function(c){ if(cibles[c.id] && archiver(c,"absent du reporting",iss)) sup++ });
  }
  importEnCours=null;
  fermerModale(); modifie(); rendre();
  toast(a+" ajoutée(s)"+(m?" · "+m+" mise(s) à jour":"")+(sup?" · "+sup+" archivée(s)":"")
    +(rea?" · "+rea+" réactivée(s)":""));
}
function appliquerConfig(txt){
  var o;
  try{ o=JSON.parse(String(txt)) }catch(e){ toast("Fichier de configuration illisible",true); return }
  if(!estObjet(o) || o.type!=="pst-pilot-config" || !estTableau(o.categories)){
    toast("Ce fichier n'est pas une configuration de catégories",true); return;
  }
  if(!o.categories.length){ toast("Cette configuration ne contient aucune catégorie",true); return }
  var n=o.categories.length;
  if(!confirm("Remplacer vos "+categories().length+" catégorie(s) par les "+n+" du fichier ?\n\nVos activités et vos notes ne sont pas touchées.")) return;
  D.parametres.categories=o.categories.map(normaliserCat);
  var aj=0;
  if(o.listes) for(var k in o.listes) if(o.listes.hasOwnProperty(k) && !D.parametres[k]){ D.parametres[k]=o.listes[k]; aj++ }
  var connues={};
  categories().forEach(function(K){ connues[K.cle]=1 });
  var orph=0,prem=(categories()[0]||{}).cle||"chantier";
  D.chantiers.forEach(function(c){ if(!connues[c.categorie||"chantier"]){ c.categorie=prem; orph++ } });
  modifie(); rendre();
  toast("Configuration importée : "+n+" catégorie(s)"+(aj?" · "+aj+" liste(s) ajoutée(s)":"")+(orph?" · "+orph+" activité(s) rattachée(s)":""));
}
function tropGros(f){

function importerXlsx(f){
  if(tropGros(f)) return;
  var fr=new FileReader();
  fr.onload=function(){
    xlLire(fr.result).then(function(lignes){
      if(!lignes || lignes.length<3){ toast("Fichier vide ou sans données",true); return }
      ecranImport(analyserImport(lignes));

  fr.readAsArrayBuffer(f);
}

/* Les verifications de permanence vivent dans D.appels, avec nature:"verif". Elles n'en
   sont pas pour autant des appels : un appel a un interlocuteur, une duree, un objet ;
   une verification n'a qu'une heure et un intitule. Les verser dans le meme fichier
   donnait neuf colonnes vides sur onze et rendait tout decompte faux. Deux exports. */
function exportAppelsCSV(){
  var e=["Date","Heure","Qui appelle","Entreprise","Téléphone","Motif","Affaire","Commune",
         "Durée (min)","Objet","Suite à donner","Traitée"];
  var l=(D.appels||[]).filter(function(a){ return a.nature!=="verif" && dansPeriode(a.date) })
   .sort(function(a,b){return (a.date+a.heure).localeCompare(b.date+b.heure)})
   .map(function(a){return [a.date,a.heure,a.qui,a.entreprise,a.tel,a.motif,a.affaire||"",a.commune,
     a.duree||"",a.objet,a.suite||"",a.suite?(a.suite_faite?"oui":"non"):""]});
  telecharger("mypilot-pro-appels-"+suffixePeriode()+".csv",csv(e,l),"text/csv;charset=utf-8");
  toast(l.length+" appel(s) exporté(s) \u00b7 vérifications exclues");
}
function exportVerifsCSV(){
  var e=["Date","Heure","Vérification","Écart (min)","Attendu (min)","Dans la cadence"];
  /* on retrouve la cadence par la cle du rappel, et a defaut par son nom : les
     verifications tracees avant la 3.32.0 ne portent que le nom. */
  var parCle={},parNom={};
  (rappels()||[]).forEach(function(r){
    if(r.cle) parCle[String(r.cle)]=+r.minutes||0;
    parNom[String(r.nom)]=+r.minutes||0;
  });
  var cadence=function(a){
    if(a.rappel && parCle[String(a.rappel)]!=null) return parCle[String(a.rappel)];
    var v=parNom[String(a.motif||"")];
    return v==null?"":v;
  };
  var l=(D.appels||[]).filter(function(a){ return a.nature==="verif" && dansPeriode(a.date) })
   .sort(function(a,b){return (a.date+a.heure).localeCompare(b.date+b.heure)});
  /* l'interet d'une verification est sa cadence : on donne l'ecart avec la precedente
     du meme intitule, le meme jour. La premiere du jour n'a pas de precedente. */
  var prec={};
  var lignes=l.map(function(a){
    var cle=a.date+"|"+(a.rappel||String(a.motif||""));
    var att=cadence(a);
    var ec="",tenue="";
    if(prec[cle]!=null){
      ec=Math.max(0,minutes(a.heure)-prec[cle]);
      if(att) tenue=(ec<=att)?"oui":"non";
    }
    prec[cle]=minutes(a.heure);
    return [a.date,a.heure,a.motif||"Rappel",ec===""?"":String(ec),att===""?"":String(att),tenue];
  });
  telecharger("mypilot-pro-verifications-"+suffixePeriode()+".csv",csv(e,lignes),"text/csv;charset=utf-8");
  toast(lignes.length+" vérification(s) exportée(s)");
}
function libRattachement(n){

    var c=chantierPar(n.chantier_id);

    return "  → activité supprimée";
  }
  if(n.rubrique_id){
    var r=rubriquePar(n.rubrique_id);
    if(r) return "  → "+r.nom;
  }
  return "";
}

/* Le texte est rendu par une fonction qui ne fait que ca : tant qu'il n'etait
   produit qu'en ouvrant une fenetre, aucun banc ne pouvait le lire, et une
   verification comptee comme un appel y est restee de la 3.32.0 a la 3.34.1. */
function texteCompteRendu(jour){
  var d=jour||auj(),ch=chantiersDu(d),no=notesDu(d).slice().reverse();
  var t="Compte-rendu d'activité — "+libDate(d)+"\n"+"=".repeat(46)+"\n\n";
  var vg=vigilancesDu(d,d!==auj());
  if(vg.length){
    t+="POINTS DE VIGILANCE ("+vg.length+")\n";
    t+=vg.map(function(v){
      return "- ["+(v.niveau||"info").toUpperCase()+"] "+v.texte+(v.origine?"  ("+v.origine+")":"")
        +(vigilanceEnRetard(v)?"  [date dépassée depuis "+joursEcoules(v.date)+" j]":"");
    }).join("\n")+"\n\n";
  }
  var cp=compteurDu(d,false);
  if(D.parametres.mod_compteur!==false && cp && (cp.traites||cp.heures)){
    var ob=Math.round(cp.heures*cp.cadence),rl=cadenceReelle(cp),ms=minutesSession(cp);
    t+=String(D.parametres.titre_compteur||"Compteur de traitement").toUpperCase()+"\n";
    t+="- "+cp.traites+" dossier(s) traités pour un objectif de "+ob
      +" ("+cp.heures+" h × "+cp.cadence+"/h)"
      +(ob?" — "+Math.round(cp.traites/ob*100)+" %":"")+"\n";
    if(ms) t+="- temps de traitement chronométré : "+dureeLisible(ms)
      +" ("+(cp.sessions||[]).map(function(s){return s.debut+"–"+(s.fin||"en cours")}).join(", ")+")\n";
    if(rl) t+="- cadence réelle constatée : "+fmtCad(rl)+" dossiers/h\n";
    t+="\n";
  }
  t+="PLANNING DU JOUR"+(ch.length?" — "+resume(ch).replace(/&[^;]+;/g,""):"")+"\n";
  if(!ch.length) t+="- rien de positionné ce jour (voir le journal pour l'activité réalisée)\n";
  t+="\n";
  categories().forEach(function(K2){
    var k=K2.cle;
    var sl=ch.filter(function(c){return (c.categorie||"chantier")===k});
    if(!sl.length) return;
    t+=String(K2.plur||K2.lib).toUpperCase()+" ("+sl.length+")\n";
    t+=sl.map(function(c){
      var sup="";
      if(k==="convocation" && c.presence && c.presence!=="attendu") sup="  ["+libPresence(c.presence)+"]";
      if(k==="animation" && c.participants) sup="  ("+c.participants+" participants)";
      return "- "+(c.heure||"--:--")+"  "+c.libelle+(c.commune?" ("+c.commune+")":"")
        +(c.tiers?" — "+c.tiers:"")+"  ["+libStatut(c.statut)+"]"+sup;
    }).join("\n")+"\n\n";
  });
  var tout=appelsDu(d),ap=vraisAppels(tout).slice().reverse();
  var vf=tout.filter(function(a){ return a.nature==="verif" });
  if(D.parametres.mod_permanence!==false && ap.length){
    var tt=0; ap.forEach(function(a){ tt+=+a.duree||0 });
    t+="ASSISTANCE TÉLÉPHONIQUE ("+ap.length+" appel(s)"+(tt?", "+dureeLisible(tt)+" cumulées":"")+")\n";
    t+=ap.map(function(a){
      return "- "+(a.heure||"")+"  "+(a.qui||"appelant non précisé")
        +(a.motif?" ["+a.motif+"]":"")+(a.objet?" : "+a.objet:"")
        +(a.suite?"  → "+a.suite+(a.suite_faite?" (traité)":""):"");
    }).join("\n")+"\n\n";
  }
  /* Une verification n'est pas un appel : personne n'a telephone. Elle reste
     tracee — c'est du travail fait — mais comptee, pas deroulee ligne a ligne. */
  if(D.parametres.mod_permanence!==false && vf.length){
    t+="VÉRIFICATIONS DE PERMANENCE ("+vf.length+")\n";
    t+=compterPar(vf,nomVerification).map(function(x){
      return "- "+x[0]+" \u00d7 "+x[1];
    }).join("\n")+"\n\n";
  }
  t+="JOURNAL ("+no.length+" note(s))\n";
  t+= no.length? no.map(function(n){
    return "- "+(n.heure||"")+"  "+(n.type?"["+n.type+"] ":"")+(n.contenu||"(tâche)")+libRattachement(n);
  }).join("\n") : "- aucune";
  var s=suitesOuvertes();
  t+="\n\nÀ SUIVRE — état au "+libCourt(auj())+" ("+s.length+")\n";
  t+= s.length? s.map(function(n){
    var rt=n.suite.echeance&&n.suite.echeance<auj()?" [EN RETARD]":"";
    return "- "+n.suite.texte+(n.suite.echeance?"  (échéance "+libCourt(n.suite.echeance)+")":"")+rt+libRattachement(n);
  }).join("\n") : "- rien en attente";
  var suiv=prochainOuvre(d),cs=chantiersDu(suiv);
  t+="\n\nPLANNING DU PROCHAIN JOUR OUVRÉ — "+libDate(suiv)+" ("+cs.length+" entrée(s))\n";
  t+= cs.length? cs.map(function(c){
    return "- "+(c.heure||"--:--")+"  ["+catDe(c).lib+"] "+c.libelle+(c.commune?" ("+c.commune+")":"");
  }).join("\n") : "- rien de positionné";
  return t;
}

/* Comme lireChamps(), mais sans ecarter les lignes encore vides : on reagence ce qui

/* « vers » est la position FINALE voulue. On relit l'ecran avant de bouger, sinon une
   saisie en cours serait perdue par le redessin. */
function deplacerChamp(de,vers){
  var K=catParCle(catEdit); if(!K) return;

  if(de<0 || de>=l.length) return;
  vers=Math.max(0,Math.min(vers,l.length-1));

  var z=$("#listeChamps"); if(!z) return;
  z.innerHTML=fragChamps(K);

     deplacements au clavier obligerait a retrouver la ligne des yeux. */
  var p=z.querySelector('[data-chdrag="'+vers+'"]'); if(p) p.focus();

/* ================= module contacts ================= */
var filtreCt={q:"",org:"",niveau:""}, contactOuvert=null;
function contacts(){ return estTableau(D.contacts)?D.contacts:(D.contacts=[]) }
function organisations(){ return estTableau(D.organisations)?D.organisations:(D.organisations=[]) }
function contactPar(id){
  var l=contacts(),i;
  for(i=0;i<l.length;i++) if(l[i].id===id) return l[i];
  return null;
}
function orgPar(id){
  var l=organisations(),i;
  for(i=0;i<l.length;i++) if(l[i].id===id) return l[i];

}
/* « M PERONNET AISSAOUI » : la civilite se glisse dans le prenom a la saisie comme a l'import.
   On ne la retire que si un nom subsiste derriere, pour ne jamais vider un champ. */
function extraireCivilite(v){
  var t=String(v||"").trim();
  if(!t) return {civ:"",reste:""};
  var mots=t.split(/\s+/);
  var tete=sansAccent(mots[0]).toLowerCase().replace(/[.,]+$/,"");
  var civ="";
  CIV_FORMES.forEach(function(f){ if(!civ && f[0]===tete) civ=f[1] });
  if(!civ) return {civ:"",reste:t};
  var reste=mots.slice(1).join(" ").trim();
  if(!reste) return {civ:"",reste:t};        /* « M. » tout seul : c'est le nom, on n'y touche pas */
  return {civ:civ,reste:reste};
}
/* nomComplet sert aussi aux rapprochements : la civilite en est volontairement absente */
function nomAffiche(c){
  if(!c) return "";
  return ((c.civilite?c.civilite+" ":"")+nomComplet(c)).trim();
}
function nomComplet(c){
  if(!c) return "";
  var n=((c.prenom||"")+" "+(c.nom||"")).trim();
  return n || "Sans nom";
}
function nomOrg(id){ var o=orgPar(id); return o?o.nom:"" }
function libNiveau(v){
  var i;
  for(i=0;i<NIVEAUX_REL.length;i++) if(NIVEAUX_REL[i][0]===v) return NIVEAUX_REL[i][1];
  return "";
}
function pairesRelation(){
  return (D.parametres.types_relation||TYPES_REL).map(function(t){
    var p=String(t).split("|");
    return {lib:(p[0]||"").trim(), inv:(p[1]||p[0]||"").trim()};
  }).filter(function(x){ return x.lib });
}
function inverseRel(lib){
  var l=pairesRelation(),i;
  for(i=0;i<l.length;i++){
    if(l[i].lib===lib) return l[i].inv;
    if(l[i].inv===lib) return l[i].lib;
  }
  return lib;
}
/* liens directs : ceux poses sur la fiche, et ceux poses par d'autres vers elle */
function cibleLien(l){
  return (l.cible==="org") ? orgPar(l.vers) : contactPar(l.vers);
}
function nomCible(l){
  var e=cibleLien(l);
  if(!e) return "";
  return (l.cible==="org") ? e.nom : nomComplet(e);
}
function reseauDe(id){
  var out=[];
  var c=contactPar(id);
  if(!c) return out;
  (c.liens||[]).forEach(function(l){
    var v=cibleLien(l);
    if(v) out.push({contact:v,type:l.type,sens:"sortant",org:(l.cible==="org")});
  });
  contacts().forEach(function(x){
    if(x.id===id) return;
    (x.liens||[]).forEach(function(l){
      if(l.cible!=="org" && l.vers===id) out.push({contact:x,type:inverseRel(l.type),sens:"entrant",org:false});
    });
  });
  return out;
}
/* cote organisation : les contacts qui la designent, plus ceux qui y sont rattaches */
function liesAOrg(oid){
  var out=[],vus={};
  contacts().forEach(function(c){
    (c.liens||[]).forEach(function(l){
      if(l.cible==="org" && l.vers===oid && !vus[c.id]){
        vus[c.id]=1; out.push({c:c,type:inverseRel(l.type)});
      }
    });
  });
  return out;
}
function collegues(id){
  var c=contactPar(id);
  if(!c || !c.org_id) return [];
  var dejaVus={};
  reseauDe(id).forEach(function(r){ dejaVus[r.contact.id]=1 });
  return contacts().filter(function(x){
    return x.id!==id && x.org_id===c.org_id && !dejaVus[x.id] && !x.archive;
  });

/* historique reconstitue depuis les appels et les activites */
function historiqueDe(c){
  var h=[],n=[c.nom,c.prenom].join(" ").toLowerCase().trim();
  var tels=[telNorm(c.tel),telNorm(c.mobile)].filter(function(x){return x.length>=6});
  function correspond(nomChamp,telChamp){
    var t=telNorm(telChamp||"");
    if(t && tels.indexOf(t)!==-1) return true;
    var q=String(nomChamp||"").toLowerCase();
    if(!q || !c.nom) return false;
    return q.indexOf(String(c.nom).toLowerCase())!==-1;
  }
  (D.appels||[]).forEach(function(a){
    if(a.nature==="verif") return;
    if(correspond(a.qui,a.tel))
      h.push({date:a.date,heure:a.heure,quoi:"Appel",detail:a.objet||a.motif||"",lieu:a.commune||"",src:"appel",id:a.id});
  });
  D.chantiers.forEach(function(x){
    if(correspond(x.contact_nom,x.contact_tel))
      h.push({date:x.date,heure:x.heure||"",quoi:catDe(x).lib,detail:x.libelle||"",lieu:x.commune||"",src:"activite",id:x.id});
  });
  (c.rencontres||[]).forEach(function(r,i){
    h.push({date:r.date,heure:"",quoi:"Rencontre",detail:r.objet||"",lieu:r.lieu||"",src:"manuel",id:i});
  });
  return h.filter(function(x){return x.date}).sort(function(a,b){
    return (b.date+(b.heure||"")).localeCompare(a.date+(a.heure||""));
  });
}
function cleCandidat(nom,tel){
  var t=telNorm(tel||"");
  if(t.length>=6) return "t:"+t;                       /* le numero prime : un nom se saisit de dix facons */
  var n=sansAccent(nom||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  return n?("n:"+n):"";
}
function dejaFiche(nom,tel){
  var t=telNorm(tel||""),n=sansAccent(nom||"").toLowerCase().trim(),vu=false;
  contacts().forEach(function(c){
    if(vu) return;
    if(t && t.length>=6 && (telNorm(c.tel)===t || telNorm(c.mobile)===t)){ vu=true; return }
    if(n && c.nom && sansAccent(nomComplet(c)).toLowerCase().trim()===n){ vu=true; return }
    if(n && c.nom && n.indexOf(sansAccent(c.nom).toLowerCase())!==-1 && sansAccent(c.nom).length>3){ vu=true }
  });
  return vu;
}
function candidatsContacts(){
  var m={},ecartes=D.parametres.contacts_ecartes||[];
  function ajout(nom,tel,date,quoi,detail,lieu){
    nom=String(nom||"").trim(); tel=String(tel||"").trim();
    if(!nom && !tel) return;
    var cle=cleCandidat(nom,tel);
    if(!cle || ecartes.indexOf(cle)!==-1) return;
    if(dejaFiche(nom,tel)) return;
    if(!m[cle]) m[cle]={cle:cle,nom:nom,tel:tel,n:0,derniere:"",sources:{},exemples:[],lieu:lieu||""};
    var e=m[cle];
    e.n++;
    if(nom && (!e.nom || nom.length>e.nom.length)) e.nom=nom;   /* garder la forme la plus complete */
    if(tel && !e.tel) e.tel=tel;
    if(lieu && !e.lieu) e.lieu=lieu;
    if(date && date>e.derniere) e.derniere=date;
    e.sources[quoi]=(e.sources[quoi]||0)+1;
    if(detail && e.exemples.length<3) e.exemples.push(detail);
  }
  (D.appels||[]).forEach(function(x){
    if(x.nature==="verif") return;
    ajout(x.qui,x.tel,x.date,"appel",x.objet||x.motif||"",x.commune||"");
  });
  D.chantiers.forEach(function(x){
    ajout(x.contact_nom,x.contact_tel,x.date,catDe(x).lib,x.libelle||"",x.commune||"");
  });
  var l=[];
  Object.keys(m).forEach(function(k){ l.push(m[k]) });
  l.sort(function(a,b){ return b.n-a.n || (b.derniere||"").localeCompare(a.derniere||"") });
  return l;
}
/* « SARL Exemple TP » et « EXEMPLE TP » sont la meme entreprise : on compare
   sur une forme reduite, sans forme juridique, sans accent ni ponctuation. */
var FORMES_JUR=["sarl","sas","sasu","sa","eurl","sci","scp","eirl","ets","ste","snc","scop",
  "gie","asso","association","cooperative","earl","gaec","sem","spl","epic","cci","ccas"];
function cleOrg(nom){
  var t=sansAccent(nom).toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  if(!t) return "";
  var mots=t.split(" ").filter(function(m){ return m && FORMES_JUR.indexOf(m)===-1 });
  if(!mots.length) mots=t.split(" ");
  return mots.join(" ");
}
function orgConnue(nom){
  var k=cleOrg(nom); if(!k) return null;
  var t=null;
  organisations().forEach(function(o){ if(!t && cleOrg(o.nom)===k) t=o });
  return t;
}
function catTiersType(cle){
  var K=catParCle(cle);
  return K ? (K.tiers_type||deduireTiersType(K.tiers)) : "mixte";
}
function candidatsOrgs(){
  var m={},ecartees=D.parametres.orgs_ecartees||[];
  function ajout(nom,date,quoi,commune){
    nom=String(nom||"").trim();
    if(nom.length<2) return;
    var cle=cleOrg(nom);
    if(!cle || ecartees.indexOf(cle)!==-1) return;
    if(orgConnue(nom)) return;
    if(!m[cle]) m[cle]={cle:cle,nom:nom,n:0,derniere:"",sources:{},communes:{}};
    var e=m[cle];
    e.n++;
    if(nom.length>e.nom.length) e.nom=nom;      /* la forme la plus complete fait foi */
    if(date && date>e.derniere) e.derniere=date;
    e.sources[quoi]=(e.sources[quoi]||0)+1;
    if(commune) e.communes[commune]=(e.communes[commune]||0)+1;
  }
  (D.appels||[]).forEach(function(x){
    if(x.nature==="verif") return;
    ajout(x.entreprise,x.date,"appel",x.commune||"");   /* champ dedie : aucune ambiguite */
  });
  D.chantiers.forEach(function(x){
    var tt=catTiersType(x.categorie||"chantier");
    if(tt==="personne") return;                         /* la categorie dit que c'est quelqu'un */
    ajout(x.tiers,x.date,catDe(x).lib,x.commune||"");
  });
  var l=[];
  Object.keys(m).forEach(function(k){
    var e=m[k],mx=0;
    Object.keys(e.communes).forEach(function(c){ if(e.communes[c]>mx){ mx=e.communes[c]; e.commune=c } });
    l.push(e);
  });
  l.sort(function(a,b){ return b.n-a.n || (b.derniere||"").localeCompare(a.derniere||"") });
  return l;
}
/* une fois l'organisation creee, les contacts croises sur les memes lignes lui sont rattaches */
function orgDuContact(c){
  var noms={},res=null;
  function vu(n){ if(n) noms[cleOrg(n)]=1 }
  (D.appels||[]).forEach(function(a){
    if(a.nature==="verif") return;
    if(memeInterlocuteur(c,a.qui,a.tel)) vu(a.entreprise);
  });
  D.chantiers.forEach(function(x){
    if(catTiersType(x.categorie||"chantier")==="personne") return;
    if(memeInterlocuteur(c,x.contact_nom,x.contact_tel)) vu(x.tiers);
  });
  organisations().forEach(function(o){ if(!res && noms[cleOrg(o.nom)]) res=o });
  return res;
}
function memeInterlocuteur(c,nom,tel){
  var t=telNorm(tel||"");
  if(t.length>=6 && (telNorm(c.tel)===t || telNorm(c.mobile)===t)) return true;
  var n=sansAccent(nom||"").toLowerCase();

}
function rattacherOrgs(){

  contacts().forEach(function(c){

    if(o){ c.org_id=o.id; n++ }
  });

}
function civSeule(v){
  /* « M. » occupant tout le champ : extraireCivilite refuse de vider, ici c'est pourtant le bon geste */
  var t=sansAccent(v||"").trim().toLowerCase().replace(/[.,]+$/,""),civ="";
  CIV_FORMES.forEach(function(f){ if(!civ && f[0]===t) civ=f[1] });

function civilitesAExtraire(){

var grapheNiv=1;
function voisinsDe(id){
  var out=[],vus={};
  reseauDe(id).forEach(function(r){
    var k=(r.org?"o:":"c:")+r.contact.id;
    if(vus[k]) return;

function libNoeud(v){ return v.org ? (v.c.nom||"") : nomComplet(v.c) }
function tronqueLbl(v,n){

/* graphe egocentre : le contact au centre, ses relations autour. Le type de lien est ecrit
   sur l'arete et le sens porte par la fleche : jamais une information portee par la couleur seule. */
function fragGraphe(id){
  var c=contactPar(id); if(!c) return "";
  var d1=voisinsDe(id);
  if(!d1.length) return '<div class="note-aide" style="margin:0">Aucun lien saisi : le graphe appara\u00eetra d\u00e8s le premier.</div>';
  var LARG=600,HAUT=400,cx=LARG/2,cy=HAUT/2;
  var trop=d1.length>14, montres=trop?d1.slice(0,14):d1;
  var deux=(grapheNiv===2);
  var r1x=deux?145:215, r1y=deux?95:135;
  var noeuds=[],aretes=[],place={};
  place["c:"+id]={x:cx,y:cy};
  var depart=-Math.PI/2;
  montres.forEach(function(v,i){
    var ang=depart+(2*Math.PI*i/montres.length);
    var x=cx+r1x*Math.cos(ang), y=cy+r1y*Math.sin(ang);
    var k1=(v.org?"o:":"c:")+v.c.id;
    place[k1]={x:x,y:y};
    noeuds.push({id:v.c.id,cle:k1,x:x,y:y,lib:libNoeud(v),
      sous:v.org?(v.c.interne?"interne":"organisation"):nomOrg(v.c.org_id),
      estOrg:v.org,niv:1});
    aretes.push({de:"c:"+id,vers:k1,type:v.type,sens:v.sens});
  });
  var n2=0;
  if(deux) montres.forEach(function(v,i){
    if(v.org) return;                                   /* une organisation n'a pas de liens sortants */
    var ang=depart+(2*Math.PI*i/montres.length);
    var sec=voisinsDe(v.c.id).filter(function(w){
      return w.c.id!==id && !place[(w.org?"o:":"c:")+w.c.id];
    });
    sec.slice(0,3).forEach(function(w,j){
      var ec=(j-(Math.min(sec.length,3)-1)/2)*0.30;
      var a2=ang+ec;
      var x=cx+258*Math.cos(a2), y=cy+162*Math.sin(a2);
      var k2=(w.org?"o:":"c:")+w.c.id;
      place[k2]={x:x,y:y}; n2++;
      noeuds.push({id:w.c.id,cle:k2,x:x,y:y,lib:libNoeud(w),
        sous:w.org?(w.c.interne?"interne":"organisation"):nomOrg(w.c.org_id),
        estOrg:w.org,niv:2});
      aretes.push({de:"c:"+v.c.id,vers:k2,type:w.type,sens:w.sens,faible:true});
    });
  });
  function fleche(A,B,rA,rB){
    var dx=B.x-A.x,dy=B.y-A.y,L=Math.sqrt(dx*dx+dy*dy)||1;
    return {x1:A.x+dx/L*rA, y1:A.y+dy/L*rA, x2:B.x-dx/L*rB, y2:B.y-dy/L*rB};
  }
  var svg='<svg viewBox="0 0 '+LARG+' '+HAUT+'" class="grf" role="img" '
    +'aria-label="R\u00e9seau de '+esc(nomComplet(c))+'">'
    +'<defs><marker id="grf-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">'
    +'<path d="M0 0 L8 4 L0 8 z" fill="currentColor"/></marker></defs>';
  aretes.forEach(function(e){
    var A=place[e.de],B=place[e.vers];
    if(!A||!B) return;
    var rA=(e.de==="c:"+id?13:8), rB=10;
    var ent=(e.sens==="entrant");
    var g=fleche(ent?B:A, ent?A:B, ent?rB:rA, ent?rA:rB);
    svg+='<line class="grf-a'+(e.faible?" f":"")+'" x1="'+g.x1.toFixed(1)+'" y1="'+g.y1.toFixed(1)
      +'" x2="'+g.x2.toFixed(1)+'" y2="'+g.y2.toFixed(1)+'" marker-end="url(#grf-f)"/>';
    if(e.type && !e.faible){
      var mx=A.x+(B.x-A.x)*0.52, my=A.y+(B.y-A.y)*0.52;
      svg+='<text class="grf-t" x="'+mx.toFixed(1)+'" y="'+my.toFixed(1)+'">'+esc(tronqueLbl(e.type,18))+'</text>';
    }
  });
  svg+='<circle class="grf-n ego" cx="'+cx+'" cy="'+cy+'" r="13"/>'
    +'<text class="grf-l ego" x="'+cx+'" y="'+(cy-22)+'">'+esc(tronqueLbl(nomComplet(c),24))+'</text>';
  noeuds.forEach(function(n){
    /* l'etiquette part vers l'exterieur du cercle : elle ne croise jamais l'arete venue du centre */
    var dy=(n.y<cy-6) ? -16 : 22;
    /* une organisation est un carre, une personne un rond : la forme porte l'information,
       jamais la couleur seule. */
    var forme = n.estOrg
      ? '<rect class="grf-n org'+(n.niv===2?" d2":"")+'" x="'+(n.x-8).toFixed(1)+'" y="'+(n.y-8).toFixed(1)+'" width="16" height="16"/>'
      : '<circle class="grf-n'+(n.niv===2?" d2":"")+'" cx="'+n.x.toFixed(1)+'" cy="'+n.y.toFixed(1)+'" r="8"/>';
    svg+='<g class="grf-g" data-'+(n.estOrg?"org-go":"contact-go")+'="'+esc(n.id)+'">'
      +'<title>'+esc(n.lib+(n.sous?" \u2014 "+n.sous:""))+'</title>'+forme
      +'<text class="grf-l'+(n.niv===2?" d2":"")+'" x="'+n.x.toFixed(1)+'" y="'+(n.y+dy).toFixed(1)+'">'
      +esc(tronqueLbl(n.lib,20))+'</text></g>';
  });
  svg+='</svg>';
  return '<div class="grf-box">'+svg+'</div>'
    +'<div class="ligne" style="margin-top:4px">'
      +'<button class="b mini'+(grapheNiv===1?"":" creux")+'" data-act="grf-1">Relations directes</button>'
      +'<button class="b mini'+(grapheNiv===2?"":" creux")+'" data-act="grf-2">Jusqu\u2019au 2e cercle</button>'
      +'<span class="note-aide" style="margin:0 0 0 auto">'
      +'\u25cf personne \u00b7 \u25a0 organisation \u2014 '
      +montres.length+' direct'+(montres.length>1?"s":"")+(deux?" \u00b7 "+n2+" au 2e cercle":"")
      +(trop?" \u00b7 "+(d1.length-14)+" non repr\u00e9sent\u00e9(s)":"")+'</span>'
    +'</div>';
}

function trouverContact(nom,prenom,tel,mob){

    if(ex) return;
    var memeTel=(telNorm(tel)&&telNorm(tel)===telNorm(c.tel))||(telNorm(mob)&&telNorm(mob)===telNorm(c.mobile));
    var memeNom=String(c.nom).toLowerCase()===String(nom).toLowerCase()
             && String(c.prenom).toLowerCase()===String(prenom).toLowerCase();
    if(memeTel||memeNom) ex=c;
  });
  return ex;
}
function importerContactsCSV(txt){
  var lignes=lireCSV(String(txt));
  if(lignes.length<2){ toast("Fichier vide ou illisible",true); return }
  var ent=lignes[0].map(function(x){return String(x).trim().toLowerCase()});
  function col(nom){ return ent.indexOf(nom.toLowerCase()) }
  var iNom=col("Nom");
  if(iNom<0){ toast("Colonne « Nom » introuvable",true); return }
  var ajout=0,maj=0,orgN=0;
  for(var i=1;i<lignes.length;i++){
    var lg=lignes[i];
    var val=function(n){ var k=col(n); return k>=0 ? String(lg[k]||"").trim() : "" };
    var nom=val("Nom");
    if(!nom) continue;
    var prenom=val("Prénom"), tel=val("Téléphone"), mob=val("Mobile");
    var ex=trouverContact(nom,prenom,tel,mob);
    var org=val("Organisation"), oid="";
    if(org){
      var o=null;
      organisations().forEach(function(x){ if(!o && x.nom.toLowerCase()===org.toLowerCase()) o=x });
      if(!o){
        o=normaliserOrg({id:uid(),nom:org,interne:/^(oui|o|x|1|true)$/i.test(val("Interne"))});
        organisations().push(o); orgN++;
      }
      oid=o.id;
    }
    var niv=val("Nature").toLowerCase(), ncle="inconnu";
    NIVEAUX_REL.forEach(function(n){ if(n[1].toLowerCase()===niv||n[0]===niv) ncle=n[0] });
    var src={nom:nom,prenom:prenom,fonction:val("Fonction"),org_id:oid,
      tel:tel,mobile:mob,mail:val("Courriel"),fiche:val("Fiche interne"),
      relation:val("Relation"),niveau:ncle,
      premiere_date:val("Première rencontre"),premiere_lieu:val("Lieu"),notes:val("Notes")};
    if(ex){
      Object.keys(src).forEach(function(k){ if(src[k]) ex[k]=src[k] });
      maj++;
    }else{
      src.id=uid(); src.cree_le=new Date().toISOString();
      contacts().push(normaliserContact(src)); ajout++;
    }
  }
  /* seconde passe : les relations se resolvent une fois tous les contacts crees */
  var rel=0;
  for(i=1;i<lignes.length;i++){
    var lg2=lignes[i];
    var v2=function(n){ var k=col(n); return k>=0 ? String(lg2[k]||"").trim() : "" };
    var brut=v2("Relations");
    if(!brut) continue;
    var src2=trouverContact(v2("Nom"),v2("Prénom"),v2("Téléphone"),v2("Mobile"));
    if(!src2) continue;
    brut.split("|").forEach(function(bout){
      var pp=bout.split(">");
      if(pp.length<2) return;
      var type=pp[0].trim(), cible=pp[1].trim();
      var ct=null;
      contacts().forEach(function(x){ if(!ct && nomComplet(x).toLowerCase()===cible.toLowerCase()) ct=x });
      if(!ct || ct.id===src2.id) return;
      var deja=false;
      (src2.liens||[]).forEach(function(l){ if(l.vers===ct.id && l.type===type) deja=true });
      if(deja) return;
      (src2.liens||(src2.liens=[])).push({vers:ct.id,type:type});
      rel++;
    });
  }
  modifie(); rendre();
  toast(ajout+" ajouté(s) · "+maj+" mis à jour"
    +(orgN?" · "+orgN+" organisation(s)":"")+(rel?" · "+rel+" relation(s)":""));
}
function lireCSV(txt){
  var out=[],l=[],c="",q=false,i;
  txt=txt.replace(/^\uFEFF/,"");
  for(i=0;i<txt.length;i++){
    var k=txt[i];
    if(q){
      if(k==='"'){ if(txt[i+1]==='"'){ c+='"'; i++ } else q=false }
      else c+=k;
    }else{
      if(k==='"') q=true;
      else if(k===";"||k===","){ l.push(c); c="" }
      else if(k==="\n"){ l.push(c); out.push(l); l=[]; c="" }
      else if(k!=="\r") c+=k;
    }
  }
  if(c||l.length){ l.push(c); out.push(l) }
  return out.filter(function(x){ return x.join("").trim() });
}

var rapDeb="", rapFin="", rapTexte=false;
function dansInt(d,a,b){ return !!d && d>=a && d<=b }
function joursOuvresEntre(a,b){
  var n=0,d=pIso(a),f=pIso(b),g=0;
  while(d<=f && g++<800){
    if(!motifNonOuvre(iso(d))) n++;
    d.setDate(d.getDate()+1);
  }
  return n;
}
function moisIso(dec){
  var d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+(dec||0));
  var deb=iso(d);
  d.setMonth(d.getMonth()+1); d.setDate(0);
  return [deb,iso(d)];
}
function compterPar(l,cle){

    var k=cle(x);
    if(!k) return;
    if(m[k]===undefined){ m[k]=0; o.push(k) }

  return o.map(function(k){ return [k,m[k]] }).sort(function(a,b){ return b[1]-a[1] });
}

function rapportPeriode(a,b,avecTexte){
  var t="";
  var acts=D.chantiers.filter(function(c){ return dansInt(c.date,a,b) });
  var notes=(D.notes||[]).filter(function(n){ return dansInt(n.date,a,b) });
  var apps=(D.appels||[]).filter(function(x){ return dansInt(x.date,a,b) && x.nature!=="verif" });
  var verifs=(D.appels||[]).filter(function(x){ return dansInt(x.date,a,b) && x.nature==="verif" });
  var dts=(D.compteur||[]).filter(function(c){ return dansInt(c.date,a,b) });
  var vigs=(D.vigilances||[]).filter(function(v){ return dansInt(v.date,a,b) });

  t+=String(D.parametres.nom_app||NOM_DEFAUT).toUpperCase()+" — RAPPORT D'ACTIVITÉ\n";
  t+="Période du "+libDate(a)+" au "+libDate(b)+"\n";
  t+="Édité le "+libDate(auj())+"\n"+trait("=")+"\n\n";

  var ouvres=joursOuvresEntre(a,b);
  var abs=(D.parametres.absences||[]).filter(function(x){ return dansInt(x,a,b) }).length;
  t+="PLAN DE CHARGE\n";
  t+="- Jours ouvrés sur la période : "+ouvres+"\n";
  if(abs) t+="- Jours d'absence déclarés : "+abs+"\n";
  t+="- Entrées de planning traitées : "+acts.length+"\n";
  var clos=acts.filter(estClos).length;
  t+="- Dont menées à terme : "+clos+(acts.length?"  ("+Math.round(clos*100/acts.length)+" %)":"")+"\n";
  var sansDate=D.chantiers.filter(function(c){ return !c.date && !estClos(c) }).length;
  if(sansDate) t+="- Portefeuille non daté en cours (hors période) : "+sansDate+"\n";

  t+="\nRÉPARTITION PAR NATURE D'ACTIVITÉ\n";
  var parCat=compterPar(acts,function(c){ var K=catParCle(c.categorie||"chantier"); return K?K.lib:"" });
  t+=parCat.length?ligneRep(parCat,acts.length):"  - aucune activité sur la période";

  var parSt=compterPar(acts,function(c){ return libStatut(c.statut) });
  if(parSt.length) t+="\n\nÉTAT D'AVANCEMENT\n"+ligneRep(parSt,acts.length);

  var parType=compterPar(acts,function(c){ return c.type });
  if(parType.length) t+="\n\nTYPES D'INTERVENTION\n"+ligneRep(parType,acts.length);

  t+="\n\nRÉPARTITION DU TEMPS\n";
  var tot=0,lignes=[];
  (D.parametres.rubriques||[]).forEach(function(r){
    var m=0;
    notes.forEach(function(n){ if(n.rubrique_id===r.id) m+=+n.duree||0 });
    if(r.auto==="compteur") dts.forEach(function(c){ m+=minutesSession(c) });
    if(r.auto==="appels") apps.forEach(function(x){ m+=+x.duree||0 });
    if(m>0){ lignes.push([r.nom,m]); tot+=m }
  });
  var mAct=0;
  acts.forEach(function(c){
    if(!estClos(c)) return;
    var d=+c.duree||0,nn=0;
    notes.forEach(function(n){ if(n.chantier_id===c.id) nn+=+n.duree||0 });
    mAct+=Math.max(d,nn);
  });
  if(mAct>0){ lignes.push(["Temps imputé sur les activités",mAct]); tot+=mAct }
  if(lignes.length){
    lignes.sort(function(x,y){ return y[1]-x[1] });
    t+=lignes.map(function(x){
      return "  - "+x[0]+" : "+dureeLisible(x[1])+(tot?"  ("+Math.round(x[1]*100/tot)+" %)":"");
    }).join("\n")+"\n  Total imputé : "+dureeLisible(tot);
  }else t+="  - aucun temps imputé sur la période";

  if(D.parametres.mod_compteur!==false && dts.length){
    var tr=0,se=0;
    dts.forEach(function(c){ tr+=+c.traites||0; se+=minutesSession(c) });
    t+="\n\n"+String(D.parametres.titre_compteur||"Compteur de traitement").toUpperCase()+"\n";
    t+="- Jours de traitement : "+dts.length+"\n- Dossiers traités : "+tr+"\n";
    t+="- Temps chronométré : "+dureeLisible(se)+"\n";
    if(se>0) t+="- Cadence moyenne : "+String(Math.round(tr/(se/60)*10)/10).replace(".",",")+" dossiers/h\n";
  }

  if(D.parametres.mod_permanence!==false && (apps.length||verifs.length)){
    var jrs={},dur=0;
    apps.forEach(function(x){ jrs[x.date]=1; dur+=+x.duree||0 });
    t+="\n\nASSISTANCE TÉLÉPHONIQUE\n";
    t+="- Jours avec appels : "+Object.keys(jrs).length+"\n- Appels traités : "+apps.length+"\n";

  }

  if(vigs.length){
    t+="\n\nPOINTS DE VIGILANCE\n- Déclarés sur la période : "+vigs.length+"\n";
    t+=ligneRep(compterPar(vigs,function(v){ return libNiveauVig(v.niveau) }),vigs.length)+"\n";
    t+="- Levés : "+vigs.filter(function(v){return v.clos}).length+"\n";
  }

  var suites=notes.filter(function(n){ return n.suite });
  if(suites.length){
    t+="\n\nACTIONS DE SUIVI\n- Tâches ouvertes sur la période : "+suites.length+"\n";
    t+="- Dont soldées à ce jour : "+suites.filter(function(n){return n.suite.fait}).length+"\n";

  var parCom=compterPar(acts,function(c){ return c.commune });
  if(parCom.length){
    t+="\n\nTERRITOIRE COUVERT\n- Communes concernées : "+parCom.length+"\n";
    t+=ligneRep(parCom.slice(0,15),acts.length);

  acts.forEach(function(c){ if(c.tiers) orgs[String(c.tiers).toLowerCase()]=1 });
  var no=Object.keys(orgs).length;
  if(no) t+="- Interlocuteurs distincts rencontrés : "+no+"  (non nommés)\n";

  if(avecTexte){
    t+="\n\n"+trait("-")+"\nDÉTAIL EN TEXTE LIBRE — À RELIRE AVANT TOUTE DIFFUSION\n";
    t+="Cette section reprend vos saisies telles quelles : elle peut contenir des\n";
    t+="noms de personnes, d'entreprises ou des références de dossier.\n"+trait("-")+"\n\n";
    var fin=acts.filter(estClos);
    t+="ACTIVITÉS MENÉES À TERME\n";
    t+=fin.length? fin.map(function(c){
        return "- "+libCourt(c.date)+"  "+(c.libelle||"")+(c.commune?" ("+c.commune+")":"");
      }).join("\n") : "  - aucune";
    t+="\n\nNOTES\n";
    t+=notes.length? notes.slice().sort(function(x,y){return (x.date+x.heure).localeCompare(y.date+y.heure)})
        .map(function(n){ return "- "+libCourt(n.date)+"  "+(n.type?"["+n.type+"] ":"")+(n.contenu||"(tâche)") })
        .join("\n") : "  - aucune";
    t+="\n";
  }else{
    t+="\n\nCe rapport ne contient aucune donnée nominative, aucune référence de\ndossier et aucun identifiant de point de livraison.\n";
  }

}
function libJour(d){
