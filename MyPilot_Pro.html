function reparerCategories(){
  var jeux=categories().map(function(K){
    var m={};
    jeuStatuts(K.statuts).forEach(function(x){ m[x[0]]=1 });
    return {cle:K.cle,lib:K.plur||K.lib,m:m};
  });
  /* regroupement par (categorie portee, statut) : une meme erreur touche toujours un lot de fiches */
  var grp={},ordre=[];
  D.chantiers.forEach(function(c){
    var cle=c.categorie||"chantier",src=null;
    jeux.forEach(function(j){ if(j.cle===cle) src=j });
    if(!src || !c.statut || src.m[c.statut]) return;
    var k=cle+"\u0001"+c.statut;
    if(!grp[k]){
      var cib=jeux.filter(function(j){ return j.cle!==cle && j.m[c.statut] });
      grp[k]={decle:cle,de:src.lib,statut:c.statut,cib:cib,fiches:[]};
      ordre.push(k);
    }
    grp[k].fiches.push(c);
  });

  ordre.sort(function(a,b){ return grp[b].fiches.length-grp[a].fiches.length });
  var sur=0,amb=0;
  var lignes=ordre.map(function(k,i){
    var g=grp[k],pre=g.cib.length===1?g.cib[0].cle:"";
    if(pre) sur++; else amb++;
    var opts='<option value="">\u2014 ne pas toucher \u2014</option>'
      +jeux.filter(function(j){ return j.cle!==g.decle }).map(function(j){
          return '<option value="'+esc(j.cle)+'"'+(j.cle===pre?" selected":"")+'>'+esc(j.lib)+'</option>';
        }).join("");
    return '<div class="rcat-l"><span class="rcat-d">'+esc(g.de)+' \u00b7 <b>'+esc(libStatut(g.statut))+'</b>'
      +' <em>'+g.fiches.length+' fiche'+(g.fiches.length>1?"s":"")+'</em></span>'
      +'<span class="rcat-f">\u2192</span>'
      +'<select data-rep="'+i+'">'+opts+'</select></div>';
  }).join("");
  var aide = sur && !amb
      ? "Le statut de chaque lot n'appartient qu'\u00e0 une seule autre cat\u00e9gorie : la destination est certaine."
      : (sur
        ? "Les lots dont le statut ne d\u00e9signe qu'une seule cat\u00e9gorie sont d\u00e9j\u00e0 renseign\u00e9s. Pour les autres, le statut existe dans plusieurs cat\u00e9gories (ou dans aucune) : c'est \u00e0 vous de trancher."
        : "Aucune destination ne peut \u00eatre d\u00e9duite : ces statuts existent dans plusieurs cat\u00e9gories, ou dans aucune. Choisissez la destination de chaque lot.");
  var corps='<div class="rcat">'+lignes+'</div>'
    +'<div class="note-aide">'+aide+' Les lots laiss\u00e9s sur \u00ab ne pas toucher \u00bb restent en l\u2019\u00e9tat. '
    +'Seule la cat\u00e9gorie est modifi\u00e9e : ni le statut, ni le contenu des fiches.</div>';
  ouvrirModale("Correction des cat\u00e9gories",corps,[
    {txt:"Annuler",fn:fermerModale},
    {txt:"Appliquer",classe:"",droite:true,fn:function(){
      var sel=$("#modCorps").querySelectorAll("select[data-rep]"),n=0,i;
      for(i=0;i<sel.length;i++){
        var g=grp[ordre[+sel[i].getAttribute("data-rep")]],v=sel[i].value;
        if(!v || v===g.decle) continue;
        g.fiches.forEach(function(c){ c.categorie=v; n++ });
      }
      fermerModale();
      if(!n){ toast("Aucune modification",true); return; }
      modifie(); rendre();
      toast(n+" fiche(s) reclass\u00e9e(s)");
    }}
  ]);
}
function statutAdmis(K,v){

function statutsConnus(cle){

function incoherences(){
  var out={},n=0;
  var cache={};
  D.chantiers.forEach(function(c){
    var cle=c.categorie||"chantier";
    if(cache[cle]===undefined) cache[cle]=statutsConnus(cle);
    var m=cache[cle];
    if(!m || !c.statut) return;
    if(m[c.statut]) return;
    if(!out[cle]) out[cle]={cat:cle,statuts:{},total:0};
    out[cle].statuts[c.statut]=(out[cle].statuts[c.statut]||0)+1;
    out[cle].total++; n++;

/* Un dossier n'a pas toujours de date de planification : les dossiers importes n'en ont

   planification effaçait du rapport l'essentiel du portefeuille suivi. On retient donc toute

function datesActivite(c,notesPar){
  var l=[];
  if(dateValide(c.date)) l.push(c.date);
  if(dateValide(c.date_action)) l.push(c.date_action);
  /* archiver un dossier est un acte de gestion, date : un dossier solde en septembre
     sort du reporting, donc sa derniere action reste anterieure. Sans cela il echappe
     a la periode ou il a justement ete clos. */
  if(dateValide(c.archive)) l.push(c.archive);
  (notesPar[c.id]||[]).forEach(function(d){ l.push(d) });
  return l;
}
function notesParChantier(){
  var m={};
  (D.notes||[]).forEach(function(n){
    if(!n.chantier_id || !dateValide(n.date)) return;
    (m[n.chantier_id]||(m[n.chantier_id]=[])).push(n.date);
  });
  return m;
}
function estActePrevention(c){
  var v=[c.type,c.etat_affaire].join(" \u00b7 ");
  var l=D.parametres.actes_prevention||[];
  var ok=false;
  if(l.length){
    l.forEach(function(x){ if(x && v.indexOf(x)>=0) ok=true });
    return ok;
  }
  var t=sansAccent(v).toLowerCase();
  MOTS_PREVENTION.forEach(function(m){ if(t.indexOf(sansAccent(m).toLowerCase())>=0) ok=true });
  return ok;
}
function statsPeriode(a,b){
  var o={},npc=notesParChantier();
  o.dateRef={};                       /* date retenue pour situer l'activite dans le temps */
  o.acts=D.chantiers.filter(function(c){
    var dd=datesActivite(c,npc).filter(function(d){ return dansInt(d,a,b) });
    if(!dd.length) return false;
    dd.sort();
    o.dateRef[c.id]=dd[dd.length-1];  /* la plus recente : c'est la trace la plus parlante */
    return true;
  });
  o.parDate=0; o.parAction=0; o.parNote=0; o.parArch=0;
  o.acts.forEach(function(c){
    if(dansInt(c.date,a,b)) o.parDate++;

    else if(dansInt(c.date_action,a,b)) o.parAction++;

  });

  o.apps=(D.appels||[]).filter(function(x){ return dansInt(x.date,a,b) && x.nature!=="verif" });
  o.verifs=(D.appels||[]).filter(function(x){ return dansInt(x.date,a,b) && x.nature==="verif" });

  o.vigs=(D.vigilances||[]).filter(function(v){ return dansInt(v.date,a,b) });
  o.ouvres=joursOuvresEntre(a,b);
  o.abs=(D.parametres.absences||[]).filter(function(x){ return dansInt(x,a,b) }).length;
  o.clos=o.acts.filter(estAbouti).length;
  o.closStatut=o.acts.filter(estClos).length;
  o.closArch=o.acts.filter(function(c){ return !estClos(c) && c.archive_issue==="traite" }).length;
  o.sortis=o.acts.filter(function(c){ return c.archive_issue==="sorti" }).length;
  o.nonQualif=o.acts.filter(function(c){ return c.archive && !c.archive_issue }).length;
  o.tauxClos=o.acts.length?Math.round(o.clos*100/o.acts.length):0;
  o.parCat=compterPar(o.acts,function(c){ var K=catParCle(c.categorie||"chantier"); return K?K.lib:"" });
  o.parSt=compterPar(o.acts,function(c){ return libStatut(c.statut) });
  /* l'avancement n'a de sens qu'a l'interieur d'une categorie : les jeux de statuts different */
  o.avanc=[];
  categories().forEach(function(K){

    /* ce que la categorie porte en dehors de la periode : sans ce reperage, un compte
       faible se lit comme une anomalie alors qu'il ne dit que la borne de dates. */

    if(!sl.length){

      return;
    }
    o.avanc.push({lib:K.plur||K.lib,n:sl.length,hors:tot-sl.length,clos:sl.filter(estAbouti).length,

  o.videsPeriode=o.avanc.filter(function(x){ return x.hors>0 })

  o.parMotif=compterPar(o.apps,function(x){ return x.motif });
  o.parTn=compterPar(o.notes,function(n){ return n.type });
  o.parCom=compterPar(o.acts,function(c){ return c.commune });
  /* prevention : ce que le poste produit, par opposition au volume traite */
  var prevActs=o.acts.filter(estActePrevention);
  var convs=[],anims=[];

    if(!K) return;
    if(K.statuts==="statuts_rdv" && estAbouti(c)){
      if(K.champs && K.champs.some && K.champs.some(function(f){ return f.cle==="participants" })) anims.push(c);
      else convs.push(c);
    }
  });
  var ents={},pub=0;
  convs.concat(anims).forEach(function(c){ if(c.tiers) ents[cleOrg(c.tiers)]=1 });
  anims.forEach(function(c){ pub+=(+c.participants||0) });
  o.prev={
    actes:compterPar(prevActs,function(c){ return c.type||c.etat_affaire||"Non typé" }),
    total:prevActs.length,
    conv:convs.length, anim:anims.length,
    ents:Object.keys(ents).length, publics:pub,
    regle:(D.parametres.actes_prevention||[]).length?"liste":"auto"
  };
  o.temps=[]; o.totTemps=0;
  (D.parametres.rubriques||[]).forEach(function(r){
    var m=0;
    o.notes.forEach(function(n){ if(n.rubrique_id===r.id) m+=+n.duree||0 });
    if(r.auto==="compteur") o.dts.forEach(function(c){ m+=minutesSession(c) });
    if(r.auto==="appels") o.apps.forEach(function(x){ m+=+x.duree||0 });
    if(m>0){ o.temps.push([r.nom,m]); o.totTemps+=m }
  });

  o.acts.forEach(function(c){

    mAct+=Math.max(d,nn);
  });
  if(mAct>0){ o.temps.push(["Activités du planning",mAct]); o.totTemps+=mAct }
  o.temps.sort(function(x,y){ return y[1]-x[1] });
  var tr=0,se=0,mx=0;
  o.dts.forEach(function(c){ tr+=+c.traites||0; se+=minutesSession(c); if((+c.traites||0)>mx) mx=+c.traites||0 });
  o.dt={jours:o.dts.length,traites:tr,temps:se,max:mx,cadence:se>0?Math.round(tr/(se/60)*10)/10:0};
  var jp={},dur=0;

  o.perm={jours:Object.keys(jp).length,appels:o.apps.length,temps:dur,
    moy:o.apps.length?Math.round(dur/o.apps.length):0,verifs:o.verifs.length};
  o.vig={};
  ["critique","attention","info"].forEach(function(n){
    o.vig[n]={total:o.vigs.filter(function(v){return (v.niveau||"info")===n}).length,
              leves:o.vigs.filter(function(v){return (v.niveau||"info")===n && v.clos}).length};
  });
  var su=o.notes.filter(function(n){ return n.suite });
  o.suites={total:su.length,soldees:su.filter(function(n){return n.suite.fait}).length,
    echues:su.filter(function(n){ return !n.suite.fait && n.suite.echeance && n.suite.echeance<auj() }).length};
  var og={};
  o.acts.forEach(function(c){ if(c.tiers) og[String(c.tiers).toLowerCase()]=1 });

      f:o.acts.filter(function(c){ return estAbouti(c) && String(o.dateRef[c.id]||"").slice(0,7)===pre }).length});
    d1.setMonth(d1.getMonth()+1);
  }

function periodeAvant(a,b){
  var j=Math.round((pIso(b)-pIso(a))/86400000)+1;
  var f=pIso(a); f.setDate(f.getDate()-1);
  var d=pIso(a); d.setDate(d.getDate()-j);
  return [iso(d),iso(f)];
}
function ecart(n,p){

/* ============ charge a venir ============
   Ce que le calendrier porte deja : rendez-vous dates et taches a echeance. On ne
   devine rien, on ne lisse rien — la ou il n'y a rien, le creux doit se voir. */
function chargeAVenir(jours,semaines){
  var h=auj(), parJour={}, hors={retard:0, sansEch:0}, taches=0, rdv=0, loin=0;
  /* l'horizon dessine borne aussi les compteurs : un indicateur qui annonce une duree
     et compte au-dela ment sur la seule chose qu'on lui demande. */
  var fin=pIso(h); fin.setDate(fin.getDate()+jours+semaines*7);
  var limite=iso(fin);
  function case_(d){ return parJour[d]||(parJour[d]={rdv:0,tache:0,min:0}) }
  (D.chantiers||[]).forEach(function(c){
    if(estArchive(c)||estClos(c)||estAnnule(c)) return;
    /* chaque evenement a venir compte pour lui-meme : un dossier qui revient trois
       fois dans le mois, c'est trois creneaux a tenir. */
    evenements(c).forEach(function(e){
      if(!e.date || e.date<h || !evtVivant(e) || e.statut==="realise") return;
      if(e.date>=limite){ loin++; return }
      var k=case_(e.date); k.rdv++; k.min+=+e.duree||0; rdv++;
    });
  });
  (D.notes||[]).forEach(function(n){
    var s=n.suite; if(!s || !s.texte || s.fait) return;
    if(n.chantier_id && estArchive(chantierPar(n.chantier_id))) return;
    if(!s.echeance){ hors.sansEch++; return }
    if(s.echeance<h){ hors.retard++; return }
    if(s.echeance>=limite){ loin++; return }
    case_(s.echeance).tache++; taches++;
  });
  /* la trame des jours : tous, y compris vides — c'est le creux qui informe */
  var l=[],d=pIso(h),i;
  for(i=0;i<jours;i++){
    var s=iso(d), k=parJour[s]||{rdv:0,tache:0,min:0};
    l.push({d:s,rdv:k.rdv,tache:k.tache,min:k.min,chome:motifNonOuvre(s)});
    d.setDate(d.getDate()+1);
  }
  /* puis les semaines, pour voir plus loin sans allonger la page */
  var sem=[],ds=pIso(h); ds.setDate(ds.getDate()+jours);
  for(i=0;i<semaines;i++){
    var r=0,t=0,j,deb=iso(ds);
    for(j=0;j<7;j++){ var ss=iso(ds); var kk=parJour[ss];
      if(kk){ r+=kk.rdv; t+=kk.tache } ds.setDate(ds.getDate()+1) }
    sem.push({deb:deb,rdv:r,tache:t});
  }
  return {jours:l,semaines:sem,rdv:rdv,taches:taches,hors:hors,loin:loin,
    horizon:limite,nonPilotes:nonPilotes(false).length};
}

  h+=rpStatutsDetail(o);
  h+='<div class="rp-duo">'

      +'<tr><td>Information</td><td class="n">'+o.vig.info.total+'</td><td class="n">'+o.vig.info.leves+'</td></tr></table></div>'
    +'<div><h2>Actions de suivi</h2><table class="rp-tab">'

  h+=rpPrevention(o);
  h+='<h2>Faits marquants</h2><p class="rp-i">Ce que les chiffres ne disent pas.</p>'

  h+='<div style="break-inside:avoid;page-break-inside:avoid">';

  /* ---- page 4 : la charge a venir, qui ne depend pas de la periode du rapport ---- */
  var ch=chargeAVenir(21,8);

    +'<div class="rp-cle"><div class="v">'+ch.rdv+'</div><div class="l">rendez-vous datés</div></div>'

  h+='<h2>Jour par jour — trois semaines</h2>';

  if(ch.semaines.some(function(x){ return x.rdv||x.tache })){
    h+='<h2>Semaines suivantes</h2>'
      +'<p class="rp-i">Les huit semaines qui suivent, regroupées. Même lecture.</p>'
      +rpChargeSem(ch.semaines);

  h+='<h2>Lecture</h2><ul class="rp-l">';
  h+='<li>Journée la plus chargée : <b>'+esc(libJour(piresJ.d))+'</b> — '
    +(piresJ.rdv+piresJ.tache)+' élément(s)'+(piresJ.rdv?', dont '+piresJ.rdv+' rendez-vous':"")+'.</li>';
  h+='<li>'+ouvresVides+' jour(s) ouvré(s) sur '+ouvres+' sans rien de posé.</li>';
  if(minTot) h+='<li>'+dureeLisible(minTot)+' de rendez-vous déjà planifiés sur la période affichée.</li>';
  if(ch.hors.retard) h+='<li><b>'+ch.hors.retard+' tâche(s) dont l\'échéance est dépassée</b> : '
    +'elles ne figurent sur aucune barre et n\'attendent qu\'une décision.</li>';

  if(ch.loin) h+='<li>'+ch.loin+' élément(s) au-delà de l\'horizon affiché.</li>';
  h+='<li>'+ch.nonPilotes+' dossier(s) <b>non pilotés</b> : ni tâche en attente, ni événement à venir. '
    +'Ils ne pèsent sur aucune journée, et c\'est précisément le risque.</li>';
  h+='</ul>';
  /* « Objectifs et besoins » vivait en fin de page « Detail », deja pleine : les deux
     blocs de texte libre y debordaient des qu'on ecrivait vraiment dedans. Il rejoint la
     page dont il parle — ce qu'il faut pour tenir ce qui vient — ou il a de la place. */
  h+='<h2>Objectifs et besoins</h2>'
    +'<p class="rp-i">Ce que vous demandez pour tenir ce qui vient.</p>'
    +'<div class="rp-saisie'+(P.rap_objectifs?"":" vide")+'">'
    +esc(P.rap_objectifs||"Section à renseigner dans l\u2019onglet Options.")+'</div>';
  h+='<div class="rp-mention">Cette page décrit la charge déjà engagée au '+esc(libDate(auj()))
    +'. Elle ne préjuge ni des urgences à venir, ni du temps réellement nécessaire à chaque '
    +'élément.</div></div>';

  return h;
}
function imprimerRapport(){

  setTimeout(function(){
    window.print();
    setTimeout(function(){ e.innerHTML="" },1200);
  },60);
}
function ouvrirRapport(){

    +'padding:10px;border:1px solid var(--trait);border-radius:2px">'+esc(txt)+'</textarea>'

    [{txt:"Copier",classe:"creux",fn:function(){

function rendre(){
  if(!rendre.__veille){ rendre.__veille=true; veillerChampsFr() }
  var m=$("#vue");
  if(!fichierCharge && vueActive!=="donnees" && vueActive!=="param") vueActive="donnees";
  var sauveNote=$("#noteRapide")?$("#noteRapide").value:null;
  var sauveVigi=$("#vigiTxt")?$("#vigiTxt").value:null;
  var sauveAp=["apTel","apQui","apObj","apEnt","apCom","apAff"].map(function(i){ return $("#"+i)?$("#"+i).value:null });
  var sauveLienQ=$("#lienQ")?$("#lienQ").value:null;
  var sauveCtQ=$("#ctq")?$("#ctq").value:null;
  var sauveId=["idTitre","idNote"].map(function(i){ return $("#"+i)?$("#"+i).value:null });
  if(vueActive==="jour") m.innerHTML=vueJour();
  else if(vueActive==="suivant") m.innerHTML=vueSuivant();
  else if(vueActive==="calendrier") m.innerHTML=vueCalendrier();
  else if(vueActive==="rapport") m.innerHTML=vueRapport();
  else if(vueActive==="projets") m.innerHTML=vueProjets();
  else if(vueActive==="chantiers") m.innerHTML=vueChantiers();
  else if(vueActive==="idees") m.innerHTML=vueIdees();
  else if(vueActive==="journal") m.innerHTML=vueJournal();
  else if(vueActive==="contacts") m.innerHTML=vueContacts();
  else if(vueActive==="param") m.innerHTML=vueParam();
  else m.innerHTML=vueDonnees();
  if(sauveNote && $("#noteRapide")) $("#noteRapide").value=sauveNote;
  if(sauveVigi && $("#vigiTxt")) $("#vigiTxt").value=sauveVigi;
  ["apTel","apQui","apObj","apEnt","apCom","apAff"].forEach(function(i,k){
    if(sauveAp[k] && $("#"+i)) $("#"+i).value=sauveAp[k];
  });
  if(sauveLienQ && $("#lienQ")) $("#lienQ").value=sauveLienQ;
  if(sauveCtQ && $("#ctq")){ $("#ctq").value=sauveCtQ; }
  ["idTitre","idNote"].forEach(function(i,k){
    if(sauveId[k] && $("#"+i)) $("#"+i).value=sauveId[k];
  });
  armerChampsFr(document);        /* les vues viennent d'etre reecrites : on arme ce qui existe */
  if(vueActive==="idees") dessinerBulles();   /* la carte a besoin de la largeur reelle */
  var d=new Date();
  $("#version").textContent="v"+APP_VERSION;
  var nm=String((D.parametres&&D.parametres.nom_app)||NOM_DEFAUT);
  $("#marque").innerHTML=esc(nm).replace(/\s+/g,'<span>\u00b7</span>');
  titreBase=nm+" v"+APP_VERSION;        /* sert aussi de base aux alertes de permanence */
  if(!alertesEnCours().length) document.title=titreBase;
  var bp=$("#btnPause"); if(bp) bp.style.display=fichierCharge?"":"none";
  /* À propos et Aide restent accessibles avant toute liaison de fichier */
  majStyleCats();
  majCompteurPause();
  $("#dateJour").textContent=d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  Array.prototype.forEach.call($("#nav").children,function(b){
    var bloque = !fichierCharge && b.dataset.vue!=="donnees";
    b.disabled=bloque;
    b.classList.toggle("bloque",bloque);
    b.setAttribute("aria-current", (b.dataset.vue===vueActive||(vueActive==="param"&&b.dataset.vue==="donnees"))?"true":"false");
  });
  majEtat();
}
function ajouterNote(){
  var t=$("#noteRapide"); if(!t) return;
  var v=t.value.trim(); if(!v){ t.focus(); return }
  var n={id:uid(),date:auj(),heure:hNow(),type:$("#noteType").value,
    chantier_id:"",rubrique_id:"",contenu:v,duree:dureeChoisie||0,suite:null};
  var lien=$("#noteLien")?$("#noteLien").value:"";
  poserLien(n,lien);
  dernierLien=lien||null;
  D.notes.push(n);
  dureeChoisie=0;
  t.value="";                       /* avant rendre(), qui restaure sinon la saisie en cours */
  modifie(); rendre();
  var suiv=$("#noteRapide"); if(suiv) suiv.focus();
  toast("Note ajoutée à "+n.heure+(n.duree?" · "+n.duree+" min":""));
}

var JOURNAL_VERSIONS = [
  ["1.5-public","<b>Options r\u00e9organis\u00e9e.</b> L\u2019\u00e9cran faisait pr\u00e8s de quatre \u00e9crans de haut pour quatre blocs, dont deux fourre-tout : \u00ab Fichier de donn\u00e9es \u00bb contenait le rapport, l\u2019identit\u00e9 et le compte-rendu, et deux s\u00e9lecteurs de p\u00e9riode y cohabitaient ; l\u2019import Excel \u00e9tait s\u00e9par\u00e9 de son propre r\u00e9glage par trois \u00e9crans. Six sections r\u00e9pondent d\u00e9sormais chacune \u00e0 une t\u00e2che \u2014 Fichier, Import et export, Organisation, Cat\u00e9gories, Listes, Affichage \u2014 et se choisissent par une rang\u00e9e d\u2019onglets. Le rapport, le compte-rendu et l\u2019identit\u00e9 qui les signe ne sont pas des r\u00e9glages mais des productions : ils ont leur propre onglet <b>Rapport</b>."],
  ["1.4-public","Le Journal regroupe les <b>notes sans rattachement</b> \u2014 ni activit\u00e9, ni rubrique \u2014 et permet de les ranger sur place. Elles n\u2019apparaissaient jusqu\u2019ici nulle part, tout en comptant dans les totaux. Supprimer une rubrique garde d\u00e9sormais la trace de ce \u00e0 quoi chaque note \u00e9tait rattach\u00e9e, si bien qu\u2019on sait d\u2019o\u00f9 elles viennent."],
  ["1.3-public","Une rubrique d\u2019activit\u00e9 se renomme et change de famille directement dans la liste. Jusqu\u2019ici elle ne pouvait qu\u2019\u00eatre ajout\u00e9e ou supprim\u00e9e : corriger une faute de frappe imposait de la d\u00e9truire et de la recr\u00e9er, donc de d\u00e9tacher toutes ses notes sans moyen de r\u00e9tablir le lien. Les notes pointent l\u2019identifiant de la rubrique, jamais son nom : renommer est sans effet sur elles."],
  ["1.2-public","Chaque rubrique dit maintenant ce qu\u2019elle r\u00e9cup\u00e8re automatiquement \u2014 le chrono du compteur, ou la dur\u00e9e des appels \u2014 et ce r\u00e9glage se change dans la liste. Il n\u2019\u00e9tait jusque-l\u00e0 r\u00e9glable nulle part : une rubrique recr\u00e9\u00e9e \u00e0 la main perdait d\u00e9finitivement cette r\u00e9cup\u00e9ration. Une m\u00eame source ne peut appartenir qu\u2019\u00e0 une rubrique, sans quoi son temps serait compt\u00e9 deux fois. Et supprimer une rubrique demande confirmation en annon\u00e7ant le nombre de notes qui seront d\u00e9tach\u00e9es \u2014 un lien qu\u2019on ne r\u00e9tablit pas."],
  ["1.1-public","Les champs d\u2019une cat\u00e9gorie se r\u00e9agencent : tirez une ligne par sa poign\u00e9e, ou utilisez les fl\u00e8ches. L\u2019ordre de la fen\u00eatre est celui de la fiche. Un champ ajout\u00e9 et pas encore nomm\u00e9 survit au d\u00e9placement, et les saisies en cours ne sont pas perdues."],
  ["1.0-public","Premi\u00e8re version publiable, sous licence libre. Tout le vocabulaire du logiciel est d\u00e9sormais g\u00e9n\u00e9rique, libell\u00e9s comme cl\u00e9s de donn\u00e9es : les deux rappels de permanence s\u2019appellent Rappel 1 et Rappel 2, la rubrique de comptage \u00ab Traitement en s\u00e9rie \u00bb, et le second identifiant d\u2019une activit\u00e9 \u00ab R\u00e9f\u00e9rence technique \u00bb. Rien dans l\u2019application ne suppose plus un domaine d\u2019activit\u00e9 particulier : ce qui est sp\u00e9cifique \u00e0 un usage se configure, et s\u2019importe depuis un fichier de configuration. Un fichier enregistr\u00e9 avant cette version se convertit une fois, avec l\u2019outil fourni \u00e0 part. La num\u00e9rotation repart \u00e0 1.0 ; les versions pr\u00e9c\u00e9dentes, d\u00e9sormais suffix\u00e9es -private, restent au journal."],
  ["3.39.0-private","Le logiciel passe sous licence libre : <b>GNU GPL v3 ou ult\u00e9rieure</b>, au lieu de \u00ab tous droits r\u00e9serv\u00e9s \u00bb. Vous pouvez le redistribuer et le modifier, \u00e0 condition d\u2019en faire autant pour vos versions. L\u2019avis de licence figure en t\u00eate du fichier : celui-ci \u00e9tant \u00e0 la fois le programme et son code source complet, le recevoir suffit \u00e0 disposer de la source."],
  ["3.38.0-private","Suivi de projet, d\u00e9sactiv\u00e9 par d\u00e9faut : une activit\u00e9 devient un projet quand on l\u2019active. Elle gagne une \u00e9ch\u00e9ance qui ne se d\u00e9place pas sans motif \u2014 l\u2019\u00e9ch\u00e9ance d\u2019origine reste affich\u00e9e barr\u00e9e, avec le nombre de reports et leur historique \u2014 et des jalons choisis parmi ses \u00e9v\u00e9nements et ses t\u00e2ches. L\u2019avancement est calcul\u00e9 sur les jalons valid\u00e9s, jamais saisi. Nouvel onglet Projets, une ligne par projet, et un bloc \u00ab Projets \u00e0 surveiller \u00bb sur l\u2019\u00e9cran du jour."],
  ["3.37.1-private","Correctif de texte : la fiche d\u2019une activit\u00e9 sans \u00e9v\u00e9nement annon\u00e7ait qu\u2019elle \u00e9tait signal\u00e9e comme non pilot\u00e9e, alors qu\u2019une t\u00e2che en attente suffit \u00e0 la piloter. Le message consulte d\u00e9sormais la r\u00e8gle au lieu de la r\u00e9citer, et dit l\u2019\u00e9tat r\u00e9el de ce dossier-l\u00e0. Deux autres textes parlaient encore de \u00ab date \u00e0 venir \u00bb l\u00e0 o\u00f9 il s\u2019agit d\u2019un \u00e9v\u00e9nement."],
  ["3.37.0-private","Fiche d\u2019activit\u00e9 : les boutons d\u2019ajout suivent d\u00e9sormais le titre de leur propre section, \u00e0 gauche. \u00ab + \u00c9v\u00e9nement \u00bb n\u2019est plus rejet\u00e9 \u00e0 droite, et \u00ab + Note \u00bb et \u00ab + T\u00e2che \u00bb ne flottent plus dans une bande pos\u00e9e avant le titre \u00ab Notes li\u00e9es \u00bb. Ce titre est maintenant affich\u00e9 m\u00eame sans aucune note."],
  ["3.36.1-private","Correctif interne : les champs de date et d\u2019heure sont pr\u00e9par\u00e9s au moment m\u00eame o\u00f9 ils sont cr\u00e9\u00e9s, et non plus par un rattrapage diff\u00e9r\u00e9. La fen\u00eatre \u00ab Choisir une date \u00bb affichait sa date par d\u00e9faut au format interne."],
  ["3.36.0-private","L\u2019onglet Donn\u00e9es s\u2019appelle d\u00e9sormais Options. Nouveau r\u00e9glage : le format des dates et des heures. Un champ de date natif suit la langue du navigateur et non celle de l\u2019application \u2014 sur un poste en anglais la saisie se lisait mm/jj/aaaa et 02:30 PM. Le mode \u00ab jj/mm/aaaa et 24 h \u00bb remplace ces champs par les n\u00f4tres, qui acceptent aussi la frappe rapide (121126, 14h30), tout en gardant le calendrier du navigateur derri\u00e8re un bouton."],
 ["3.35.0-private","Une activit\u00e9 n'a plus une date unique mais une liste d'\u00e9v\u00e9nements : visite, r\u00e9union, intervention\u2026 chacun avec son type, sa dur\u00e9e et son propre \u00e9tat (pr\u00e9vu, r\u00e9alis\u00e9, annul\u00e9, report\u00e9). Les activit\u00e9s d\u00e9j\u00e0 dat\u00e9es sont reprises en un premier \u00e9v\u00e9nement, de type d\u00e9duit de leur cat\u00e9gorie. Le planning, le prochain jour ouvr\u00e9 et le calendrier listent chaque \u00e9v\u00e9nement ; un dossier est non pilot\u00e9 lorsqu'il n'a ni t\u00e2che en attente ni \u00e9v\u00e9nement \u00e0 venir non annul\u00e9. Les champs Date, Heure et Dur\u00e9e de la fiche affichent d\u00e9sormais l'\u00e9v\u00e9nement de r\u00e9f\u00e9rence et ne se saisissent plus."],

/* ================= à propos =================
   Fiche du logiciel : ce qu'il est, qui l'a écrit, sous quelle licence, et le journal
   des versions — qui vivait jusqu'ici dans la vue Données, où personne ne le cherchait. */
var AUTEUR = "Stella Caltagirone";
var LICENCE = "GNU GPL v3 ou ultérieure";
var ANNEE = "2026";

/* Le bandeau reprend l'ecran d'ouverture : le nom se compose depuis une suite de 0 et 1.
   Il affiche NOM_DEFAUT, le nom du logiciel dans le code, et non celui que vous avez
   peut-etre choisi dans les parametres : c'est la fiche du produit, pas de votre copie. */
function fragBandeauApropos(){
  return '<div class="ap-ban">'
    +'<span class="ap-logo" id="apLogo"></span>'
    +'<div class="ap-nom" id="apNom" aria-label="'+esc(NOM_DEFAUT)+'"></div>'
    +'<div class="ap-sous">pilotage d\u2019activité</div>'
  +'</div>';
}
var animApropos=null;
function arreterAnimApropos(){
  if(animApropos){ clearInterval(animApropos); animApropos=null }
}
/* Le bandeau ne va pas a la ligne : on reduit le corps jusqu'a ce que le nom tienne.
   La mesure se fait sur la suite de 0 et 1, plus large que les lettres condensees,
   pour que l'animation ne deborde pas non plus. */
function ajusterNomApropos(n,nom){
  if(!n || !n.parentNode) return;
  var max=27,min=11,garde=n.innerHTML;
  n.style.fontSize="";
  var base=parseFloat(getComputedStyle(n).fontSize)||max;
  n.innerHTML=new Array(nom.length+1).join('<span class="bit">0</span>');
  var t=base;
  while(t>min && n.scrollWidth>n.clientWidth) { t-=0.5; n.style.fontSize=t+"px" }
  n.innerHTML=garde;
}
function animerNomApropos(){
  arreterAnimApropos();
  var lg=$("#apLogo"), n=$("#apNom");
  if(!n) return;
  if(lg) lg.innerHTML=iconeSVG("#191C1B","#D8232A","#FBFBF9");
  var nom=String(NOM_DEFAUT);
  ajusterNomApropos(n,nom);
  var poser=function(){
    n.innerHTML=esc(nom).replace(/\s+/g,'<span class="pt">\u00b7</span>');
  };
  var reduit=false;
  try{ reduit=!!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) }catch(x){}
  if(reduit){ poser(); return }
  var cible=nom.toUpperCase().split(""), fixe=0;
  var pas=Math.max(34,Math.floor(760/Math.max(cible.length,1)));
  animApropos=setInterval(function(){
    /* la fenetre a pu etre fermee entre deux images : on ne laisse rien tourner en fond */
    if(!n.isConnected){ arreterAnimApropos(); return }
    var out="",i;
    for(i=0;i<cible.length;i++){
      if(i<fixe) out += (cible[i]===" ") ? '<span class="pt">\u00b7</span>' : esc(cible[i]);
      else out += '<span class="bit">'+(Math.random()<0.5?"0":"1")+'</span>';
    }
    n.innerHTML=out;
    if(fixe++>cible.length){ arreterAnimApropos(); poser() }
  },pas);
}
function fragApropos(){
  var nom=String((D.parametres&&D.parametres.nom_app)||NOM_DEFAUT);
  return fragBandeauApropos()
    +'<p class="ap-intro">'+esc(nom)+' suit votre activité au quotidien : vos dossiers, '
      +'vos rendez-vous, ce que vous en faites, le temps que vous y passez, et ce qu’il en '
      +'reste à présenter.</p>'
    +'<p class="ap-intro">Un seul fichier, qui fonctionne hors ligne. Aucune connexion, aucun '
      +'service tiers, aucune dépendance extérieure : vos données ne quittent jamais votre poste '
      +'et vivent dans le fichier que vous liez.</p>'
    +'<div class="diag" style="margin-top:14px">'
      +'<div>Version<b>'+esc(nom)+' v'+esc(APP_VERSION)+'</b></div>'
      +'<div>Auteur<b>'+esc(AUTEUR)+'</b></div>'
      +'<div>Licence<b>'+esc(LICENCE)+'</b></div>'
      +'<div>Fonctionnement<b>fichier unique, hors ligne</b></div>'
    +'</div>'
    /* L'avis court recommande par la FSF, plutot qu'une simple mention de licence :
       c'est lui qui dit a l'utilisatrice ce qu'elle a le droit de faire. */
    +'<p class="ap-legal">© '+esc(ANNEE)+' '+esc(AUTEUR)+'. Logiciel libre sous '
      +esc(LICENCE)+', <b>sans aucune garantie</b>. Libre à vous de le redistribuer et '
      +'de le modifier, à condition d’en faire autant pour vos versions. '
      +'Texte complet : fichier <span class="mono">LICENSE</span>, ou gnu.org/licenses.</p>'
    +'<hr class="sep">'
    +'<div class="ligne" style="margin-top:0">'
      +'<button class="lien" data-act="ap-versions">Journal des versions</button>'
      +'<span class="note-aide" style="margin:0">'+JOURNAL_VERSIONS.length+' versions '
      +'depuis la v'+esc(JOURNAL_VERSIONS[JOURNAL_VERSIONS.length-1][0])+'</span>'
    +'</div>';
}
function fragJournalVersions(){
  return '<div class="diag">'+JOURNAL_VERSIONS.map(function(v){

/* ================= comptes rendus =================
   Un bouton « Compte rendu » sur la fiche d'un appel, d'une note et d'une activite.
   Le texte est construit a partir de ce qui est a l'ecran, saisie en cours comprise :
   vous n'avez pas a enregistrer avant d'extraire. Il s'ouvre dans sa propre fenetre,
   par-dessus la fiche, qui reste ouverte derriere et intacte. */

function crLigne(lib,val){
  val=String(val==null?"":val).trim();
  return val ? [lib,val] : null;
}
/** Aligne « Libellé : valeur » sur la plus longue etiquette, pour un bloc lisible en mail.
    Une meme paire libelle + valeur n'est ecrite qu'une fois : certaines configurations
    portent deux champs de meme nom, et un compte rendu qui se repete se lit mal. */
function crBloc(lignes){
  var vus={},l=[],max=0;
  lignes.filter(Boolean).forEach(function(x){
    var cle=x[0]+"\u0001"+x[1];
    if(vus[cle]) return;
    vus[cle]=1; l.push(x);
    if(x[0].length>max) max=x[0].length;
  });
  if(!l.length) return "";
  return l.map(function(x){
    return x[0]+Array(max-x[0].length+1).join(" ")+" : "+x[1];
  }).join("\n")+"\n";
}
/** Date d'activite en jj/mm/aaaa, comme sur la fiche ; le reste est rendu tel quel. */
function crValeurChamp(f,v){
  v=String(v==null?"":v).trim();
  if(f && f.type==="date" && dateValide(v)){
    var p=v.split("-");
    return p[2]+"/"+p[1]+"/"+p[0];
  }
  return v;
}
/* 38 cadratins au plus : un trait plus long casse la mise en page des applications
   tierces ou les comptes rendus sont recopies. Jamais plus long que son titre non plus. */
var CR_TRAIT=38;
function crTitre(t){ return t+"\n"+Array(Math.min(t.length,CR_TRAIT)+1).join("—")+"\n" }
function crSection(t,corps){
  corps=String(corps||"").trim();
  return corps ? "\n"+t+"\n"+corps+"\n" : "";
}
function crSignature(){
  var P=D.parametres||{};
  var l=[P.id_nom,P.id_fonction,P.id_entite].map(function(v){ return String(v||"").trim() })
    .filter(Boolean);
  return l.length ? "\n--\n"+l.join(" · ")+"\n" : "";
}
function crDateHeure(d,h){
  var s=dateValide(d)?libDate(d):"";
  if(h) s+= (s?" à ":"")+h;
  return s;
}
/** Libelle lisible d'un statut, en passant par le jeu de la categorie. */
function crStatut(c){
  var v=String((c&&c.statut)||""); if(!v) return "";
  var t="";
  statutsDe((c&&c.categorie)||"chantier").forEach(function(x){ if(x[0]===v) t=x[1] });
  return t||libStatut(v);
}
/** Valeur courante d'un champ du formulaire ouvert, sinon la valeur enregistree. */
function crChamp(nom,repli){
  var e=$("#modCorps") && $("#modCorps").querySelector('[name="'+nom+'"]');
  if(!e) return repli==null?"":String(repli);
  if(e.type==="checkbox") return e.checked;
  return e.value;
}

/* ---------- appel ---------- */
function crAppel(a){
  if(!a) return "";
  var h=crChamp("heure",a.heure), duree=+crChamp("duree",a.duree)||0;
  var t=crTitre("Compte rendu d’appel — "+crDateHeure(a.date,h)
    +(duree?" · "+dureeLisible(duree):""));
  var aff=String(crChamp("affaire",a.affaire)||"").trim();
  var dos=dossierAffaire(aff);
  t+=crBloc([
    crLigne("Affaire",aff+(dos&&dos.libelle?" \u00b7 "+dos.libelle:"")),
    crLigne("Motif",crChamp("motif",a.motif)),
    crLigne("Interlocuteur",crChamp("qui",a.qui)),
    crLigne("Entreprise",crChamp("entreprise",a.entreprise)),
    crLigne("Téléphone",crChamp("tel",a.tel)),
    crLigne("Commune",crChamp("commune",a.commune))
  ]);
  t+=crSection("OBJET DE L’APPEL",crChamp("objet",a.objet));
  var s=String(crChamp("suite",a.suite)||"").trim();
  if(s){
    var fait=crChamp("suite_faite",a.suite_faite);
    t+=crSection("SUITE À DONNER"+(fait===true?" (traitée)":""),s);
  }
  return t+crSignature();
}

/* ---------- note ---------- */
function crNote(n){
  if(!n) return "";
  var d=crChamp("date",n.date), h=crChamp("heure",n.heure);
  var duree=+crChamp("duree",n.duree)||0, type=crChamp("type",n.type);
  var t=crTitre("Compte rendu — "+crDateHeure(d,h)
    +(type?" · "+type:"")+(duree?" · "+dureeLisible(duree):""));
  /* le dossier rattache : le choix courant de la liste prime sur la valeur enregistree */
  var lien=crChamp("lien",lienDe(n)), dossier="", rub="";
  if(lien && lien.indexOf("c:")===0){
    var c=chantierPar(lien.slice(2));
    if(c) dossier=[c.reference||c.ref_technique||"",c.libelle||""].filter(Boolean).join(" · ")
      +(c.commune?" ("+c.commune+")":"");
  }else if(lien && lien.indexOf("r:")===0){
    rubriques().forEach(function(r){ if(r.id===lien.slice(2)) rub=r.nom });
  }
  if(!dossier && !rub && n.chantier_ref) dossier=n.chantier_ref+"  [lien perdu]";
  t+=crBloc([crLigne("Dossier",dossier),crLigne("Rubrique",rub)]);
  t+=crSection("NOTE",crChamp("contenu",n.contenu));
  var s=String(crChamp("suite_txt",(n.suite||{}).texte)||"").trim();
  if(s){
    var ech=crChamp("suite_ech",(n.suite||{}).echeance);
    var fait=crChamp("suite_fait",(n.suite||{}).fait);
    t+=crSection("SUITE À DONNER"
      +(fait===true?" (terminée)":(dateValide(ech)?" — échéance "+libDate(ech):"")),s);
  }
  return t+crSignature();
}

/* ---------- activite ---------- */
function crActivite(c,avecNotes){
  if(!c) return "";
  var K=catDe(c);
  var vc=function(nom,repli){ return String(crChamp(nom,repli)||"").trim() };
  var lib=vc("libelle",c.libelle), ref=vc("reference",c.reference);
  var t=crTitre(K.lib+" — "+(ref?ref+" · ":"")+(lib||"sans libellé"));
  var d=vc("date",c.date), h=vc("heure",c.heure), du=+crChamp("duree",c.duree)||0;
  /* sans date posee, l'heure seule ne s'annonce pas « Date » : une activite non datee
     porte un horaire de principe, pas un rendez-vous */
  var quand=crDateHeure(d,h)+(du?" · "+dureeLisible(du):"");
  /* quand la categorie reflete son statut dans un de ses champs, on reprend le nom de ce
     champ : « État affaire » plutot que « Statut », et plus de doublon avec le champ
     « Statut » du reporting, qui est autre chose */
  var miroir=(K && K.miroir)||"", libStat="Statut";
  champsDe(c.categorie||"chantier").forEach(function(f){
    if(miroir && f.cle===miroir && f.lib) libStat=f.lib;
  });
  var base=[
    crLigne(libStat,crStatut({categorie:c.categorie,statut:vc("statut",c.statut)})),
    crLigne(dateValide(d)?"Date":(h?"Heure":"Durée"),quand),
    crLigne("Type",vc("type",c.type)),
    crLigne(K.tiers||"Interlocuteur",vc("tiers",c.tiers)),
    crLigne("Contact",[vc("contact_nom",c.contact_nom),vc("contact_tel",c.contact_tel)]
      .filter(Boolean).join(" · ")),
    crLigne("Commune",vc("commune",c.commune)),
    crLigne("Adresse",vc("adresse",c.adresse))
  ];
  /* les champs configures de la categorie, dans l'ordre de la fiche, et seulement s'ils portent
     une valeur : un compte rendu truffe de lignes vides ne se transmet pas */
  champsDe(c.categorie||"chantier").forEach(function(f){
    if(!f.cle || !f.lib) return;
    if(f.cle===miroir) return;     /* reflet du statut : la ligne Statut le dit deja */
    base.push(crLigne(f.lib,crValeurChamp(f,vc(f.cle,c[f.cle]))));
  });
  t+=crBloc(base);
  t+=crSection("COMMENTAIRE",vc("commentaire",c.commentaire));
  if(estArchive(c)){
    t+=crSection("ARCHIVÉ",libDate(c.archive)
      +(c.archive_motif?" — "+c.archive_motif:"")
      +(c.archive_issue==="traite"?"  (traité, mené à terme)":
        (c.archive_issue==="sorti"?"  (sorti du périmètre)":"")));
  }
  if(avecNotes){
    var l=D.notes.filter(function(n){ return n.chantier_id===c.id })
      .sort(function(a,b){ return (a.date+a.heure).localeCompare(b.date+b.heure) });
    if(l.length){
      t+="\nHISTORIQUE ("+l.length+" note"+(l.length>1?"s":"")+")\n";
      t+=l.map(function(n){
        var e="• "+(dateValide(n.date)?libCourt(n.date):"sans date")
          +(n.heure?" "+n.heure:"")+(n.type?" · "+n.type:"")
          +(n.duree?" · "+dureeLisible(n.duree):"");
        if(n.contenu) e+="\n  "+String(n.contenu).replace(/\n/g,"\n  ");
        if(n.suite && n.suite.texte){
          e+="\n  → à faire : "+n.suite.texte
            +(n.suite.fait?"  [terminé]"
              :(dateValide(n.suite.echeance)?"  [échéance "+libCourt(n.suite.echeance)+"]":""));
        }
        return e;
      }).join("\n")+"\n";
    }
  }
  return t+crSignature();
}

/* ================= idees =================
   Boite a idees locale : capture, regroupement automatique par similarite, cristallisation
   par copier-coller avec Claude, conversion en activite du pilotage.
   Aucun appel reseau : la cristallisation compose une invite, vous la portez dans votre
   conversation Claude, et vous rapportez le JSON. */

function idees(){ return D.idees||(D.idees=[]) }
function ideesU(){ return D.idees_unifiees||(D.idees_unifiees=[]) }
function reglagesIdees(){
  var r=D.parametres.idees||(D.parametres.idees={});
  if(typeof r.seuil!=="number") r.seuil=0.22;
  return r;
}
function ideePar(id){ var l=idees(),i; for(i=0;i<l.length;i++) if(l[i].id===id) return l[i]; return null }
function ideeUPar(id){ var l=ideesU(),i; for(i=0;i<l.length;i++) if(l[i].id===id) return l[i]; return null }
function normaliserIdee(o){
  o=o||{};
  return {id:String(o.id||uid()),titre:String(o.titre||"").trim(),note:String(o.note||""),
    cat:String(o.cat||""),cree_le:String(o.cree_le||new Date().toISOString()),
    statut:(o.statut==="absorbee"?"absorbee":"libre"),unifiee_id:String(o.unifiee_id||"")};
}
function normaliserIdeeU(o){
  o=o||{};
  var tab=function(v){
    return (estTableau(v)?v:[]).map(function(x){ return String(x==null?"":x).slice(0,300).trim() })
      .filter(Boolean).slice(0,6);
  };
  return {id:String(o.id||uid()),titre:String(o.titre||"Idée unifiée").slice(0,200),
    synthese:String(o.synthese||"").slice(0,4000),
    objectifs:tab(o.objectifs),etapes:tab(o.etapes),vigilance:tab(o.vigilance),
    cat:String(o.cat||""),sources:(estTableau(o.sources)?o.sources:[]).map(String),
    cree_le:String(o.cree_le||new Date().toISOString()),
    statut:(o.statut==="convertie"?"convertie":"unifiee"),activite_id:String(o.activite_id||"")};
}
/** Categorie d'une idee : contrairement a catParCle, une idee peut n'en avoir aucune. */
function catIdee(cle){
  if(!cle) return {cle:"",lib:"Sans catégorie",plur:"Sans catégorie",couleur:"#8B918C",sym:"·"};
  var l=categories(),i;
  for(i=0;i<l.length;i++) if(l[i].cle===cle) return l[i];
  return {cle:cle,lib:"Catégorie disparue",plur:"Catégorie disparue",couleur:"#8B918C",sym:"·"};
}

/* ---------- similitude : Jaccard sur radicaux, bonus de categorie ---------- */
var MOTS_VIDES=("les des une un le la de du et en au aux pour par sur avec dans que qui pas plus est son ses "
 +"mes mon ma nos vos leur leurs ce cet cette ces faire fait tout tous toute comme mais ou donc car chez "
 +"entre vers sans sous etre avoir peu tres bien aussi chaque").split(" ");
var VIDES={}; MOTS_VIDES.forEach(function(m){ VIDES[m]=1 });
function racineMot(w){ return w.length>4 ? w.replace(/(s|x)$/,"").replace(/(er|ir|e)$/,"") : w }
var cacheMots={}, cacheMotsN=0;
function motsIdee(i){
  var cle=i.id+"\u0001"+i.titre+"\u0001"+(i.note||"");
  if(cacheMots[cle]) return cacheMots[cle];
  var m={};
  /* chaque mot est normalise pour lui-meme : on ne s'appuie pas sur un alignement
     d'indices entre deux decoupages, qui se decale au premier caractere exotique */
  (i.titre+" "+(i.note||"")).split(/[^0-9A-Za-zÀ-ÖØ-öø-ÿ]+/).forEach(function(brut){
    if(!brut) return;
    var w=sansAccent(brut.toLowerCase()).replace(/[^0-9a-z]/g,"");
    if(w.length<3 || VIDES[w]) return;
    var r=racineMot(w);
    /* on retient le mot tel qu'il s'ecrit : un titre de groupe fait de radicaux
       tronques (« Courri · proprietair ») ne veut rien dire pour qui le lit */
    if(!m.hasOwnProperty(r)) m[r]=brut.toLowerCase();
  });
  if(cacheMotsN>4000){ cacheMots={}; cacheMotsN=0 }   /* la carte ne grossit pas indefiniment */
  cacheMots[cle]=m; cacheMotsN++;
  return m;
}
function similitude(a,b){
  var A=motsIdee(a),B=motsIdee(b),inter=0,na=0,nb=0,k;
  for(k in A) if(A.hasOwnProperty(k)){ na++; if(B[k]) inter++ }
  for(k in B) if(B.hasOwnProperty(k)) nb++;
  var uni=na+nb-inter;
  return (uni?inter/uni:0)+((a.cat && a.cat===b.cat)?0.12:0);
}
function titreMeta(g){
  var cpt={},mot={},l=[];
  g.forEach(function(i){
    var m=motsIdee(i),k;
    for(k in m) if(m.hasOwnProperty(k)){ cpt[k]=(cpt[k]||0)+1; if(!mot[k]) mot[k]=m[k] }
  });
  Object.keys(cpt).forEach(function(k){ l.push([k,cpt[k]]) });
  /* les mots presents dans toutes les idees d'abord, puis les plus longs : ils portent le sens */
  l.sort(function(x,y){ return y[1]-x[1] || mot[y[0]].length-mot[x[0]].length || x[0].localeCompare(y[0]) });
  var t=l.slice(0,3).map(function(x){ return mot[x[0]] }).join(" · ");
  return t ? t.charAt(0).toUpperCase()+t.slice(1) : "Idées proches";
}
function catMajoritaire(g){
  var c={},meilleur="",n=0;
  g.forEach(function(i){
    if(!i.cat) return;
    c[i.cat]=(c[i.cat]||0)+1;
    if(c[i.cat]>n){ n=c[i.cat]; meilleur=i.cat }
  });
  return meilleur;
}
/** Groupes d'idees proches : union-find sur la similitude, au seuil reglable. */
function metaIdees(){
  var libres=idees().filter(function(i){ return i.statut!=="absorbee" });
  var p=libres.map(function(_,k){ return k });
  function f(k){ return p[k]===k ? k : (p[k]=f(p[k])) }
  var seuil=reglagesIdees().seuil,a,b;
  for(a=0;a<libres.length;a++) for(b=a+1;b<libres.length;b++)
    if(similitude(libres[a],libres[b])>=seuil) p[f(a)]=f(b);
  var groupes={},racines=[];
  libres.forEach(function(i,k){
    var r=f(k);
    if(!groupes[r]){ groupes[r]=[]; racines.push(r) }
    groupes[r].push(i);
  });
  var metas=[],par={};
  racines.forEach(function(r){
    var g=groupes[r];
    if(g.length<2) return;
    var m={cle:g.map(function(i){return i.id}).sort().join("+"),ideas:g,
      titre:titreMeta(g),cat:catMajoritaire(g)};
    metas.push(m);
    g.forEach(function(i){ par[i.id]=m });
  });
  return {metas:metas,par:par,libres:libres};
}

/* ---------- vue ---------- */
var vueIdeesMode="bulles", selIdees={};
function nbSelIdees(){
  var n=0,k;
  for(k in selIdees) if(selIdees.hasOwnProperty(k) && selIdees[k]) n++;
  return n;
}
function libSeuil(){
  var s=reglagesIdees().seuil;
  return s<0.18 ? "large" : (s>0.30 ? "strict" : "moyen");
}
/** La couleur d'une idee est celle de sa categorie, comme partout ailleurs dans

function coulIdee(cle){ return catIdee(cle).couleur||"#5C625E" }
function vueIdees(){

        +'style="width:100%;padding:8px;border:1px solid var(--trait);border-radius:2px">'
      +'<textarea id="idNote" placeholder="Détail, contexte, pourquoi — facultatif" '

      +'<div class="ligne" style="margin-top:6px">'

function fragIdVide(){

function fragTableIdees(M){

    var ma=M.par[a.id],mb=M.par[b.id];
    if(!!ma!==!!mb) return ma?-1:1;

  }).map(function(i){

function fragBulles(M){

    +'<svg id="idSvg" role="img" aria-label="Carte des idées : '+M.libres.length+' idée(s), '

    +'<div class="id-zoom">'
      +'<button class="b mini creux" data-act="id-zplus" title="Agrandir" aria-label="Agrandir">+</button>'

      +'<button class="b mini creux" data-act="id-zraz" title="Revoir toute la carte" '
        +'aria-label="Revoir toute la carte">⟳</button>'

    +'Cristal : une idée cristallisée. Un clic sélectionne, un double clic ouvre ; '
    +'les bulles se déplacent à la main, le fond se fait glisser, et la molette zoome avec Ctrl '
    +'(ou en pinçant le pavé tactile).</div>'
    +(M.metas.length?'<div class="ligne" style="margin-top:4px">'+M.metas.map(function(m){
      return '<button class="lien" data-idgrp="'+esc(m.cle)+'" title="Sélectionner ou désélectionner ce groupe">'
        +'<span class="id-pst" style="background:'+esc(coulIdee(m.cat))+'"></span>'
        +esc(tronque(m.titre,26))+' ('+m.ideas.length+')</button>';
    }).join("")+'</div>':"");
}
function fragIdeeU(u){
  var K=catIdee(u.cat);
  var src=u.sources.map(function(id){ var i=ideePar(id); return i?i.titre:null }).filter(Boolean);
  return '<div class="note" data-ideeu="'+esc(u.id)+'" style="cursor:pointer">'
    +'<div class="h">'+(u.cat?esc(K.lib)+' · ':"")+esc(libCourt(String(u.cree_le).slice(0,10)))
      +(u.statut==="convertie"?' · convertie en activité':' · à convertir')+'</div>'
    +'<div class="txt"><b>'+esc(u.titre)+'</b>'+(u.synthese?'\n'+esc(tronque(u.synthese,240)):"")+'</div>'
    +(src.length?'<div class="id-src">à partir de : '+esc(tronque(src.join(" · "),140))+'</div>':"")
  +'</div>';
}

/* ---------- carte en bulles : simulation de forces vivante, sans bibliotheque ----------
   Bulle : une idee. Membrane : un groupe. Cristal : une idee cristallisee.
   La simulation s'eteint d'elle-meme une fois posee ; elle ne tourne jamais en fond. */
var simIdees=null;              /* {stop:fn} de la boucle en cours */
var posIdees={};                /* memoire des positions : la carte ne saute pas d'un rendu a l'autre */
var vueIdeesT={x:0,y:0,k:1};    /* translation et echelle de la carte */
var ideeFraiche=null;           /* cristal a faire eclore au prochain dessin */
var glisseIdee=false;           /* un glisser vient d'avoir lieu : le clic qui suit n'en est pas un */

function arreterSimIdees(){ if(simIdees){ simIdees.stop(); simIdees=null } }
function sobre(){
  try{ return window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches }
  catch(e){ return false }
}
function cheminHex(r){
  var p="",k,a;
  for(k=0;k<6;k++){
    a=Math.PI/180*(60*k-90);
    p+=(k?"L":"M")+(r*Math.cos(a)).toFixed(1)+","+(r*Math.sin(a)).toFixed(1);
  }
  return p+"Z";
}
function svgEl(nom,attrs){
  var e=document.createElementNS("http://www.w3.org/2000/svg",nom),k;
  for(k in attrs) if(attrs.hasOwnProperty(k)) e.setAttribute(k,attrs[k]);
  return e;
}
function dessinerBulles(){
  arreterSimIdees();
  var zone=$("#idBulles"),svg=$("#idSvg");
  if(!zone || !svg) return;
  var M=metaIdees(),l=M.libres;
  var unis=ideesU().filter(function(u){ return u.statut!=="convertie" });
  if(!l.length && !unis.length) return;

  var L=Math.max(300,zone.clientWidth||640);
  /* moins la zone est large, moins elle tient de bulles par rangee : la hauteur
     compense, sinon la carte deborde par le bas sur un ecran etroit */
  var serre=Math.max(1,Math.min(2.9,900/L));
  var H=Math.max(320,Math.min(760,210+(l.length+unis.length)*17*serre));
  svg.setAttribute("viewBox","0 0 "+L+" "+H);
  svg.setAttribute("preserveAspectRatio","xMidYMid meet");
  svg.style.height=H+"px";
  svg.innerHTML="";
  var racine=svgEl("g",{}), gMem=svgEl("g",{}), gNoeuds=svgEl("g",{});
  racine.appendChild(gMem); racine.appendChild(gNoeuds); svg.appendChild(racine);

  /* --- les noeuds : idees libres et cristaux --- */
  var n=[],parId={};
  l.forEach(function(i,k){
    var poids=(i.titre||"").length+(i.note||"").length/3;
    var p=posIdees["i:"+i.id];
    var r=Math.max(15,Math.min(29,13+Math.sqrt(poids)*1.9));
    var lib=tronque(i.titre,19);
    n.push(parId["i:"+i.id]={cle:"i:"+i.id,id:i.id,genre:"idee",t:i.titre,lib:lib,
      r:r,coul:coulIdee(i.cat),dx:Math.max(r,lib.length*3.05)+3,dy:r+13,
      x:p?p.x:L/2+Math.cos(k*2.39996)*(40+k*6), y:p?p.y:H/2+Math.sin(k*2.39996)*(32+k*5),
      vx:0,vy:0,fx:null,fy:null});
  });
  unis.forEach(function(u,k){
    var p=posIdees["u:"+u.id];
    var lu=tronque(u.titre,24);
    n.push(parId["u:"+u.id]={cle:"u:"+u.id,id:u.id,genre:"cristal",t:u.titre,lib:lu,
      r:31,coul:coulIdee(u.cat),dx:Math.max(31,lu.length*3.3)+3,dy:44,
      x:p?p.x:L/2+Math.cos(k*1.7)*70, y:p?p.y:H/2+Math.sin(k*1.7)*55,
      vx:0,vy:0,fx:null,fy:null});
  });
  /* --- les membranes : un groupe est un objet visible, pas une coincidence de couleur --- */
  var mem=M.metas.map(function(m){
    return {cle:m.cle,titre:m.titre,coul:coulIdee(m.cat),
      noeuds:m.ideas.map(function(i){ return parId["i:"+i.id] }).filter(Boolean),
      cx:L/2,cy:H/2,R:44};
  }).filter(function(m){ return m.noeuds.length>1 });
  var dansMem={};
  mem.forEach(function(m){ m.noeuds.forEach(function(x){ dansMem[x.cle]=m }) });

  /* --- construction du DOM, une seule fois : la boucle ne fait plus que deplacer --- */
  mem.forEach(function(m){
    var g=svgEl("g",{"class":"id-mem","data-idgrp":m.cle});
    m.el=svgEl("circle",{"class":"trait",fill:m.coul,"fill-opacity":".07",stroke:m.coul,
      "stroke-width":"1.5","stroke-dasharray":"5 4"});
    m.prise=svgEl("circle",{"class":"prise"});   /* anneau transparent : la cible du clic */
    m.lbl=svgEl("text",{fill:m.coul});
    m.lbl.textContent=tronque(m.titre,30);
    g.appendChild(m.el); g.appendChild(m.prise); g.appendChild(m.lbl);
    var ti=svgEl("title",{}); ti.textContent=m.titre+" — "+m.noeuds.length+" idées proches";
    g.appendChild(ti);
    gMem.appendChild(g);
  });
  n.forEach(function(p){
    var on=!!selIdees[p.id], cri=p.genre==="cristal";
    var g=svgEl("g",{"class":"id-b"+(on?" on":"")+(cri?" cri":""),
      tabindex:"0",role:"button",
      "aria-label":(cri?"Idée cristallisée : ":"Idée : ")+p.t});
    g.setAttribute(cri?"data-cristal":"data-bulle",p.id);
    var ti=svgEl("title",{}); ti.textContent=p.t; g.appendChild(ti);
    var forme=svgEl("g",{"class":"id-f"});
    if(cri){
      forme.appendChild(svgEl("path",{d:cheminHex(p.r),fill:p.coul,
        "fill-opacity":on?".85":".30",stroke:p.coul,"stroke-width":on?"3.2":"2"}));
      var v=function(k){ var a=Math.PI/180*(60*k-90);
        return (p.r*Math.cos(a)).toFixed(1)+","+(p.r*Math.sin(a)).toFixed(1) };
      forme.appendChild(svgEl("path",{d:"M0,0L"+v(0)+"M0,0L"+v(2)+"M0,0L"+v(4),
        stroke:p.coul,"stroke-width":"1","stroke-opacity":".7",fill:"none"}));
    }else{
      forme.appendChild(svgEl("circle",{r:p.r.toFixed(1),fill:p.coul,
        "fill-opacity":on?".88":".20",stroke:p.coul,"stroke-width":on?"3":"1.6"}));
    }
    g.appendChild(forme);
    var tx=svgEl("text",{y:(p.r+14).toFixed(1)});
    tx.textContent=p.lib;
    g.appendChild(tx);
    p.el=g; p.forme=forme;
    gNoeuds.appendChild(g);
    /* eclosion du cristal qui vient de se former */
    if(cri && ideeFraiche===p.id && !sobre()){
      forme.setAttribute("transform","scale(.2) rotate(-60)");
      forme.classList.add("eclot");
      setTimeout(function(){ forme.setAttribute("transform","scale(1) rotate(0)") },30);
    }
  });
  ideeFraiche=null;

  function poser(){
    n.forEach(function(p){
      p.el.setAttribute("transform","translate("+p.x.toFixed(1)+","+p.y.toFixed(1)+")");
      posIdees[p.cle]={x:p.x,y:p.y};
    });
    mem.forEach(function(m){
      var cx=0,cy=0,R=0;
      m.noeuds.forEach(function(x){ cx+=x.x; cy+=x.y });
      m.cx=cx/m.noeuds.length; m.cy=cy/m.noeuds.length;
      m.noeuds.forEach(function(x){
        R=Math.max(R,Math.sqrt((x.x-m.cx)*(x.x-m.cx)+(x.y-m.cy)*(x.y-m.cy))+x.r);
      });
      m.R=R+22;
      m.el.setAttribute("cx",m.cx.toFixed(1)); m.el.setAttribute("cy",m.cy.toFixed(1));
      m.el.setAttribute("r",m.R.toFixed(1));
      m.prise.setAttribute("cx",m.cx.toFixed(1)); m.prise.setAttribute("cy",m.cy.toFixed(1));
      m.prise.setAttribute("r",m.R.toFixed(1));
      /* le titre va au-dessus de la membrane, et passe dessous quand il n'y a plus de place */
      var yt=m.cy-m.R-8;
      if(yt<13) yt=Math.min(H-4,m.cy+m.R+17);
      m.lbl.setAttribute("x",m.cx.toFixed(1)); m.lbl.setAttribute("y",yt.toFixed(1));
    });
  }
  var kx=Math.max(0.010,Math.min(0.13,0.011*(1150/L)*(1150/L)));
  function pas(alpha){
    var i,j,A,B,dx,dy,d,f,mini,px,py,s;
    for(i=0;i<n.length;i++){
      A=n[i];
      /* recentrage faible a l'horizontale, plus ferme a la verticale : la zone est
         large et basse, les bulles doivent s'etaler plutot que s'empiler. La force
         horizontale suit la largeur : sur un ecran etroit elle serre, sinon la carte
         deborde du cadre et la moitie des idees se retrouve hors de vue. */
      A.vx+=(L/2-A.x)*kx*alpha; A.vy+=(H/2-A.y)*0.055*alpha;
      for(j=i+1;j<n.length;j++){
        B=n[j]; dx=B.x-A.x; dy=B.y-A.y;
        d=Math.sqrt(dx*dx+dy*dy)||0.01;
        mini=A.r+B.r+10;
        if(d<mini){ f=(mini-d)/d*0.5; A.vx-=dx*f; A.vy-=dy*f; B.vx+=dx*f; B.vy+=dy*f }
        else if(d<340){ f=150*alpha/(d*d); A.vx-=dx*f; A.vy-=dy*f; B.vx+=dx*f; B.vy+=dy*f }
        /* l'etiquette est bien plus large que la bulle : tant que deux paves de texte
           se recouvrent, on les separe par le plus petit deplacement possible, sinon
           on ne sait plus quel titre va avec quel cercle */
        px=(A.dx+B.dx)-Math.abs(dx);
        py=(A.dy+B.dy)-Math.abs(dy);
        if(px>0 && py>0){
          if(px<py){ s=(dx<0?-1:1)*px*0.14; A.vx-=s; B.vx+=s }
          else{ s=(dy<0?-1:1)*py*0.14; A.vy-=s; B.vy+=s }
        }
      }
    }
    mem.forEach(function(m){
      var cx=0,cy=0;
      m.noeuds.forEach(function(x){ cx+=x.x; cy+=x.y });
      cx/=m.noeuds.length; cy/=m.noeuds.length;
      m.noeuds.forEach(function(x){ x.vx+=(cx-x.x)*alpha*0.22; x.vy+=(cy-x.y)*alpha*0.22 });
      n.forEach(function(x){                       /* les autres contournent la membrane */
        if(dansMem[x.cle]===m) return;
        var dx=x.x-m.cx, dy=x.y-m.cy;
        var d=Math.sqrt(dx*dx+dy*dy)||1, min=m.R+x.r+10;
        if(d<min){ var k=(min-d)/d*alpha*1.1; x.vx+=dx*k; x.vy+=dy*k }
      });
    });
    n.forEach(function(p){
      if(p.fx!==null){ p.x=p.fx; p.y=p.fy; p.vx=0; p.vy=0; return }
      p.vx*=0.6; p.vy*=0.6; p.x+=p.vx; p.y+=p.vy;
      /* on borne sur l'encombrement, etiquette comprise : borner sur le rayon laissait
         les titres deborder du cadre sur un ecran etroit */
      p.x=Math.max(Math.min(p.dx,L/2),Math.min(L-Math.min(p.dx,L/2),p.x));
      p.y=Math.max(p.r+6,Math.min(H-p.r-21,p.y));   /* 21 : ligne d'etiquette et jambages */
    });
  }

  /* --- la boucle : alpha decroit jusqu'a extinction, comme une simulation d3 --- */
  var alpha=Object.keys(posIdees).length?0.35:1, cible=0, vivant=true, trame=null;
  function image(){
    if(!vivant || !svg.isConnected){ vivant=false; return }
    alpha+=(cible-alpha)*0.0228;
    pas(alpha); poser();
    if(alpha<0.004 && cible===0){ vivant=false; trame=null; return }
    trame=requestAnimationFrame(image);
  }
  simIdees={
    stop:function(){ vivant=false; if(trame) cancelAnimationFrame(trame) },
    reveiller:function(a){
      alpha=Math.max(alpha,a||0.3);
      if(!vivant){ vivant=true; image() }
    },
    tenir:function(a){ cible=a||0 },
    noeuds:n, svg:svg
  };
  if(sobre()){                       /* mouvement reduit : on converge hors ecran et on pose */
    var t; for(t=0;t<340;t++) pas(Math.max(0.03,alpha*=0.977));
    poser();
  }else image();
  appliquerVueIdees();
  brancherGestes(svg,racine,n);
}
function appliquerVueIdees(){
  var svg=$("#idSvg"); if(!svg) return;
  var g=svg.firstChild; if(!g) return;
  g.setAttribute("transform","translate("+vueIdeesT.x.toFixed(1)+","+vueIdeesT.y.toFixed(1)
    +") scale("+vueIdeesT.k.toFixed(3)+")");
}
function zoomIdees(fact,cx,cy){
  var svg=$("#idSvg"); if(!svg) return;
  var r=svg.getBoundingClientRect();
  var vb=(svg.getAttribute("viewBox")||"0 0 1 1").split(" ");
  var ech=(+vb[2]||r.width)/(r.width||1);      /* le viewBox peut differer des pixels reels */
  if(cx===undefined){ cx=r.width/2; cy=r.height/2 }
  var ux=cx*ech, uy=cy*ech;                     /* point vise, en unites du viewBox */
  var k2=Math.max(0.4,Math.min(3,vueIdeesT.k*fact));
  vueIdeesT.x=ux-(ux-vueIdeesT.x)*(k2/vueIdeesT.k);
  vueIdeesT.y=uy-(uy-vueIdeesT.y)*(k2/vueIdeesT.k);
  vueIdeesT.k=k2;
  appliquerVueIdees();
}
function razVueIdees(){ vueIdeesT={x:0,y:0,k:1}; appliquerVueIdees() }
/** Glisser une bulle, faire glisser le fond, zoomer : trois gestes sur le meme pointeur.
    La capture du pointeur n'est prise qu'une fois le glisser avere : prise des l'appui,
    elle redirigerait l'evenement « click » vers le SVG et le clic de selection serait perdu. */
function brancherGestes(svg,racine,n){
  var prise=null,depart=null,bouge=0,dernier=null,capte=false,pid=null;
  function unites(cx,cy){
    var r=svg.getBoundingClientRect();
    var vb=(svg.getAttribute("viewBox")||"0 0 1 1").split(" ");
    var ech=(+vb[2]||r.width)/(r.width||1);   /* le viewBox ne vaut pas les pixels reels */
    return {x:((cx-r.left)*ech-vueIdeesT.x)/vueIdeesT.k,
            y:((cy-r.top)*ech-vueIdeesT.y)/vueIdeesT.k, ech:ech};
  }
  svg.addEventListener("pointerdown",function(e){
    if(e.button) return;
    var g=e.target.closest?e.target.closest("[data-bulle],[data-cristal]"):null;
    bouge=0; capte=false; pid=e.pointerId;
    dernier={x:e.clientX,y:e.clientY};
    prise=null; depart=null;
    if(g){
      var id=g.getAttribute("data-bulle")||g.getAttribute("data-cristal");
      var cle=(g.getAttribute("data-bulle")?"i:":"u:")+id;
      n.forEach(function(p){ if(p.cle===cle) prise=p });
    }
    if(!prise){
      var u=unites(e.clientX,e.clientY);
      depart={x:e.clientX,y:e.clientY,tx:vueIdeesT.x,ty:vueIdeesT.y,ech:u.ech};
    }
  });
  svg.addEventListener("pointermove",function(e){
    if(!prise && !depart) return;
    bouge+=Math.abs(e.clientX-dernier.x)+Math.abs(e.clientY-dernier.y);
    dernier={x:e.clientX,y:e.clientY};
    if(bouge<=3) return;                       /* en deca, c'est encore un clic */
    if(!capte){
      capte=true;
      try{ svg.setPointerCapture(pid) }catch(x){}
      if(prise && simIdees){ prise.fx=prise.x; prise.fy=prise.y; simIdees.tenir(0.25) }
      if(depart) svg.classList.add("saisi");
    }
    if(prise){
      var u=unites(e.clientX,e.clientY);
      prise.fx=u.x; prise.fy=u.y;
      if(simIdees) simIdees.reveiller(0.25);
    }else{
      vueIdeesT.x=depart.tx+(e.clientX-depart.x)*depart.ech;
      vueIdeesT.y=depart.ty+(e.clientY-depart.y)*depart.ech;
      appliquerVueIdees();
    }
  });
  function fin(){
    if(prise && capte){
      prise.fx=null; prise.fy=null;
      if(simIdees){ simIdees.tenir(0); simIdees.reveiller(0.2) }
    }
    glisseIdee=capte;                          /* un glisser avere : le clic qui suit n'en est pas un */
    if(glisseIdee) setTimeout(function(){ glisseIdee=false },0);
    if(capte){ try{ svg.releasePointerCapture(pid) }catch(x){} }
    prise=null; depart=null; capte=false; bouge=0;
    svg.classList.remove("saisi");
  }
  svg.addEventListener("pointerup",fin);
  svg.addEventListener("pointercancel",fin);
  svg.addEventListener("wheel",function(e){
    /* sans Ctrl, la molette fait defiler la page comme partout ailleurs ;
       le pincement du pave tactile arrive justement avec ctrlKey */
    if(!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    var r=svg.getBoundingClientRect();
    zoomIdees(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);
  },{passive:false});
  svg.addEventListener("dblclick",function(e){ e.preventDefault() });
}

/* Guillemets courbes : un copier-coller passe souvent par un rendu typographique qui
   remplace " par “ et ”. JSON les refuse. On ne touche qu'aux guillemets DOUBLES :
   l'apostrophe courbe ’ est une vraie apostrophe francaise au milieu du texte, et les
   chevrons « » sont de la ponctuation, jamais des delimiteurs. */
var GUILLEMETS_COURBES=/[“”‟″〝〞]/g;
function estGuillemet(c){
  return c==='"' || c==="“" || c==="”" || c==="‟"
      || c==="″" || c==="〝" || c==="〞";
}
/** Decoupe la chaine en blocs { ... } equilibres, en ignorant les accolades du texte. */
function blocsAccolades(s){
  var l=[],prof=0,deb=-1,dansTexte=false,ech=false,i,c;
  for(i=0;i<s.length;i++){
    c=s.charAt(i);
    if(dansTexte){
      if(ech){ ech=false; continue }
      if(c==="\\"){ ech=true; continue }
      if(estGuillemet(c)) dansTexte=false;
      continue;
    }
    if(estGuillemet(c)){ dansTexte=true; continue }
    if(c==="{"){ if(prof===0) deb=i; prof++ }
    else if(c==="}" && prof>0){
      prof--;
      if(prof===0 && deb>=0){ l.push(s.slice(deb,i+1)); deb=-1 }
    }
  }
  return l;
}
/** Enleve une virgule qui traine avant une fermeture, hors chaines de caracteres. */
function sansVirguleFinale(s){
  var out="",dansTexte=false,ech=false,i,c,j,d;
  for(i=0;i<s.length;i++){
    c=s.charAt(i);
    if(dansTexte){
      out+=c;
      if(ech){ ech=false; continue }
      if(c==="\\"){ ech=true; continue }
      if(c==='"') dansTexte=false;
      continue;
    }
    if(c==='"'){ dansTexte=true; out+=c; continue }
    if(c===","){
      for(j=i+1;j<s.length;j++){ d=s.charAt(j); if(d!==" "&&d!=="\n"&&d!=="\r"&&d!=="\t") break }
      if(s.charAt(j)==="}" || s.charAt(j)==="]") continue;   /* virgule en trop : on la saute */
    }
    out+=c;
  }
  return out;
}
var dernierSoucisJson="";
/** Extrait l'objet JSON d'une reponse, meme recopiee avec sa mise en forme.
    On tente d'abord le texte tel quel : une reponse valide n'est jamais retouchee. */
function jsonDeReponse(t){
  var s=String(t||"").replace(/```[a-z]*/gi,"").replace(/```/g,"");
  dernierSoucisJson="";
  var blocs=blocsAccolades(s);
  if(!blocs.length){
    var a=s.indexOf("{"), b=s.lastIndexOf("}");
    if(a<0 || b<=a){
      dernierSoucisJson="aucun objet JSON (pas d’accolades) dans ce que vous avez collé";
      return null;
    }
    blocs=[s.slice(a,b+1)];
  }
  var dernier="";
  /* du dernier bloc vers le premier : si vous avez colle la demande ET la reponse,
     c'est la reponse qui compte, et elle vient en dernier */
  for(var k=blocs.length-1;k>=0;k--){
    var essais=[blocs[k],
      blocs[k].replace(GUILLEMETS_COURBES,'"'),
      sansVirguleFinale(blocs[k].replace(GUILLEMETS_COURBES,'"')
        .replace(/[   ]/g," "))];
    for(var e=0;e<essais.length;e++){
      try{
        var o=JSON.parse(essais[e]);
        if(o && typeof o==="object" && !estTableau(o)) return o;
      }catch(x){ dernier=x.message||String(x) }
    }
  }
  dernierSoucisJson=dernier;
  return null;
}
function integrerCristallisation(){

/** Une idee unifiee devient une activite ; ses premieres etapes deviennent des taches. */
function convertirIdeeU(id,cle){
  var u=ideeUPar(id); if(!u) return;
  var K=catParCle(cle);
  if(!K){ toast("Créez d’abord une catégorie d’activité",true); return }
  var c={id:uid(),categorie:K.cle,libelle:u.titre.slice(0,200),reference:"",
    date:"",heure:"",duree:0,type:"",tiers:"",contact_nom:"",contact_tel:"",
    commune:"",adresse:"",priorite:"normale",eprouvante:false,
    statut:(jeuStatuts(K.statuts)[0]||["",""])[0],
    commentaire:[u.synthese,
      u.objectifs.length?"Objectifs :\n• "+u.objectifs.join("\n• "):"",
      u.vigilance.length?"Vigilance :\n• "+u.vigilance.join("\n• "):""
    ].filter(Boolean).join("\n\n"),
    cree_le:new Date().toISOString(), idee_id:u.id};
  if(K.miroir) c[K.miroir]=c.statut;
  D.chantiers.push(c);
  /* une tache par premiere etape : le travail arrive deja decoupe dans « En attente » */
  var base=new Date(); base.setDate(base.getDate()+7);
  u.etapes.forEach(function(t,k){
    var d=new Date(base.getTime()); d.setDate(d.getDate()+k);
    D.notes.push({id:uid(),date:auj(),heure:hNow(),type:"",
      chantier_id:c.id,rubrique_id:"",chantier_ref:refDossier(c),
      contenu:"",duree:0,suite:{texte:t,echeance:iso(d),fait:false}});
  });
  u.statut="convertie"; u.activite_id=c.id;
  fermerModale(); modifie(); rendre();
  toast(K.lib+" créé"+(K.genre==="m"?"":"e")+(u.etapes.length?" · "+u.etapes.length+" tâche(s)":""));
  editerChantier(c.id);
}

var splashFini=false;
function fermerSplash(){
  if(splashFini) return;
  splashFini=true;
  var e=$("#splash");
  if(!e) return;
  e.classList.add("sortie");
  setTimeout(function(){ if(e.parentNode) e.parentNode.removeChild(e) },340);
}
function jouerSplash(){
  var e=$("#splash");
  if(!e) return;
  if(D.parametres.splash===false){ splashFini=true; e.parentNode.removeChild(e); return }
  var nom=String(D.parametres.nom_app||NOM_DEFAUT);
  $("#spLogo").innerHTML=iconeSVG("#191C1B","#D8232A","#FBFBF9");
  var fin=function(){
    $("#spNom").innerHTML=esc(nom).replace(/\s+/g,'<span class="pt">\u00b7</span>');
    $("#spSous").style.opacity="1";
    setTimeout(fermerSplash,420);
  };
  var reduit = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduit){ fin(); return }
  var cible=nom.toUpperCase().split(""),fixe=0,n=$("#spNom");
  var pas=Math.max(34,Math.floor(760/Math.max(cible.length,1)));
  var it=setInterval(function(){
    if(splashFini){ clearInterval(it); return }
    var out="",i;
    for(i=0;i<cible.length;i++){
      if(i<fixe) out += (cible[i]===" ") ? '<span class="pt">\u00b7</span>' : esc(cible[i]);
      else out += '<span class="bit">'+(Math.random()<0.5?"0":"1")+'</span>';
    }
    n.innerHTML=out;
    if(fixe++>cible.length){ clearInterval(it); fin() }
  },pas);
  setTimeout(fermerSplash,3200);          /* filet de securite : jamais bloquant */
  e.addEventListener("click",fermerSplash);
}
