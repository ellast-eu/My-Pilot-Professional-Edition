<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Pilot Professional Edition</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
<style>
:root{
  --beton:#E6E7E3;
  --beton-2:#D6D8D1;
  --papier:#FBFBF9;
  --encre:#191C1B;
  --encre-2:#5C625E;
  --encre-3:#8B918C;
  --trait:rgba(25,28,27,.16);
  --rouge:#D8232A;
  --jaune:#E8A400;
  --vert:#1F7A4D;
  --ardoise:#2B4C6F;
  --prune:#7A2E4E;
  --sarcelle:#0F6E78;
  --ocre:#8A6320;
  --display:"Bahnschrift","DIN Alternate","Franklin Gothic Medium","Segoe UI",system-ui,sans-serif;
  --corps:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --data:"Consolas","SFMono-Regular","Menlo",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--beton);
  color:var(--encre);
  font-family:var(--corps);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.dsp{
  font-family:var(--display);
  font-variation-settings:"wght" 600,"wdth" 87.5;
  font-weight:600;
  letter-spacing:.02em;
  margin:0;
}
.mono{font-family:var(--data);font-size:.92em;font-variant-numeric:tabular-nums}

/* ---------- rapport imprimable ---------- */
#impression{display:none}
@media print{
  html,body{background:#fff !important}
  body > *{display:none !important}
  #impression{display:block !important;background:#fff;color:#191C1B;font-family:var(--corps)}
  @page{size:A4 portrait;margin:16mm 18mm 14mm}
  .rp-page{page-break-after:always}
  .rp-page:last-child{page-break-after:auto}
  /* sans cela, Edge et Chrome suppriment tous les aplats a l'impression */
  #impression,#impression *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  #impression h2,.rp-tete{break-inside:avoid;page-break-inside:avoid}
  table.rp-tab tr.nul td{color:#8B918C}
  .rp-flux{break-inside:avoid;page-break-inside:avoid}
  /* un titre ne reste jamais seul en bas de page, son introduction non plus */
  #impression h2,p.rp-i{break-after:avoid;page-break-after:avoid}
  /* les longues listes se coupent entre deux lignes plutot que de sauter en bloc :
     une seule rubrique de trop renvoyait tout le tableau a la page suivante et
     laissait une demi-page blanche. */
  /* Un tableau du rapport est toujours plafonne : il tient sur une page. Le laisser se
     couper produisait une page entiere pour une seule ligne orpheline. S'il ne tient
     plus, c'est le tableau entier qui passe — lisible, au moins. */
  table.rp-rep,table.rp-tab,table.rp-dense,.rp-detail{break-inside:avoid;page-break-inside:avoid}
  table.rp-rep tr,table.rp-tab tr,table.rp-dense tr{break-inside:avoid;page-break-inside:avoid}
  .rp-cles{break-inside:avoid;page-break-inside:avoid}
  /* une prose plus longue qu'une page doit couler : la faire sauter en entier
     laisserait une page a moitie vide derriere elle */
  .rp-saisie{break-inside:auto;page-break-inside:auto}
}
.rp-tete{border-bottom:2px solid var(--rouge);padding-bottom:7px;margin-bottom:5px;display:flex;align-items:flex-end;gap:14px}
.rp-tete .qui{flex:1}
.rp-nom{font-family:var(--display);font-size:17px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.rp-fonc{font-size:11.5px;color:#4A514C;margin-top:1px}
.rp-per{text-align:right;font-family:var(--data);font-size:10.5px;color:#4A514C;line-height:1.55}
.rp-per b{display:block;font-family:var(--display);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:#191C1B}
.rp-st{font-family:var(--data);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#878D88;margin-bottom:13px}
/* Le rythme a ete resserre en 3.30.1 : un portefeuille reel remplit tous les plafonds
   et la page depassait d'une ligne. Mieux vaut un interligne plus serre qu'une donnee
   retiree — et qu'un fragment orphelin sur une page de plus. */
#impression h2{font-family:var(--display);font-size:12px;letter-spacing:.11em;text-transform:uppercase;
  margin:11px 0 5px;padding-bottom:2px;border-bottom:1px solid #191C1B;font-weight:700}
#impression p.rp-i{font-size:10.5px;color:#4A514C;margin:0 0 7px;line-height:1.45}
.rp-cles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rp-cle{border:1px solid #C8CCC7;border-top:3px solid #191C1B;padding:8px 9px 9px}
.rp-cle .v{font-family:var(--display);font-size:24px;line-height:1;font-weight:700}
.rp-cle .l{font-size:9.5px;color:#4A514C;margin-top:4px;line-height:1.3}
.rp-cle .e{font-family:var(--data);font-size:9.5px;margin-top:5px;padding-top:4px;border-top:1px dotted #C8CCC7}
table.rp-rep{width:100%;border-collapse:collapse;font-size:10.5px}
table.rp-rep td{padding:2.2px 0;vertical-align:middle}
table.rp-rep td.l{width:38%;padding-right:8px}
table.rp-rep td.b{width:44%}
table.rp-rep td.v{width:18%;text-align:right;font-family:var(--data);font-size:10px;white-space:nowrap}
.rp-piste{display:block;height:9px;background:#D8DBD7;position:relative}
.rp-piste i{position:absolute;left:0;top:0;bottom:0;display:block}
.rp-t1{background:#3A403C}.rp-t2{background:#6E746F}.rp-t3{background:#A8ADA8}
.rp-t4{background:repeating-linear-gradient(45deg,#6E746F 0 3px,#D8DBD7 3px 6px)}
.rp-t5{background:repeating-linear-gradient(90deg,#3A403C 0 2px,transparent 2px 5px)}
table.rp-tab{width:100%;border-collapse:collapse;font-size:10.5px}
table.rp-tab tr.nul td{color:#8B918C}
.rp-flux{margin-top:10px;padding-top:8px;border-top:1px solid #191C1B}
.rp-flux-t{font-family:var(--display);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:#5C625E;margin-bottom:5px}
table.rp-tab th{font-family:var(--display);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  text-align:left;border-bottom:1px solid #191C1B;padding:3px 6px 2px;color:#4A514C}
table.rp-tab td{padding:2.6px 6px;border-bottom:1px solid #C8CCC7}
table.rp-tab td.n{text-align:right;font-family:var(--data);font-size:10px}
table.rp-dense td{padding:1.9px 6px;font-size:10px;line-height:1.3}
table.rp-dense tr.tete td{padding-top:6px}
.rp-duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rp-saisie{border:1px solid #C8CCC7;border-left:3px solid #191C1B;padding:9px 11px;font-size:10.5px;
  line-height:1.55;white-space:pre-wrap;min-height:11mm}
.rp-saisie.vide{color:#878D88;font-style:italic}
.rp-mention{font-family:var(--data);font-size:8.5px;color:#878D88;margin-top:9px;line-height:1.5}
.rp-l{margin:6px 0 0 0;padding-left:16px;font-size:10.5px;line-height:1.55;color:#2B302C}
.rp-l li{margin-bottom:3px}

/* ---------- ecran de demarrage ---------- */
.splash{
  position:fixed;inset:0;z-index:200;background:var(--encre);
  display:grid;place-items:center;cursor:pointer;transition:opacity .32s ease-out;
}
.splash.sortie{opacity:0;pointer-events:none}
.sp-in{text-align:center;padding:20px}
.sp-logo{display:block;width:40px;height:40px;margin:0 auto 14px}
.sp-logo svg{display:block;width:100%;height:100%}
.sp-nom{
  font-family:var(--display);font-variation-settings:"wght" 700,"wdth" 75;
  font-size:34px;letter-spacing:.16em;text-transform:uppercase;color:#F2F3F1;white-space:nowrap;min-height:40px;
}
.sp-nom .bit{font-family:var(--data);color:var(--rouge);letter-spacing:.16em}
.sp-nom .pt{color:var(--rouge)}
.sp-sous{
  font-family:var(--data);font-size:11px;letter-spacing:.22em;color:#6F756F;
  text-transform:uppercase;margin-top:9px;opacity:0;transition:opacity .3s;
}
@media(max-width:480px){.sp-nom{font-size:24px;letter-spacing:.12em}}
@media (prefers-reduced-motion:reduce){.splash{transition:none}}

/* ---------- barre d'etat ---------- */
header{
  position:sticky;top:0;z-index:40;
  background:var(--encre);color:#F2F3F1;
  border-bottom:3px solid var(--rouge);
}
.bandeau{display:flex;align-items:center;gap:16px;padding:9px 18px;flex-wrap:wrap}
.logo{width:26px;height:26px;flex:none;display:block;margin-right:-2px}
.logo svg{display:block;width:100%;height:100%}
.marque{font-family:var(--display);font-variation-settings:"wght" 700,"wdth" 75;
  font-size:19px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.marque span{color:var(--rouge)}
.version{
  font-family:var(--data);font-size:11px;color:#8C938E;
  border:1px solid #3A403C;padding:1px 5px;border-radius:2px;margin-left:-8px;letter-spacing:.02em;
}
.jour{font-family:var(--data);font-size:13px;color:#B9BEBA;text-transform:capitalize}
.etat{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;font-family:var(--data);
  flex-wrap:wrap;justify-content:flex-end;min-width:0}
.pastille{width:9px;height:9px;border-radius:50%;background:var(--vert);flex:none}
.pastille.sale{background:var(--jaune);animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.etat-txt{color:#B9BEBA}
.etat.sale .etat-txt{color:#FFD466}
/* Sur une fenetre etroite la zone d'etat passait a la ligne et « flottait » a droite sous la
   date, les boutons changeant de ligne selon la longueur du texte. Largeurs reservees pour
   que rien ne bouge quand l'etat change, puis une deuxieme ligne franche. */
.etat-txt{white-space:nowrap;display:inline-block;min-width:26ch;font-variant-numeric:tabular-nums}
.etat .b{flex:none}
nav{scrollbar-width:thin;scrollbar-color:#4A514C transparent}
nav::-webkit-scrollbar{height:4px}
nav::-webkit-scrollbar-thumb{background:#4A514C}
@media (max-width:1180px){
  .bandeau{row-gap:6px;padding:8px 14px}
  .jour{margin-left:auto}
  /* « nowrap » ici faisait deborder la ligne d'etat des qu'un bouton s'ajoutait : elle
     ne pouvait pas ceder. Elle passe a la ligne, le groupe de boutons restant soude. */
  .etat{flex:1 0 100%;margin-left:0;justify-content:flex-start;flex-wrap:wrap;gap:10px;row-gap:6px;
    border-top:1px solid #2E3430;padding-top:6px}
  .etat-btns{margin-left:auto}
}
@media (max-width:640px){
  .marque{font-size:15px;letter-spacing:.08em;white-space:normal}
  .version{display:none}
  .jour{flex-basis:100%;margin-left:0;font-size:12px}
  .etat{flex-wrap:wrap;row-gap:6px}
  .etat-txt{min-width:0}
  .cd-pause{min-width:0}
  nav button{padding:8px 10px;font-size:12.5px}
}

nav{display:flex;gap:2px;padding:0 12px;overflow-x:auto}
nav button{
  appearance:none;background:transparent;border:0;color:#9AA09B;cursor:pointer;
  font-family:var(--display);font-variation-settings:"wght" 600,"wdth" 87.5;
  font-size:13.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:9px 14px;border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap;
}
nav button:hover{color:#F2F3F1}
nav button.bloque{opacity:.35;cursor:not-allowed}
nav button.bloque:hover{color:#9AA09B}
nav button[aria-current="true"]{color:#fff;border-bottom-color:var(--rouge)}

/* ---------- structure ---------- */
main{max-width:1240px;margin:0 auto;padding:20px 18px 80px}
.duo{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start}
.duo>*{min-width:0}
.bloc,.bloc-corps,.trace,.piquet,.chantier{min-width:0}
@media(max-width:900px){.duo{grid-template-columns:1fr}}
.bloc{background:var(--papier);border:1px solid var(--trait);border-radius:2px}
.bloc-tete{
  display:flex;align-items:baseline;gap:10px;padding:11px 14px;border-bottom:1px solid var(--trait);
  background:linear-gradient(var(--papier),#F3F3F0);
}
.bloc-tete h2{font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.compte{font-family:var(--data);font-size:12px;color:var(--encre-3);margin-left:auto}
.bloc-corps{padding:14px}
.vide{padding:26px 16px;text-align:center;color:var(--encre-2);font-size:14px}
.vide b{display:block;font-family:var(--display);font-size:15px;color:var(--encre);margin-bottom:4px}

/* ---------- signature : trace de piquetage ---------- */
/* geometrie : heure 0>44 | croix 52>67 (axe 59.5) | carte a partir de 79 */
.trace{position:relative;padding-left:79px}
.trace:before{
  content:"";position:absolute;left:59px;top:4px;bottom:4px;width:1px;
  background:repeating-linear-gradient(var(--encre-3) 0 5px,transparent 5px 10px);
}
.piquet{position:relative;margin-bottom:12px}
.piquet:last-child{margin-bottom:0}
.piquet .h{
  position:absolute;left:-79px;top:10px;width:44px;text-align:right;
  font-family:var(--data);font-size:13px;line-height:1.1;color:var(--encre-2);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.piquet .croix{
  position:absolute;left:-27px;top:11px;width:15px;height:15px;
  border:1.5px solid var(--encre);background:var(--papier);
  display:grid;place-items:center;font-size:10px;line-height:1;color:var(--encre);
}
@media(max-width:480px){
  .trace{padding-left:66px}
  .trace:before{left:49px}
  .piquet .h{left:-66px;width:34px;font-size:12px}
  .piquet .croix{left:-24px}
}
.piquet[data-statut="realise"] .croix,.piquet[data-statut="termine"] .croix{background:var(--vert);border-color:var(--vert);color:#fff}
.piquet[data-statut="annule"] .croix,.piquet[data-statut="reporte"] .croix{border-color:var(--encre-3);color:var(--encre-3)}
.piquet[data-statut="en_cours"] .croix{background:var(--rouge);border-color:var(--rouge);color:#fff}
.maintenant{position:relative;height:0;margin:3px 0 17px}
.maintenant:before{
  content:"";position:absolute;left:-27px;right:0;top:0;height:2px;background:var(--rouge);
}
.maintenant span{
  position:absolute;left:-79px;top:-8px;width:44px;text-align:right;
  font-family:var(--data);font-size:11px;color:#fff;background:var(--rouge);padding:1px 3px;
}
@media(max-width:480px){
  .maintenant:before{left:-24px}
  .maintenant span{left:-66px;width:34px}
}

/* ---------- carte chantier ---------- */
.chantier{
  border:1px solid var(--trait);border-left:4px solid var(--ardoise);
  background:#fff;padding:10px 12px;cursor:pointer;transition:border-color .12s,transform .12s;
}
.chantier:hover{border-color:var(--encre-3);border-left-color:var(--rouge)}
.chantier[data-priorite="haute"]{border-left-color:var(--rouge)}
.chantier[data-statut="realise"],.chantier[data-statut="termine"]{opacity:.62}
.chantier[data-statut="annule"]{opacity:.45}
.chantier .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.chantier .lib{font-family:var(--display);font-size:15.5px;font-variation-settings:"wght" 600,"wdth" 87.5}
.chantier .meta{color:var(--encre-2);font-size:13px;margin-top:3px}
.chantier .ref{font-family:var(--data);font-size:11.5px;color:var(--encre-3)}
td .ref{font-family:var(--data);font-size:11px;color:var(--encre-3);margin-top:1px;line-height:1.45}
.avanc{font-size:11.5px;color:var(--encre-2);margin-top:2px;line-height:1.45}

.etiq{
  display:inline-block;max-width:100%;white-space:normal;font-family:var(--data);font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;padding:1px 6px;border:1px solid var(--trait);color:var(--encre-2);
  background:#F1F2EF;white-space:nowrap;
}
.etiq.rouge{color:#fff;background:var(--rouge);border-color:var(--rouge)}
.etiq.vert{color:#fff;background:var(--vert);border-color:var(--vert)}
.etiq.jaune{color:#4A3600;background:var(--jaune);border-color:var(--jaune)}
.etiq.gris{color:var(--encre-3)}
.etiq.brut{text-transform:none;letter-spacing:0;font-size:11px}

/* ---------- notes ---------- */
.saisie textarea{
  width:100%;min-height:74px;resize:vertical;padding:9px 10px;
  border:1px solid var(--trait);border-radius:2px;font-family:var(--corps);font-size:14.5px;
  background:#fff;color:var(--encre);
}
.saisie textarea:focus{outline:2px solid var(--rouge);outline-offset:-1px}
.ligne{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.note{border-top:1px dashed var(--trait);padding:10px 0}
.note:first-child{border-top:0;padding-top:2px}
.note .h{font-family:var(--data);font-size:12px;color:var(--encre-3)}
.note .txt{white-space:pre-wrap;margin-top:2px}
.note .lien{font-size:12.5px;color:var(--ardoise)}
.suite{
  margin-top:6px;padding:6px 9px;background:#FFF8E4;border-left:3px solid var(--jaune);font-size:13.5px;
}
.suite.retard{background:#FDECEC;border-left-color:var(--rouge)}
.suite.faite{background:#EFF6F1;border-left-color:var(--vert);opacity:.7;text-decoration:line-through}

/* ---------- points de vigilance ---------- */
.vigi{
  display:flex;gap:10px;align-items:flex-start;background:#fff;
  border:1px solid var(--trait);border-left:4px solid var(--ardoise);
  padding:9px 11px;margin-bottom:8px;
}
.vigi:last-child{margin-bottom:0}
.vigi[data-niveau="attention"]{border-left-color:var(--jaune);background:#FFFCF3}
.vigi[data-niveau="critique"]{border-left-color:var(--rouge);background:#FDF2F2}
.vigi .sig{
  font-family:var(--display);font-size:15px;line-height:1.2;flex:none;width:18px;text-align:center;color:var(--ardoise);
}
.vigi[data-niveau="attention"] .sig{color:var(--c-jaune,#B07E00)}
.vigi[data-niveau="critique"] .sig{color:var(--rouge)}
.vigi .corps{flex:1;min-width:0}
.vigi .txt{white-space:pre-wrap;font-size:14.5px}
.vigi .sous{font-size:11.5px;color:var(--encre-3);font-family:var(--data);margin-top:2px}
.vigi .outils{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.vigi.retard{border-left-style:dashed;border-left-width:5px;box-shadow:inset 0 0 0 1px rgba(216,35,42,.14)}
.vigi .depasse{
  display:inline-block;font-family:var(--data);font-size:10.5px;letter-spacing:.04em;
  color:#fff;background:var(--rouge);padding:1px 5px;margin-left:4px;text-transform:none;
}

/* ---------- compteur de traitement ---------- */
.cpt-tete{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.cpt-nb{
  font-family:var(--display);font-variation-settings:"wght" 700,"wdth" 75;
  font-size:46px;line-height:.9;letter-spacing:-.01em;font-variant-numeric:tabular-nums;
}
.cpt-obj{font-family:var(--data);font-size:14px;color:var(--encre-2);padding-bottom:5px}
.cpt-etat{margin-left:auto;text-align:right;font-family:var(--data);font-size:12px;color:var(--encre-2);padding-bottom:4px}
.jauge{height:9px;background:var(--beton-2);border:1px solid var(--trait);margin:11px 0 4px;position:relative;overflow:hidden}
.jauge i{display:block;height:100%;background:var(--ardoise);transition:width .25s}
.jauge.atteint i{background:var(--vert)}
.jauge b{
  position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--rouge);
  font-size:0;
}
.cpt-detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:12px}
@media(max-width:620px){.cpt-detail{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cpt-detail div{border:1px solid var(--trait);background:#fff;padding:6px 9px}
.cpt-detail span{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--encre-3);font-family:var(--display)}
.cpt-detail b{font-family:var(--data);font-size:15px;font-weight:normal;font-variant-numeric:tabular-nums}
.reglette{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--encre-2);flex-wrap:wrap}
.reglette input{width:62px;text-align:center}

.sess{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border:1px solid var(--trait);background:#fff;padding:8px 10px;margin-top:12px;
}
.sess.active{border-color:var(--rouge);background:#FDF4F4}
.sess .voyant{width:9px;height:9px;border-radius:50%;background:var(--encre-3);flex:none}
.sess.active .voyant{background:var(--rouge);animation:pulse 1.8s infinite}
.sess .chrono{font-family:var(--data);font-size:14px;font-variant-numeric:tabular-nums}
.sess .chrono b{font-weight:normal;color:var(--encre-2)}
.sess .bt{margin-left:auto}
.creneaux{font-family:var(--data);font-size:11.5px;color:var(--encre-3);margin-top:5px;line-height:1.6}

.cd-pause{white-space:nowrap;display:inline-block;min-width:16ch;font-variant-numeric:tabular-nums;
  font-family:var(--data);font-size:11.5px;color:#8C938E;cursor:pointer;
  border-bottom:1px dotted #4A514C;padding-bottom:1px;white-space:nowrap;
}
.cd-pause:hover{color:#fff;border-bottom-color:#8C938E}
.cd-pause.proche{color:#FFD466}
.cd-pause:empty{display:none}
#btnPause,#btnAide,#btnApropos,#btnAccomp{border-color:#4A514C;color:#C9CFC9;background:transparent}
#btnPause:hover,#btnAide:hover,#btnApropos:hover,#btnAccomp:hover{border-color:#8C938E;color:#fff;opacity:1}
/* les trois boutons forment un bloc : en fenetre etroite ils passent a la ligne ensemble,
   au lieu de laisser Pause seule en bas */
.etat-btns{display:flex;align-items:center;gap:8px;flex:none;margin-right:2px}
/* Enregistrer passe en « creux » quand l'enregistrement automatique rend le clic inutile.
   Sans cette regle il heritait du creux clair : encre sur encre, invisible sur le bandeau. */
#btnEnr.creux{border-color:#4A514C;color:#C9CFC9;background:transparent}
#btnEnr.creux:hover{border-color:#8C938E;color:#fff;opacity:1}
.ap-court{display:none}
/* en fenetre etroite le libelle complet poussait Pause a la ligne suivante */
@media (max-width:760px){ .ap-long{display:none} .ap-court{display:inline} }
/* bandeau de la fenetre À propos : meme grammaire que l'ecran d'ouverture */
.ap-ban{
  margin:-16px -16px 16px;padding:22px 16px 18px;background:var(--encre);text-align:center;
}
.ap-logo{display:block;width:34px;height:34px;margin:0 auto 12px}
.ap-logo svg{display:block;width:100%;height:100%}
.ap-nom{
  font-family:var(--display);font-variation-settings:"wght" 700,"wdth" 75;
  font-size:27px;letter-spacing:.16em;text-transform:uppercase;color:#F2F3F1;
  white-space:nowrap;min-height:32px;overflow:hidden;
}
.ap-nom .bit{font-family:var(--data);color:var(--rouge);letter-spacing:.16em}
.ap-nom .pt{color:var(--rouge)}
.ap-sous{
  font-family:var(--data);font-size:10.5px;letter-spacing:.22em;color:#6F756F;
  text-transform:uppercase;margin-top:8px;
}
@media(max-width:480px){.ap-nom{font-size:20px;letter-spacing:.12em}}
.ap-intro{font-size:14px;line-height:1.6;margin-bottom:8px}
.ap-legal{font-family:var(--data);font-size:11.5px;color:var(--encre-3);margin-top:10px}

/* ---------- carte personnelle ---------- */
.carte-sec{margin-bottom:16px}
.carte-sec h4{
  font-family:var(--display);font-variation-settings:"wght" 600,"wdth" 87.5;font-size:13px;
  letter-spacing:.09em;text-transform:uppercase;margin:0;
  border-bottom:1px solid var(--encre);padding-bottom:3px;display:flex;align-items:baseline;gap:8px;
}
.carte-sec h4 em{font-style:normal;font-family:var(--corps);font-size:11.5px;letter-spacing:0;
  text-transform:none;color:var(--encre-2);font-weight:normal;margin-left:auto;text-align:right}
.carte-items{margin:8px 0 0}
.item{
  display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed var(--trait);font-size:14px;
;flex-wrap:wrap}
.item:last-child{border-bottom:0}
.ordre{display:flex;flex-direction:column;gap:1px;flex:none}
.fl{border:1px solid var(--trait);background:var(--papier);color:var(--encre-2);
  font-size:8px;line-height:1;padding:2px 4px;cursor:pointer;font-family:var(--corps)}
.fl:hover:not(:disabled){background:var(--beton-2);color:var(--encre)}
.fl:disabled{opacity:.28;cursor:default}
.item .dur{font-family:var(--data);font-size:11.5px;color:var(--encre-3);flex:none}
.item .txt{flex:1;min-width:0}
.item .fav{cursor:pointer;background:none;border:0;font-size:14px;line-height:1;color:var(--encre-3);padding:0 2px}
.item .fav.on{color:var(--jaune)}
.item .sup{cursor:pointer;background:none;border:0;color:var(--encre-3);font-size:13px;padding:0 2px}
.item .sup:hover{color:var(--rouge)}
.carte-vide{font-size:13px;color:var(--encre-3);padding:8px 0}

/* ---------- permanence telephonique ---------- */
.perm-off{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--encre-2)}
.rappel{
  display:flex;align-items:center;gap:9px;border:1px solid var(--trait);background:#fff;
  padding:7px 10px;margin-bottom:7px;flex-wrap:wrap;
}
.rappel .nom{
  font-family:var(--display);font-variation-settings:"wght" 600,"wdth" 87.5;
  font-size:14px;letter-spacing:.06em;flex:none;
}
.rappel .cd{font-family:var(--data);font-size:12.5px;color:var(--encre-2);font-variant-numeric:tabular-nums}
.rappel .per{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--encre-3)}
.rappel .per input{width:52px;text-align:center;padding:3px 4px}
.rappel.off{opacity:.5}
.rappel.feu{
  border-color:var(--rouge);border-left:4px solid var(--rouge);background:#FDECEC;
  animation:respire 1.6s ease-in-out infinite;
}
@keyframes respire{50%{background:#FBDCDC}}
.rappel.feu .nom{color:var(--rouge)}
.appel{padding:7px 0;border-bottom:1px dashed var(--trait);cursor:pointer;font-size:14px}
.appel:last-child{border-bottom:0}
.appel .h{font-family:var(--data);font-size:11.5px;color:var(--encre-3)}
.appel .qui{font-family:var(--display);font-variation-settings:"wght" 600,"wdth" 87.5}
.appel .obj{margin-top:1px}
.appel.asuivre{border-left:3px solid var(--jaune);padding-left:8px}
.appel.verif{border-left:3px solid #0F6E78;padding-left:9px;opacity:.92}
.appel.verif .q{font-size:13px;color:var(--encre-2);margin-top:2px}
.etiq.verif-b{color:#fff;background:#0F6E78;border-color:#0F6E78}

/* ---------- imputation et repartition ---------- */
.puce{
  appearance:none;border:1px solid var(--trait);background:#fff;color:var(--encre);
  font-family:var(--data);font-size:13px;padding:3px 10px;border-radius:2px;cursor:pointer;
}
.puce:hover{border-color:var(--encre-3)}
.puce.on{background:var(--encre);color:#fff;border-color:var(--encre)}
.puce-lbl{font-size:12px;color:var(--encre-3);font-family:var(--display);letter-spacing:.05em;text-transform:uppercase}
.rep{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:13.5px}
.rep .nom{flex:none;width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rep .bar{flex:1;height:11px;background:var(--beton-2);border:1px solid var(--trait);min-width:30px}
.rep .bar i{display:block;height:100%}
.rep .val{flex:none;font-family:var(--data);font-size:12.5px;color:var(--encre-2);
  font-variant-numeric:tabular-nums;width:56px;text-align:right}
.fam-regalien{background:var(--ardoise);color:var(--ardoise)}
.fam-support{background:var(--sarcelle);color:var(--sarcelle)}
.fam-amelioration{background:var(--prune);color:var(--prune)}
.fam-dossier{background:var(--encre-2);color:var(--encre-2)}
.note .lien.fam-regalien,.note .lien.fam-support,.note .lien.fam-amelioration{background:none}

/* ---------- fenetre de pause ---------- */
.pause-box{text-align:center;padding:26px 18px 12px}
.pause-titre{
  font-family:var(--display);font-variation-settings:"wght" 700,"wdth" 87.5;
  font-size:26px;line-height:1.2;letter-spacing:.01em;margin-bottom:6px;
}
.pause-motif{font-family:var(--data);font-size:12.5px;color:var(--encre-3);margin-bottom:26px}
.pause-zone{
  border:1px dashed var(--encre-3);background:#F7F6F1;padding:20px 16px;margin-bottom:26px;
  min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
}
.pause-lbl{
  font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--encre-2);
}
.pause-item{font-size:19px;line-height:1.35;max-width:420px}
.pause-ok{font-size:14px;padding:11px 22px;background:var(--rouge);border-color:var(--rouge)}
/* ----- fenetre de module : un .html du dossier voisin, joue dans l'application ----- */
dialog.jeu-dlg{max-width:none;width:calc(100vw - 20px);height:calc(100vh - 20px);max-height:calc(100vh - 20px)}
@supports(height:100dvh){ dialog.jeu-dlg{height:calc(100dvh - 20px);max-height:calc(100dvh - 20px)} }
.jeu-tete{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--trait);
  background:#F1F2EF;flex:0 0 auto}
.jeu-tete h3{font-size:14px;letter-spacing:.07em;text-transform:uppercase;margin:0}
.jeu-tete .chemin{font-family:var(--data);font-size:11.5px;color:var(--encre-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.jeu-tete .chrono{font-family:var(--data);font-size:15.5px;font-variant-numeric:tabular-nums;
  letter-spacing:.04em;white-space:nowrap;padding:2px 9px;color:var(--encre);flex:0 0 auto}
.jeu-tete .chrono em{font-style:normal;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--encre-3);display:block;line-height:1.1}
.jeu-tete .chrono.depasse{color:var(--rouge);font-weight:700}
.jeu-tete .chrono.depasse em{color:var(--rouge)}
.jeu-corps{flex:1 1 auto;min-height:0;position:relative;background:var(--papier)}
.jeu-corps iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#fff}
.jeu-vide{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;
  font-size:13.5px;line-height:1.6;color:var(--encre-3);pointer-events:none}
.item .mod{font-family:var(--data);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--ardoise);color:#fff;padding:2px 6px;margin-left:6px;white-space:nowrap}
.item .jouer{border:0;background:none;cursor:pointer;color:var(--ardoise);font-size:15px;padding:0 4px}
.item .jouer:hover{color:var(--rouge)}
.note .report{border-top:1px dotted var(--trait);padding-top:6px;flex-wrap:wrap;row-gap:5px}
/* ----- calendrier ----- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--trait);
  border:1px solid var(--trait)}
.cal .jn{background:var(--papier);font-family:var(--data);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--encre-3);text-align:center;padding:5px 0}
.cal .c{background:#fff;min-height:74px;padding:4px 5px 5px;cursor:pointer;position:relative;
  display:flex;flex-direction:column;gap:3px;border:0;text-align:left;font:inherit;color:inherit}
.cal .c:hover{background:#F6F7F5}
.cal .c.hors{background:#FAFBF9;color:var(--encre-3)}
.cal .c.chome{background:#EAEDE9}
.cal .c.chome.hors{background:#F2F4F1}
.cal .c .n{font-family:var(--data);font-size:12.5px;line-height:1}
.cal .c.auj .n{font-weight:700;color:var(--rouge)}
.cal .c.auj{box-shadow:inset 0 0 0 2px var(--rouge)}
.cal .c.sel{box-shadow:inset 0 0 0 2px var(--encre);background:#EFF1EE}
.cal .c.auj.sel{box-shadow:inset 0 0 0 2px var(--encre),inset 0 0 0 4px var(--rouge)}
.cal .pts{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.cal .pt{width:7px;height:7px;border-radius:50%;display:block}
.cal .pl{font-family:var(--data);font-size:9.5px;color:var(--encre-3)}
.cal .ech{font-family:var(--data);font-size:9.5px;letter-spacing:.04em;padding:1px 4px;
  background:var(--ardoise);color:#fff;align-self:flex-start;white-space:nowrap}
.cal .ech.retard{background:var(--rouge)}
.cal .c .mot{font-size:9px;color:var(--encre-3);line-height:1.15;margin-top:auto}
.cal-tete{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cal-mois{font-family:var(--display);font-size:15px;letter-spacing:.06em;text-transform:uppercase;
  font-weight:700;min-width:150px}
@media(max-width:620px){ .cal .c{min-height:58px} .cal .c .mot{display:none} }
.saisie .manque{outline:2px solid var(--rouge);outline-offset:1px;border-color:var(--rouge)}
.carte-sec h4 .quand{margin-left:auto;font-family:var(--corps);font-weight:400;
  font-size:11.5px;letter-spacing:0;text-transform:none;color:var(--encre-3)}
.carte-sec h4 .quand select{font-size:11.5px;padding:1px 4px;margin-left:4px}
.carte-sec h4{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pa-arbre{font-family:var(--data);font-size:12px;line-height:1.6;background:var(--papier-2,#F1F2EF);padding:10px 12px;margin:0 0 12px;overflow:auto;border-left:3px solid var(--trait)}
.pause-reg .opt{
  display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--trait);
  font-size:13.5px;cursor:pointer;
}
.pause-reg .opt:last-child{border-bottom:0}
.pause-reg .opt input[type=checkbox]{margin-top:3px;flex:none}
.pause-reg .opt b{font-weight:normal;display:block}
.pause-reg .opt em{display:block;font-style:normal;font-size:12.5px;color:var(--encre-2);margin-top:1px}
.pause-reg .opt input[type=number]{width:58px;text-align:center;padding:2px 4px;font-size:12.5px}
.rep .src{font-family:var(--data);font-size:10.5px;color:var(--encre-3)}
.mod-fermer{
  appearance:none;background:none;border:0;color:var(--encre-3);font-size:20px;line-height:1;
  cursor:pointer;padding:0 4px;margin-left:auto;
}
.mod-fermer:hover{color:var(--rouge)}

/* ---------- controles ---------- */
button.b,a.b{
  appearance:none;font-family:var(--display);font-variation-settings:"wght" 600,"wdth" 87.5;
  font-size:13px;letter-spacing:.05em;text-transform:uppercase;
  padding:7px 13px;border:1px solid var(--encre);background:var(--encre);color:#fff;
  border-radius:2px;cursor:pointer;text-decoration:none;display:inline-block;transition:opacity .12s;
}
button.b:hover,a.b:hover{opacity:.82}
button.b.creux{background:transparent;color:var(--encre)}
button.b.rouge{background:var(--rouge);border-color:var(--rouge)}
button.b.mini{font-size:11.5px;padding:4px 9px}
button.lien{
  appearance:none;background:none;border:0;padding:0;color:var(--ardoise);
  cursor:pointer;font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:2px;
}
button.lien.danger{color:var(--rouge)}
input,select,textarea{font-family:var(--corps);font-size:14px;color:var(--encre)}
/* Un champ gele n'est pas un champ en panne : il montre une valeur calculee ailleurs.
   Le fond mat et le curseur par defaut disent « a lire », pas « a remplir ». */
input:disabled,select:disabled,textarea:disabled{
  background:var(--beton-2);color:var(--encre-2);cursor:default;border-style:dashed;
}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select{
  padding:6px 8px;border:1px solid var(--trait);border-radius:2px;background:#fff;max-width:100%;
}
input:focus,select:focus{outline:2px solid var(--ardoise);outline-offset:-1px}
label.champ{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--encre-2);
  font-family:var(--display);letter-spacing:.05em;text-transform:uppercase}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:11px}
.grille>*{min-width:0}

/* ---------- tableau ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;font-family:var(--display);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--encre-2);border-bottom:1px solid var(--encre);padding:6px 8px;white-space:nowrap;
}
td{padding:7px 8px;border-bottom:1px solid var(--trait);vertical-align:top}
tbody tr:hover{background:#F2F3F0;cursor:pointer}
.appel .aff{font-family:var(--data);font-size:11.5px;color:var(--encre-3);margin-top:2px}
/* label.champ met ses descendants en capitales : le rappel du dossier s'en affranchit */
.champ .rappel-aff{
  text-transform:none;letter-spacing:0;font-family:var(--corps);font-size:12px;
  color:var(--encre-2);margin-top:3px;
}

/* ---------- comptes rendus ---------- */
dialog.cr-dlg{max-width:720px;width:calc(100% - 28px)}
.cr-tete{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--trait);flex:0 0 auto}
.cr-tete h3{font-size:15px;letter-spacing:.08em;text-transform:uppercase;flex:1}
.cr-corps{padding:16px;overflow:auto;flex:1 1 auto;min-height:0}
.cr-corps textarea{
  width:100%;height:min(52vh,420px);resize:vertical;padding:10px;
  border:1px solid var(--trait);border-radius:2px;background:#fff;color:var(--encre);
  font-family:var(--data);font-size:12.5px;line-height:1.55;white-space:pre;overflow-wrap:normal;
}
.cr-corps textarea:focus{outline:2px solid var(--ardoise);outline-offset:-1px}
.cr-pied{display:flex;column-gap:8px;row-gap:10px;padding:12px 16px;border-top:1px solid var(--trait);
  background:#F1F2EF;flex-wrap:wrap;align-items:center;flex:0 0 auto}
.cr-pied .droite{margin-left:auto;display:flex;column-gap:8px;row-gap:10px;flex-wrap:wrap;justify-content:flex-end}
.cr-pied>.droite:not(:first-child){flex:1 0 auto}
@media(max-width:760px){ .cr-pied>.droite:not(:first-child){flex-basis:100%;margin-left:0} }

/* ---------- idees ---------- */
.id-bulles{
  position:relative;margin-top:10px;border:1px solid var(--trait);border-radius:2px;
  background:#FBFBF8;overflow:hidden;
}
.id-bulles svg{display:block;width:100%;touch-action:none;cursor:grab}
.id-bulles svg.saisi{cursor:grabbing}
.id-b{cursor:pointer}
.id-b circle{transition:fill-opacity .12s}
.id-b:hover circle{fill-opacity:.42}
.id-b.on:hover circle{fill-opacity:1}
.id-b text{
  font-family:var(--display);font-size:10.5px;fill:var(--encre-2);text-anchor:middle;pointer-events:none;
  paint-order:stroke;stroke:#FBFBF8;stroke-width:3px;stroke-linejoin:round;  /* lisible par-dessus une bulle */
}
.id-b.on text{fill:var(--encre);font-weight:600}
.id-b.cri text{font-size:11.5px;font-weight:700;fill:var(--encre)}
.id-b .id-f{transition:transform .7s cubic-bezier(.34,1.56,.64,1)}  /* eclosion du cristal */
.id-mem{cursor:pointer}
/* le trait visible ne reçoit rien ; c'est l'anneau transparent qui porte le clic,
   sinon le disque plein avalerait les glissers du fond */
.id-mem .trait{pointer-events:none;transition:stroke-width .12s}
.id-mem .prise{pointer-events:stroke;fill:none;stroke:transparent;stroke-width:16px}
.id-mem:hover .trait{stroke-width:2.6}
.id-mem text{
  font-family:var(--display);font-size:12px;font-weight:600;text-anchor:middle;pointer-events:none;
  paint-order:stroke;stroke:#FBFBF8;stroke-width:3.5px;stroke-linejoin:round;
}
.id-zoom{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.id-zoom button{min-width:26px;background:rgba(251,251,248,.92)}
@media (prefers-reduced-motion:reduce){ .id-b .id-f{transition:none} }
.id-pst{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.id-src{font-family:var(--data);font-size:11.5px;color:var(--encre-3);margin-top:4px;line-height:1.5}

/* ---------- modale ---------- */
dialog{
  border:1px solid var(--encre);border-top:4px solid var(--rouge);border-radius:2px;padding:0;
  max-width:720px;width:calc(100% - 28px);background:var(--papier);color:var(--encre);
  /* Sans plafond sur la fenetre elle-meme, tete + corps + pied peuvent depasser l'ecran
     et c'est le pied qui sort du cadre : les boutons du bas deviennent inatteignables.
     C'est la fenetre qui borne, et le corps qui cede. */
  max-height:calc(100vh - 24px);
}
@supports(height:100dvh){ dialog{max-height:calc(100dvh - 24px)} }
/* [open] est indispensable : une dialog fermee doit rester en display:none. */

dialog::backdrop{background:rgba(25,28,27,.45)}

/* Le pied passe a la ligne des qu'il manque de place. Sans flex-basis, le groupe de
   droite se coince contre le dernier bouton de gauche et les deux rangees se lisent
   comme une seule ; sans flex-wrap sur le groupe lui-meme, ses boutons debordent. */
.mod-pied .droite{margin-left:auto;display:flex;column-gap:8px;row-gap:10px;flex-wrap:wrap;justify-content:flex-end}
.mod-pied>.droite:not(:first-child){flex:1 0 auto}

  .mod-pied{row-gap:12px}
  .mod-pied>.droite:not(:first-child){flex-basis:100%;margin-left:0}
}

<script>
"use strict";

/* ================= etat ================= */
var APP_VERSION = "1.5-public";

/* ============================================================
   NOM DU POSTE — a modifier ici lors du deploiement sur un
   nouveau poste. Il sert d'affichage avant tout chargement de
   fichier (animation d'ouverture, titre de l'onglet).
   Une fois le fichier ouvert, le nom enregistre dedans prend
   le relais.
   ============================================================ */
var NOM_DEFAUT = "My Pilot Professional Edition";
var VERSION = 1;   /* version du schema de donnees */
var TYPES_DEFAUT = ["Visite de chantier","Consignation","Mise hors tension","Réception / DOE",
  "Réunion","Déraccordement","Autre"];
var OUVRAGES = ["Non défini","HTA aérien","HTA souterrain","BT aérien","BT souterrain","Mixte"];
var STATUTS = [["planifie","Planifié"],["en_cours","En cours"],["realise","Réalisé"],
  ["reporte","Reporté"],["annule","Annulé"]];
var STATUTS_RDV = [["a_planifier","À planifier"],["planifie","Planifié"],["a_preparer","À préparer"],
  ["pret","Prêt pour RDV"],["prepa_cr","Préparation CR"],["termine","Terminé"],
  ["reporte","Reporté"],["annule","Annulé"]];
var CATS_RDV = {convocation:1,animation:1};
var CLOS = {realise:1,termine:1};
var ENCOURS = {en_cours:1,a_preparer:1,pret:1,prepa_cr:1};
function statutsDe(cat){
  var K=catParCle(cat);
  return K ? jeuStatuts(K.statuts) : STATUTS;
}
function statutClos(cat){
  var K=catParCle(cat);
  if(!K) return "realise";
  var l=jeuStatuts(K.statuts),marque=K.clos||"realise",t=null;
  l.forEach(function(x){ if(!t && estMarqueClos(x[0],marque)) t=x[0] });
  return t||(l.length?l[l.length-1][0]:"realise");
}
function estMarqueClos(valeur,marque){
  if(!marque) return false;
  if(marque.length<=2) return String(valeur).charAt(0)===marque.charAt(0);   /* prefixe symbolique */
  return String(valeur)===marque;
}
function etatClos(){
  var l=D.parametres.etats_affaire||ETATS_AFFAIRE,t="λ. - Clos";
  l.forEach(function(v){ if(String(v).charAt(0)==="\u03bb") t=v });
  return t;
}
function estClos(c){
  if(!c) return false;
  var K=catParCle(c.categorie||"chantier");
  if(!K) return !!CLOS[c.statut];
  return estMarqueClos(c.statut,K.clos);
}
function estAnnule(c){ return (c && c.statut)==="annule" }

/* ================= evenements =================
   Une activite n'a plus UNE date mais une liste d'evenements : un dossier peut
   avoir une visite, puis une reunion, puis une intervention. c.date, c.heure et
   c.duree restent renseignees et portent l'evenement de reference — le prochain
   a venir, ou le dernier passe s'il n'y en a plus. Une trentaine de fonctions
   les lisaient (exports, rapport, tris, import) : elles continuent de marcher
   sans rien savoir des evenements, et les ecrans qui gagnent a tous les montrer
   passent par evenementsDu(). */
var TYPES_EVT=["Rendez-vous","Intervention","Session","R\u00e9union","Visite","Point t\u00e9l\u00e9phonique"];
var ETATS_EVT=[["prevu","Pr\u00e9vu"],["realise","R\u00e9alis\u00e9"],["annule","Annul\u00e9"],["reporte","Report\u00e9"]];
/* la categorie d'origine dit le plus souvent de quoi il s'agit : on s'en sert pour
   la reprise des activites deja datees, et comme proposition a la saisie. */
var TYPE_EVT_PAR_CAT={chantier:"Intervention",convocation:"Rendez-vous",
                      animation:"Session",transverse:"R\u00e9union"};

function typesEvt(){
  var p=D.parametres||(D.parametres={});
  if(!estTableau(p.types_evenement) || !p.types_evenement.length) p.types_evenement=TYPES_EVT.slice();
  return p.types_evenement;
}
function typeEvtDeCat(cle){
  var t=TYPE_EVT_PAR_CAT[String(cle||"")];
  if(t) return t;
  var l=typesEvt();
  return l.length?l[0]:"Rendez-vous";
}
function libEtatEvt(v){
  var r=String(v||"prevu");
  for(var i=0;i<ETATS_EVT.length;i++) if(ETATS_EVT[i][0]===r) return ETATS_EVT[i][1];
  return r;
}
function evenements(c){
  if(!c) return [];
  if(!estTableau(c.evenements)) c.evenements=[];
  return c.evenements;
}
/* un evenement annule ne compte ni pour le pilotage ni pour la date de reference :
   il reste visible dans la fiche, parce qu'effacer une annulation efface l'histoire. */
function evtVivant(e){ return !!e && e.statut!=="annule" }
function evtNormaliser(e,cle){
  e=e||{};
  return {id:e.id||("e"+uid()),
          date:dateValide(e.date)?e.date:"",
          heure:String(e.heure||""),
          duree:+e.duree||0,
          type:String(e.type||typeEvtDeCat(cle)),
          statut:String(e.statut||"prevu"),
          libelle:String(e.libelle||""),
          source:String(e.source||"")};
}
/* L'import ne connait qu'une date d'intervention : elle pilote UN evenement, le sien,
   marque source:"import". Les evenements ajoutes a la main ne sont jamais touches —
   sans cela, reimporter le fichier effacerait la reunion qu'on venait de poser. */
function evtImport(c,date){
  var l=evenements(c),e=null;
  l.forEach(function(x){ if(x.source==="import") e=x });
  if(!date){
    if(e) c.evenements=l.filter(function(x){ return x!==e });
  }else if(e){ e.date=date }
  else{
    var n=evtNormaliser({date:date,type:typeEvtDeCat(c.categorie)},c.categorie);
    n.source="import"; l.push(n);
  }
  return syncDates(c);
}
function evtsTries(c){
  return evenements(c).slice().sort(function(a,b){
    return (String(a.date||"9999")+String(a.heure||"99:99"))
      .localeCompare(String(b.date||"9999")+String(b.heure||"99:99"));
  });
}
/* l'evenement de reference : le prochain non annule, a defaut le dernier passe.
   C'est lui qui alimente c.date — donc le planning, les tris et les exports. */
function evtReference(c){
  var h=auj(), t=evtsTries(c).filter(function(e){ return e.date });
  var l=t.filter(evtVivant);
  /* s'il ne reste que des annulations, la date reste celle du dernier evenement :
     une reunion annulee a quand meme eu lieu dans l'agenda, l'effacer de la liste
     des activites la ferait passer pour jamais datee. Le pilotage, lui, ne regarde
     que les evenements vivants — voir evtAVenir(). */
  if(!l.length) return t.length?t[t.length-1]:null;
  for(var i=0;i<l.length;i++) if(l[i].date>=h) return l[i];
  return l[l.length-1];
}
function evtAVenir(c){
  var h=auj();
  return evtsTries(c).filter(function(e){ return evtVivant(e) && e.date && e.date>=h });
}
/* ================= projets =================
   Voir l'en-tete du patch 3.38.0 pour les arbitrages. En deux mots : le jalon est
   coche et non deduit, l'avancement est calcule et non saisi, l'echeance ne bouge
   pas sans motif. */

function projet(c){ return (c && c.projet && c.projet.actif===true) ? c.projet : null }
function estProjet(c){ return !!projet(c) }

function normaliserProjet(p){
  if(!estObjet(p)) return null;
  return {
    actif: p.actif===true,
    deadline: dateValide(p.deadline) ? p.deadline : "",
    /* Un report sans motif n'est pas un report : on ne le garde pas, sinon
       l'historique raconterait des deplacements que personne n'a justifies. */
    reports: (estTableau(p.reports)?p.reports:[]).map(function(r){
      return {le:dateValide(r.le)?r.le:"", de:dateValide(r.de)?r.de:"",
              vers:dateValide(r.vers)?r.vers:"", motif:String((r&&r.motif)||"").trim()};
    }).filter(function(r){ return r.motif && r.vers })
  };
}
/* L'echeance d'origine est LUE dans l'historique, jamais stockee a part : deux
   champs pour une meme verite finissent toujours par diverger. */
function deadlineInitiale(p){
  return (p && p.reports.length && p.reports[0].de) ? p.reports[0].de : (p?p.deadline:"");
}

/* ---- les jalons ---- */
/* Un evenement coche (e.jalon) ou une tache cochee (n.suite.jalon). On rend une
   forme commune pour que l'affichage n'ait pas a savoir d'ou vient l'etape. */
function jalons(c){
  var h=auj(), l=[];
  evenements(c).forEach(function(e){
    if(!e.jalon) return;
    l.push({cle:"e:"+e.id, genre:"evenement",
            libelle:(e.libelle||e.type||"Événement"), date:e.date||"",
            valide:e.statut==="realise", annule:e.statut==="annule"});
  });
  (D.notes||[]).forEach(function(n){
    if(n.chantier_id!==c.id) return;
    var s=n.suite; if(!s || !s.texte || !s.jalon) return;
    l.push({cle:"t:"+n.id, genre:"tache", libelle:s.texte,
            date:s.echeance||"", valide:!!s.fait, annule:false});
  });
  l.forEach(function(j){ j.retard = !j.valide && !j.annule && !!j.date && j.date<h });
  /* sans date en dernier : une etape non datee ne s'intercale nulle part */
  return l.sort(function(a,b){
    return (a.date||"9999-99-99").localeCompare(b.date||"9999-99-99");
  });
}
/* Un jalon annule ne compte ni au numerateur ni au denominateur : il a ete retire
   du projet, pas rate. */
function avancement(c){
  var l=jalons(c).filter(function(j){ return !j.annule });
  var ok=0, tard=0;
  l.forEach(function(j){ if(j.valide) ok++; if(j.retard) tard++ });
  return {total:l.length, valides:ok, retard:tard,
          pct: l.length ? Math.round(ok*100/l.length) : 0};
}
/* Tout ce qu'une ligne de projet a besoin de savoir, en un appel. */
function etatProjet(c){
  var p=projet(c), a=avancement(c), h=auj();
  var fini = a.total>0 && a.valides===a.total;
  return {p:p, a:a, fini:fini,
          depasse: !!p.deadline && p.deadline<h && !fini,
          /* negatif = il reste des jours, positif = l'echeance est passee */
          jours: p.deadline ? joursEcartSigne(h,p.deadline) : null,
          reports: p.reports.length,
          initiale: deadlineInitiale(p)};
}
/* joursDepuis() plafonne a zero — utile ailleurs, inutilisable ici : un projet a
   besoin de savoir combien de jours il lui RESTE. */
function joursEcartSigne(de,vers){
  var a=new Date(de+"T00:00:00"), b=new Date(vers+"T00:00:00");
  return Math.round((b-a)/86400000);
}

/* Les projets vivants, les plus urgents d'abord : depasses, puis par echeance, puis
   ceux qui n'en ont pas encore. */
function projets(){
  return (D.chantiers||[]).filter(function(c){
    return estProjet(c) && !estArchive(c) && !estAnnule(c);
  }).sort(function(x,y){
    var a=etatProjet(x), b=etatProjet(y);
    if(a.fini!==b.fini) return a.fini?1:-1;
    if(a.depasse!==b.depasse) return a.depasse?-1:1;
    var da=a.p.deadline||"9999-99-99", db=b.p.deadline||"9999-99-99";
    if(da!==db) return da.localeCompare(db);
    return String(x.libelle||"").localeCompare(String(y.libelle||""));
  });
}
/* Ce qui merite d'apparaitre sur l'ecran du jour : ce qui est depasse, ce qui arrive
   sous huit jours, ou ce qui traine un jalon en retard. Le reste vit dans l'onglet. */
function projetsARisque(){
  return projets().filter(function(c){
    var e=etatProjet(c);
    if(e.fini) return false;
    return e.depasse || e.a.retard>0 || (e.jours!==null && e.jours<=8);
  });
}

/* ---- la barre ---- */
function fragJauge(a){
  return '<div class="jauge'+(a.pct>=100?" atteint":"")+'" role="img"'
    +' aria-label="'+a.valides+' jalon(s) validé(s) sur '+a.total+'">'
    +'<i style="width:'+a.pct+'%"></i></div>';
}
function libJalons(a){
  if(!a.total) return "aucun jalon";
  return a.valides+" / "+a.total+" jalon"+(a.total>1?"s":"")
    +(a.retard?" · "+a.retard+" en retard":"");
}

function syncDates(c){
  if(!c) return c;
  var e=evtReference(c);
  if(e){ c.date=e.date; c.heure=e.heure||""; c.duree=+e.duree||0 }
  else { c.date=""; c.heure=""; }
  return c;
}
function classeStatut(c){
  if(estClos(c)) return "vert";
  var v=String(c&&c.statut||"");

  var K=catParCle((c&&c.categorie)||"chantier");
  if(K && K.statuts!=="statuts_rdv" && K.statuts!=="statuts_simples")
    return v.charAt(0)==="\u03b1" ? "gris" : "jaune";     /* jeu de statuts : alpha = non engage */
  return ENCOURS[v]?"jaune":"gris";
}

function seancesPerm(){

  if(!estTableau(P.seances)) P.seances=[];

}
function seancesDu(d){
  return seancesPerm().filter(function(s){ return s.jour===d });
}
function seanceOuverte(d){
  var l=seancesDu(d),t=null;
  l.forEach(function(s){ if(!s.fin) t=s });
  return t;
}
function minutesPermanence(d){
  var n=minutes(hNow()),t=0;
  seancesDu(d).forEach(function(s){
    var f=s.fin?minutes(s.fin):(d===auj()?n:minutes(s.debut));
    t+=Math.max(0,f-minutes(s.debut));
  });
  return t;
}
function plagePermanence(d){
  var l=seancesDu(d);
  if(!l.length) return "";
  var deb=l[0].debut,fin=l[l.length-1].fin;
  return deb+(fin?" à "+fin:"");
}

/* ================= utilitaires ================= */
function $(s,r){return (r||document).querySelector(s)}
function esc(v){
  return String(v==null?"":v).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function iso(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function pIso(s){var p=String(s||"").split("-");return new Date(+p[0],+p[1]-1,+p[2],12,0,0)}
function auj(){return iso(new Date())}
function hNow(){var d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function libDate(s){
  if(!dateValide(s)) return "";
  var d=pIso(s);
  return d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
function dateValide(v){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v||""));
  if(!m) return false;
  var a=+m[1],mo=+m[2],j=+m[3];
  if(a<1900 || a>2200 || mo<1 || mo>12 || j<1 || j>31) return false;
  var d=new Date(a,mo-1,j);      /* refuse le 31 fevrier, que JS decalerait en mars */
  return d.getFullYear()===a && d.getMonth()===mo-1 && d.getDate()===j;
}
function libCourt(s){
  if(!dateValide(s)) return "";
  return pIso(s).toLocaleDateString("fr-FR",{weekday:"short",day:"2-digit",month:"2-digit"});
}

/* ---- jours feries et jours ouvres ---- */
function paques(y){
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
      f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
      h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,
      l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
      mo=Math.floor((h+l-7*m+114)/31),j=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,j,12,0,0);
}
var cacheFeries={};
function feries(y){
  if(cacheFeries[y]) return cacheFeries[y];
  var P=paques(y),o={};
  function plus(n){var d=new Date(P.getTime());d.setDate(d.getDate()+n);return d}
  o[y+"-01-01"]="Jour de l'an";
  o[iso(plus(1))]="Lundi de Pâques";
  o[y+"-05-01"]="Fête du travail";
  o[y+"-05-08"]="Victoire 1945";
  o[iso(plus(39))]="Ascension";
  o[iso(plus(50))]="Lundi de Pentecôte";
  o[y+"-07-14"]="Fête nationale";
  o[y+"-08-15"]="Assomption";
  o[y+"-11-01"]="Toussaint";
  o[y+"-11-11"]="Armistice 1918";
  o[y+"-12-25"]="Noël";
  cacheFeries[y]=o;
  return o;
}
function motifNonOuvre(s){
  var d=pIso(s),jo=D.parametres.jours_ouvres||[1,2,3,4,5];
  if(jo.indexOf(d.getDay())===-1) return d.getDay()===0?"dimanche":(d.getDay()===6?"samedi":"jour non travaillé");
  var f=feries(d.getFullYear())[s];
  if(f) return f;
  if((D.parametres.absences||[]).indexOf(s)!==-1) return "absence";
  return null;
}
function prochainOuvre(depuis){
  var d=pIso(depuis||auj());
  for(var i=0;i<400;i++){
    d.setDate(d.getDate()+1);
    var s=iso(d);
    if(!motifNonOuvre(s)) return s;
  }
  return iso(d);
}

/* l'archivage masque le dossier des vues operationnelles ; il ne retire rien de l'historique,
   ni les notes, ni les taches, ni les rattachements. */
var ISSUES=[["traite","traité, mené à terme"],["sorti","sorti de mon périmètre"]];
function libIssue(v){
  var t="";
  ISSUES.forEach(function(x){ if(x[0]===v) t=x[1] });
  return t;
}
function archiver(c,motif,issue){
  if(!c || c.archive) return false;
  c.archive=auj(); c.archive_motif=String(motif||"");
  c.archive_issue=(issue==="traite"||issue==="sorti")?issue:"";
  return true;
}
/* un dossier peut aboutir de deux façons : par son etat affaire, ou par un archivage
   declare comme traite. Le rapport ne conserve pas les dossiers soldes. */
function estAbouti(c){
  return estClos(c) || (c && c.archive_issue==="traite");
}
function aQualifier(){
  return D.chantiers.filter(function(c){ return c.archive && !c.archive_issue });
}
function desarchiver(c){

function hhmm(m){

function sessionOuverte(c){
  if(!c || !c.sessions) return null;
  for(var i=c.sessions.length-1;i>=0;i--) if(!c.sessions[i].fin) return c.sessions[i];
  return null;

function minutesSession(c){
  if(!c || !c.sessions || !c.sessions.length) return 0;
  var t=0,n=minutes(hNow()),estAuj=(c.date===auj());
  c.sessions.forEach(function(s){
    var d=minutes(s.debut),f;
    if(s.fin) f=minutes(s.fin);
    else if(estAuj) f=n;      /* session en cours aujourd'hui */
    else return;              /* session oubliee un jour passe : jamais extrapolee */
    if(f>d) t+=f-d;
  });
  return t;
}

function cadenceReelle(c){
  if(!c || !c.traites) return null;
  var ms=minutesSession(c);
  if(ms>=5) return c.traites/(ms/60);        // base chronometre : la plus fiable
  if(!c.jalons || c.jalons.length<2) return null;
  var d=minutes(c.jalons[0].h), f=minutes(c.jalons[c.jalons.length-1].h), ecart=f-d;
  if(ecart<6) return null;
  var apres=0;
  for(var i=1;i<c.jalons.length;i++) apres+=c.jalons[i].n;
  if(apres<=0) return null;
  return apres/(ecart/60);
}

}

function serialise(format){
  D.meta.app="My Pilot Professional Edition";
  D.meta.app_version=APP_VERSION;

function creerFichier(){

  }).then(function(h){

      var a=analyser(txt);

        if(!donneesVides() && !confirm("Ce fichier contient déjà des données de pilotage.\n\nIl sera ouvert (rien n'y sera écrasé), mais ce qui est affiché à l'écran sera remplacé. Continuer ?")) return;

  }

    ecrireFichier(false).then(function(){ if(vueActive==="donnees") rendre() });
    return;
  }

    suggestedName:nomFichier,
    types:[{description:"Données de pilotage",accept:{"application/json":[".json"],"text/javascript":[".js"]}}]
  }).then(function(h){
    return h.getFile().then(function(f){ return f.text() }).then(function(txt){
      var a=analyser(txt);
      if(a.ok && donneesVides()){
        adopter(h,a.data,"Ce fichier contenait des données alors que la session était vide : il a été ouvert");
        return null;

function appliquerTexte(texte,mode){
  var t=String(texte).trim();
  t=t.replace(/^\s*(?:window\.)?[A-Za-z_$][\w$]*\s*=\s*/,"").replace(/;\s*$/,"");
  var o;
  try{ o=JSON.parse(t) }catch(e){ toast("Fichier illisible : ce n'est pas du JSON valide",true); return }
  if(!estObjet(o) || o.chantiers===undefined || o.notes===undefined){
    toast("Fichier non reconnu : ce n'est pas un export de données du pilotage",true); return;
  }
  var pb=validerDonnees(o);
  if(pb){ toast("Fichier refusé — "+pb+" Vos données actuelles sont intactes.",true); return }

    /* Le fichier absorbe doit subir exactement la meme reprise que s'il remplacait
       tout : sinon une sauvegarde d'avant la 3.35.0 entre ici avec des activites
       datees mais sans evenement — invisibles au planning, et dedatees au premier
       enregistrement de leur fiche. On normalise, puis on fusionne le resultat. */
    var on=normaliser(o);

    D.notes.forEach(function(n){vusN[n.id]=1});

    D=normaliser(o); M=D.carte;
    marquerCharge();
    toast("Données remplacées : "+D.chantiers.length+" activité(s), "+D.notes.length+" note(s)");
    if(ORPHELINS.n) setTimeout(function(){
      toast(ORPHELINS.n+" fiche(s) portaient une catégorie inconnue et ont été rattachées à "
        +ORPHELINS.vers+" — voir Options",true);

function engrenage(cx,cy,ro,ri,n){
  n=n||8;
  var p=[],st=Math.PI/n,i,r,a;
  for(i=0;i<2*n;i++){

    a = i*st-st*0.34; p.push((cx+r*Math.cos(a)).toFixed(2)+" "+(cy+r*Math.sin(a)).toFixed(2));
    a = i*st+st*0.34; p.push((cx+r*Math.cos(a)).toFixed(2)+" "+(cy+r*Math.sin(a)).toFixed(2));
  }
  return "M"+p.join(" L")+" Z";
}

function bip(n){
  try{
    var A=window.AudioContext||window.webkitAudioContext;
    if(!A) return;
    ctxAudio=ctxAudio||new A();
    if(ctxAudio.state==="suspended") ctxAudio.resume();
    var t0=ctxAudio.currentTime;
    for(var i=0;i<(n||2);i++){
      var o=ctxAudio.createOscillator(),g=ctxAudio.createGain(),d=t0+i*0.28;
      o.type="sine"; o.frequency.value=i%2?740:880;
      g.gain.setValueAtTime(0.0001,d);
      g.gain.exponentialRampToValueAtTime(0.12,d+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,d+0.20);
      o.connect(g); g.connect(ctxAudio.destination);
      o.start(d); o.stop(d+0.22);
    }
  }catch(e){}
}

  for(i=0;i<D.chantiers.length;i++)

      return {qui:D.chantiers[i].contact_nom||"",entreprise:D.chantiers[i].tiers||"",

/* ================= modules de pause =================
   Un element de la carte peut porter un fichier .html range a cote de l'application :

     MyPilot_Pro.html
     ↳ module/
        ↳ jeu.html

   Il s'ouvre dans une fenetre de l'application, dans une iframe. Mesure faite : deux
   documents file:// sont d'origines opaques l'un pour l'autre, donc le module ne peut
   ni lire ni ecrire les donnees du pilotage, et le pilotage ne peut pas entrer dans le
   module. L'attribut sandbox, lui, est a proscrire ici : il met l'iframe en origine
   nulle et le navigateur refuse alors au module ses propres css, js et images.

   L'application reste sans reseau. Un module, lui, fait ce que son auteur a ecrit : s'il
   appelle une bibliotheque en ligne, il ne fonctionnera pas sur un poste sans acces. */
/* Un element peut porter un lien : playlist, podcast, page de revision. L'application
   n'appelle jamais rien d'elle-meme — elle passe l'adresse au systeme, exactement comme
   si vous la tapiez. Les schemas qui executent du code dans la page sont refuses. */
var SCHEMAS_INTERDITS={javascript:1,data:1,vbscript:1,blob:1};
function lienSain(v){
  var s=String(v||"").trim();
  if(!s || /[\u0000-\u001f\u007f]/.test(s)) return "";
  var m=/^([a-zA-Z][a-zA-Z0-9+.\-]*):/.exec(s);
  if(!m) return "";                                   /* un lien dit son protocole */
  if(SCHEMAS_INTERDITS[m[1].toLowerCase()]) return "";
  return s;
}
function ouvrirLien(u){
  var s=lienSain(u); if(!s){ toast("Lien invalide",true); return }
  /* un <a> plutot que window.open : les schemas applicatifs (spotify:, etc.) passent */
  var a=document.createElement("a");
  a.href=s; a.target="_blank"; a.rel="noopener noreferrer";
  document.body.appendChild(a); a.click(); a.parentNode.removeChild(a);
}
function nomDossierModule(v){
  var s=String(v==null?"module":v).trim().replace(/^[\/\\]+|[\/\\]+$/g,"");
  if(!s || /(^|[\/\\])\.\.([\/\\]|$)/.test(s)) return "module";
  return s.replace(/\\/g,"/");
}
function cheminModuleSain(v){
  var s=String(v||"").trim().replace(/^[\/\\]+/,"").replace(/\\/g,"/");
  if(!s) return "";
  if(/(^|\/)\.\.(\/|$)/.test(s)) return "";       /* on ne remonte pas hors du dossier */
  if(!/\.x?html?$/i.test(s)) return "";            /* un module est une page, rien d'autre */
  return s;
}
function urlModule(fichier){
  var f=cheminModuleSain(fichier); if(!f) return "";
  return nomDossierModule(M.reglages.dossier_modules)+"/"+f;
}

function construireBoiteModule(){
  if(jeuBoite) return jeuBoite;

/* Le temps de l'activite, au cadran. Passe l'echeance, le decompte repart en negatif
   et vire au rouge : la pause n'est pas interrompue, elle est seulement chiffree. */
var jeuChrono=null, jeuDepasseVu=false;
function mmss(ms){
  var s=Math.floor(Math.abs(ms)/1000);
  var hh=Math.floor(s/3600), mm=Math.floor((s%3600)/60), ss=s%60;
  var d2=function(n){ return (n<10?"0":"")+n };
  return hh ? (hh+":"+d2(mm)+":"+d2(ss)) : (d2(mm)+":"+d2(ss));
}
function arreterChrono(){
  if(jeuChrono){ clearInterval(jeuChrono); jeuChrono=null }
}
function demarrerChrono(minutes){
  arreterChrono(); jeuDepasseVu=false;
  var e=$("#jeuChrono"); if(!e) return;
  var t0=Date.now(), cible=Math.max(0,+minutes||0)*60000;
  e.hidden=false; e.classList.remove("depasse");
  var pas=function(){
    var z=$("#jeuChrono");
    /* la fenetre a pu etre fermee entre deux battements : rien ne tourne en fond */
    if(!z || !jeuBoite || !jeuBoite.open){ arreterChrono(); return }
    var ecoule=Date.now()-t0;
    if(cible>0){
      var reste=cible-ecoule, trop=reste<0;
      z.innerHTML='<em>'+(trop?"dépassé de":"il reste")+'</em>'+(trop?"−":"")+esc(mmss(reste));
      z.classList.toggle("depasse",trop);
      z.title=trop?"Le temps prévu pour cette activité est dépassé":"Temps restant sur cette activité";
      if(trop && !jeuDepasseVu){
        jeuDepasseVu=true;
        toast("Temps de la pause atteint \u00b7 le décompte continue en négatif");
      }
    }else{
      z.innerHTML='<em>écoulé</em>'+esc(mmss(ecoule));
      z.title="Aucune durée n’est fixée sur cette activité : temps écoulé depuis l’ouverture";
    }
  };
  pas(); jeuChrono=setInterval(pas,1000);
}

   Rien qui touche aux donnees : l'isolement doit rester entier. */

    if(d.mypilot==="pret"){ var v=$("#jeuVide"); if(v) v.innerHTML=""; return }
    if(d.mypilot==="fermer") fermerModule();
  });
}

  }

        if(r.done) return;

        return suite();

   navigateurs bloquent et qui ne respecte pas la mise en forme de l'application.
   Elle s'ouvre par-dessus la modale courante sans la fermer. */
function saisirValeur(question,defaut){

/* Tout ce qui fait un element de la carte se regle au meme endroit : son nom, sa duree,

function reglerElement(item){

          +'<input type="number" id="raDur" min="0" step="5" placeholder="10"></label>'

/* Meme empilement que saisirValeur, mais sur un champ date : taper « 2026-11-03 »

/* Echap ferme une <dialog> par defaut : on intercepte pour la meme garde. */

/* ================= saisie des dates et des heures =================
   Un <input type="date"> s'affiche dans la langue du NAVIGATEUR, pas dans celle de la
   page : mesure faite, poser lang="fr" sur le document n'y change rien. Sur un poste
   anglophone la saisie se lit mm/jj/aaaa et 02:30 PM — penible, et surtout une vraie
   source d'erreur de date quand le jour est <= 12.

   Plutot que d'imposer un format, on en fait un reglage (Options > Format des dates) :
     « auto » — les champs natifs tels que le navigateur les rend. C'est le defaut :
                rien ne bouge pour qui est deja en francais.
     « fr »   — nos champs, jj/mm/aaaa et 24 h, le selecteur natif conserve derriere
                un bouton (showPicker()), pour ne pas perdre le calendrier en route.

   LE CONTRAT, et c'est lui qui rend ce changement petit : en mode « fr » le champ
   visible est un <input type="text">, mais sa propriete .value rend et accepte
   toujours de l'ISO aaaa-mm-jj (et hh:mm pour les heures). Les quelque soixante-dix
   lectures de l'application — valChamp(), $("#fevDate").value, perDeb.value... — n'ont
   donc pas une ligne a changer, et un futur champ date n'a rien a savoir de tout ceci. */

var DESC_VAL=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,"value");
function brutVal(e){ return DESC_VAL.get.call(e) }        /* le texte reellement tape */
function poserBrut(e,t){ DESC_VAL.set.call(e,t) }

function fmtDate(){
  return (typeof D!=="undefined" && D && D.parametres && D.parametres.format_date==="fr")
    ? "fr" : "auto";
}

/* ISO <-> jj/mm/aaaa. Toute valeur illisible rend "" : un champ a moitie tape ne doit
   jamais produire une date fausse — c'est exactement ce que fait un champ natif. */
function jmaDe(iso){
  return dateValide(iso) ? (iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4)) : "";
}
function isoDeJma(t){
  var s=String(t==null?"":t).trim();
  if(!s) return "";
  if(dateValide(s)) return s;                 /* deja de l'ISO : on laisse passer */
  var j,mo,an;
  var m=/^(\d{1,2})\s*[\/.\- ]\s*(\d{1,2})(?:\s*[\/.\- ]\s*(\d{2}|\d{4}))?$/.exec(s);
  if(m){ j=+m[1]; mo=+m[2]; an=m[3]; }
  else{
    /* la frappe rapide, sans separateur : 12112026 ou 121126 */
    var c=s.replace(/\D/g,"");
    if(c.length===8){ j=+c.slice(0,2); mo=+c.slice(2,4); an=c.slice(4) }
    else if(c.length===6){ j=+c.slice(0,2); mo=+c.slice(2,4); an=c.slice(4) }
    else return "";
  }
  if(an==null || an===""){ an=new Date().getFullYear() }
  else { an=+an; if(an<100) an+=2000 }
  if(!(j>=1 && j<=31 && mo>=1 && mo<=12)) return "";
  var r=String(an)+"-"+String(mo).padStart(2,"0")+"-"+String(j).padStart(2,"0");
  return dateValide(r) ? r : "";
}
/* Les heures : en 24 h le format affiche et le format interne coincident, seule la
   tolerance de saisie change (14h30, 1430, 14:30, et « 9 » pour 09:00). */
function hmValide(t){ return /^([01]\d|2[0-3]):[0-5]\d$/.test(String(t||"")) }
function isoDeHm(t){
  var s=String(t==null?"":t).trim();
  if(!s) return "";
  if(hmValide(s)) return s;
  var h,mi;
  var m=/^(\d{1,2})\s*[:hH.]\s*(\d{1,2})$/.exec(s);
  if(m){ h=+m[1]; mi=+m[2] }
  else{
    var c=s.replace(/\D/g,"");
    if(c.length===4){ h=+c.slice(0,2); mi=+c.slice(2) }
    else if(c.length===3){ h=+c.slice(0,1); mi=+c.slice(1) }
    else if(c.length===1 || c.length===2){ h=+c; mi=0 }
    else return "";
  }
  if(!(h>=0 && h<=23 && mi>=0 && mi<=59)) return "";
  return String(h).padStart(2,"0")+":"+String(mi).padStart(2,"0");
}

/* Les deux emetteurs. « attrs » reprend tels quels les attributs du champ d'origine
   (name=, id=, style=, disabled, title...) : en aval, personne n'a a savoir quel mode
   est actif. */
function inDate(attrs,val){
  var v=dateValide(val)?val:"";
  if(fmtDate()==="auto") return '<input type="date" '+attrs+' value="'+esc(v)+'">';
  var off=/\bdisabled\b/.test(attrs);
  return '<span class="chp-fr">'
    +'<input type="text" '+attrs+' value="'+esc(jmaDe(v))+'" data-fr="date"'
      +' inputmode="numeric" maxlength="10" autocomplete="off" placeholder="jj/mm/aaaa">'
    +(off?"":'<button type="button" class="fr-cal" data-fr-cal tabindex="-1"'
      +' title="Choisir dans le calendrier" aria-label="Choisir dans le calendrier">▦</button>')
    +'</span>';
}
function inHeure(attrs,val){
  var v=hmValide(val)?val:"";
  if(fmtDate()==="auto") return '<input type="time" '+attrs+' value="'+esc(v)+'">';
  return '<input type="text" '+attrs+' value="'+esc(v)+'" data-fr="heure"'
    +' inputmode="numeric" maxlength="5" autocomplete="off" placeholder="hh:mm"'
    +' style="max-width:84px">';
}

/* L'armement : on redefinit .value SUR L'ELEMENT, ce qui masque l'accesseur du
   prototype sans y toucher. Lire rend de l'ISO, ecrire accepte de l'ISO ; le texte
   affiche, lui, reste francais. Un champ deja arme ne l'est pas deux fois. */
function armerChampFr(e){
  if(e.__fr) return; e.__fr=true;
  var genre=e.getAttribute("data-fr");
  var lire=(genre==="heure")?isoDeHm:isoDeJma;
  var ecrire=(genre==="heure")?function(v){ return hmValide(v)?v:"" }
                             :function(v){ return jmaDe(dateValide(v)?v:"") };
  Object.defineProperty(e,"value",{configurable:true,
    get:function(){ return lire(brutVal(e)) },
    set:function(v){ poserBrut(e,ecrire(v)); marquerChampFr(e) }});
  e.addEventListener("input",function(){ marquerChampFr(e) });
  e.addEventListener("blur",function(){
    /* A la sortie du champ on remet au propre ce qui est lisible — « 3/4 » devient
       03/04/2026 — et on laisse tel quel ce qui ne l'est pas, en rouge : effacer la
       frappe de quelqu'un sans prevenir est pire que de lui montrer l'erreur. */
    var v=lire(brutVal(e));
    if(v) poserBrut(e,(genre==="heure")?v:jmaDe(v));
    marquerChampFr(e);
  });
  marquerChampFr(e);
}
function marquerChampFr(e){
  var t=brutVal(e).trim(), mauvais=!!t && !e.value;
  e.classList.toggle("fr-faux",mauvais);
  e.setAttribute("aria-invalid",mauvais?"true":"false");
}
/* Un seul selecteur natif cache pour toute l'application : il ne sert qu'a ouvrir le
   calendrier du navigateur et a reverser la date choisie dans le champ visible. */
function selecteurNatif(){
  var e=$("#frPick");
  if(!e){
    e=document.createElement("input");
    e.type="date"; e.id="frPick"; e.tabIndex=-1; e.setAttribute("aria-hidden","true");
    e.style.cssText="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0";
    document.body.appendChild(e);
    e.addEventListener("change",function(){
      var c=e.__pour;
      if(c && dateValide(e.value)){
        c.value=e.value;
        c.dispatchEvent(new Event("change",{bubbles:true}));
      }
    });
  }
  return e;
}
function ouvrirCalendrierFr(btn){
  var c=btn.parentNode.querySelector('[data-fr="date"]'); if(!c) return;
  var e=selecteurNatif();
  e.__pour=c;
  e.value=c.value||auj();
  try{ e.showPicker() }
  catch(err){ c.focus() }      /* navigateur sans showPicker : on rend la main au champ */
}
/* Les champs arrivent par innerHTML a des dizaines d'endroits — fiches, fenetres,
   ilots rouverts en place. Plutot que de se souvenir de chacun, on observe le document :
   c'est une seule regle, impossible a oublier dans un futur ecran. */
function armerChampsFr(racine){
  var r=racine||document;
  if(r.querySelectorAll) [].forEach.call(r.querySelectorAll("[data-fr]"),armerChampFr);
  if(r.nodeType===1 && r.hasAttribute && r.hasAttribute("data-fr")) armerChampFr(r);
}
/* Le glisser-deposer, en evenements POINTEUR et non en drag-and-drop HTML5.
   Deux raisons, dans cet ordre : le DnD natif ne repond pas aux evenements souris
   synthetiques, donc il serait impossible de le verifier autrement qu'a la main — et
   un mecanisme qu'on ne peut pas eprouver n'a rien a faire ici ; et les evenements
   pointeur fonctionnent aussi au doigt, ce que le DnD natif ne fait pas. */
var chpPris=null, chpSurvole=null, chpXPos=0;
function chpNettoyer(){
  Array.prototype.forEach.call(document.querySelectorAll(".chp-rang"),function(r){
    r.classList.remove("chp-avant","chp-apres","chp-pris");
  });
}
function chpLigneSous(x,y){
  var e=document.elementFromPoint(x,y);
  return (e && e.closest) ? e.closest(".chp-rang") : null;
}
document.addEventListener("pointerdown",function(e){
  var p=e.target.closest && e.target.closest("[data-chdrag]");
  if(!p || e.button) return;
  e.preventDefault();
  chpPris=+p.dataset.chdrag; chpSurvole=chpPris;
  var r=p.closest(".chp-rang"); if(r) r.classList.add("chp-pris");
  try{ p.setPointerCapture(e.pointerId) }catch(x){}
});
/* Le defilement pendant le glisser. Sans lui, un champ ne peut aller que la ou on le
   voit deja : avec vingt-deux champs, la liste depasse largement le cadre et le
   glisser ne servirait presque a rien. On fait defiler des que le pointeur approche
   d'un bord, d'autant plus vite qu'il en est pres. */
var chpY=0, chpTic=null;
function chpPas(){
  var z=document.querySelector("#modCorps"); if(!z) return 0;
  var b=z.getBoundingClientRect(), marge=48;
  if(chpY < b.top+marge)      return -Math.min(22,Math.ceil((b.top+marge-chpY)/3));
  if(chpY > b.bottom-marge)   return  Math.min(22,Math.ceil((chpY-(b.bottom-marge))/3));
  return 0;
}
/* Le defilement tourne sur une horloge, pas sur les mouvements du pointeur : en
   s'appuyant sur pointermove, il s'arretait des que le pointeur se posait au bord —
   c'est-a-dire exactement quand on attend qu'il continue. */
function chpDefiler(y){
  chpY=y;
  if(chpTic) return;
  chpTic=setInterval(function(){
    if(chpPris===null){ chpArreterDefilement(); return }
    var z=document.querySelector("#modCorps"); if(!z) return;
    var pas=chpPas(); if(!pas) return;
    z.scrollTop+=pas;
    /* La ligne survolee change sans que le pointeur bouge : on la recalcule. */
    var r=chpLigneSous(chpXPos,chpY);
    if(r){ var i=+r.dataset.chrow;
      if(i!==chpSurvole){ chpSurvole=i; chpMarquer(r,i) } }
  },16);
}
function chpArreterDefilement(){ if(chpTic){ clearInterval(chpTic); chpTic=null } }
function chpMarquer(r,i){
  chpNettoyer();
  var src=document.querySelector('.chp-rang[data-chrow="'+chpPris+'"]');
  if(src) src.classList.add("chp-pris");
  if(i!==chpPris) r.classList.add(i<chpPris?"chp-avant":"chp-apres");
}
document.addEventListener("pointermove",function(e){
  if(chpPris===null) return;
  chpXPos=e.clientX;
  chpDefiler(e.clientY);
  var r=chpLigneSous(e.clientX,e.clientY);
  if(!r) return;
  var i=+r.dataset.chrow;
  if(i===chpSurvole) return;
  chpSurvole=i;
  chpMarquer(r,i);
});
document.addEventListener("pointerup",function(e){

function lireChantier(c){
  c.libelle=valChamp("libelle")||("Sans libellé");
  c.reference=valChamp("reference");
  /* Les champs date/heure/duree sont desactives sur une fiche existante : c'est la
     liste d'evenements qui fait foi, et syncDates() en deduit c.date. A la creation,
     ils sont actifs et composent le premier evenement. */
  var _ed=$("#modCorps").querySelector('[name="date"]');
  if(_ed && !_ed.disabled){
    var _d=_ed.value.trim(), _l=evenements(c);
    if(_d){
      var _e=_l[0]||evtNormaliser({},c.categorie);
      _e.date=_d; _e.heure=valChamp("heure"); _e.duree=+valChamp("duree")||0;
      _e.type=valChamp("evt_type")||_e.type||typeEvtDeCat(c.categorie);
      if(!_l.length) _l.push(_e);
    }else if(_l.length===1 && _l[0].statut==="prevu"){
      c.evenements=[];      /* on vide la date a la creation : pas d'evenement du tout */
    }
  }
  syncDates(c);
  c.type=valChamp("type");
  c.tiers=valChamp("tiers");
  c.contact_nom=valChamp("contact_nom");
  c.contact_tel=valChamp("contact_tel");
  c.commune=valChamp("commune");
  c.adresse=valChamp("adresse");
  c.statut=valChamp("statut");
  c.priorite=valChamp("priorite");
  c.commentaire=valChamp("commentaire");
  var ep=$("#modCorps").querySelector('[name="eprouvante"]');
  c.eprouvante = ep ? ep.checked : !!c.eprouvante;
  if(false){}
  champsDe(c.categorie||"chantier").forEach(function(f){
    var e=$("#modCorps").querySelector('[name="'+f.cle+'"]');
    if(e) c[f.cle]=e.value.trim();
  });
  var Km=catParCle(c.categorie||"chantier");
  if(Km && Km.miroir) c[Km.miroir]=c.statut;   /* le statut se reflete dans un champ de la categorie */
  return c;
}

/* Poser la premiere echeance est libre ; la deplacer ensuite exige un motif. On refuse
   d'enregistrer sans, plutot que d'accepter un motif vide : une justification
   facultative n'est pas une justification. */
function fenetreEcheance(c){
  var p=projet(c); if(!p) return;
  var premiere=!p.deadline;
  var d=document.createElement("dialog"), fait=false;
  d.className="saisie-val";
  d.innerHTML='<div class="mod-tete"><h3>'
      +(premiere?"Poser l’échéance":"Reporter l’échéance")+'</h3>'
    +'<button class="mod-fermer" data-s="non" title="Annuler">✕</button></div>'
    +'<div class="mod-corps">'
      +(premiere?"":'<div class="note-aide" style="margin:0 0 10px">Échéance actuelle : <b>'
          +esc(libCourt(p.deadline))+'</b>'
          +(p.reports.length?' — déjà reportée '+p.reports.length+' fois':"")+'</div>')
      +'<label class="champ">'+(premiere?"Échéance":"Nouvelle échéance")
        +inDate('id="pjDate"',p.deadline||"")+'</label>'
      +(premiere?'<div class="note-aide" style="margin-top:8px">Une fois posée, elle ne '
          +'pourra plus bouger sans motif.</div>'
        :'<label class="champ" style="margin-top:10px">Motif du report'
          +'<textarea id="pjMotif" maxlength="500" style="width:100%;min-height:72px;padding:8px;'
          +'border:1px solid var(--trait);border-radius:2px;font-family:inherit;font-size:13px" '
          +'placeholder="Ce qui a changé, et pourquoi la date ne tenait plus"></textarea></label>'
          +'<div class="note-aide" style="margin-top:6px">Le motif est conservé, et l’échéance '
          +'d’origine reste affichée sur la ligne du projet.</div>')
    +'</div>'
    +'<div class="mod-pied"><button class="b creux" data-s="non">Annuler</button>'
    +'<div class="droite"><button class="b" data-s="oui">'
      +(premiere?"Poser":"Reporter")+'</button></div></div>';
  document.body.appendChild(d);
  armerChampsFr(d);
  var ed=d.querySelector("#pjDate"), em=d.querySelector("#pjMotif");
  function clore(){ if(fait) return; fait=true; try{ d.close() }catch(x){} d.remove() }
  d.addEventListener("click",function(ev){
    var b=ev.target.closest("[data-s]"); if(!b) return;
    ev.preventDefault(); ev.stopPropagation();
    if(b.dataset.s!=="oui"){ clore(); return }
    var nv=ed.value;
    if(!dateValide(nv)){ ed.focus(); toast("Indiquez une échéance",true); return }
    if(!premiere && nv===p.deadline){ clore(); return }
    var mo=em?em.value.trim():"";
    if(!premiere && !mo){ em.focus(); toast("Un report sans motif n’est pas un report",true); return }
    lireChantier(c);
    if(!premiere) p.reports.push({le:auj(),de:p.deadline,vers:nv,motif:mo});
    p.deadline=nv;
    modifie(); clore(); fermerModale(); editerChantier(c.id);
    toast(premiere?"Échéance posée":"Échéance reportée, motif enregistré");
  });
  d.addEventListener("cancel",function(ev){ ev.preventDefault(); clore() });
  d.showModal();
  if(ed) ed.focus();
}

function signalerSaisieFiche(p){
